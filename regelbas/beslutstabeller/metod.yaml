sannolikhet:
  id: BT-SANN-01
  grund: metodval
  forklaring: Sannolikheten utgår från tjänstens grundnivå i katalogen. Varje sårbarhet som gäller höjer
    den med sin effekt, som högst till hög.
konsekvens:
  id: BT-KONS-01
  grund: metodval
  forklaring: Konsekvensen är tjänstens grundnivå i katalogen.
terrorfinansiering:
  id: BT-TF-01
  grund: metodval
  forklaring: TF bedöms separat. Konsekvensens skyddsintresse är möjlig skada på människor och samhälle
    vid terrorändamål; bedömningsenheten är ett relevant missbruksscenario i tjänsten, inte kundens betalningsbelopp.
    Allvarlig konsekvens behålls provisoriskt. Sannolikhet följer scenariots relevanta hot och TF-faktorer
    i aktuell matris. Ingen TF-kontrollreduktion beräknas; verksam TF-kontroll kan beskrivas lokalt men
    har ingen kalibrerad avdragsskala. Skyddsintresse, fast konsekvens och matrisceller är ej granskade
    metodval. Myndighetens lägesbild fastställer inte dessa val och rapportantal är inte frekvens. TF
    behöver inte vara lägre än PT.
  sakkunnig:
    status: ej_granskad
kvarstaende_ej_belagd:
  id: BT-KVAR-01
  grund: metodval
  forklaring: Om ingen kontroll har belagd utformning, genomförande och dokumenterad verksam effekt för
    samma period är kvarstående risk lika med inneboende risk. Ej bedömd, begränsad eller verkningslös
    effekt ger ingen reduktion.
kvarstaende_sankning:
  id: BT-KVAR-02
  grund: metodval
  forklaring: 'Om minst en kontroll har belagd utformning och genomförande samt dokumenterad verksam effekt
    med utfall och begränsningar för samma period sänks penningtvättsrisken ett steg per tjänst. Ett steg
    och any-kontroll är ogranskade metodval; granskaren ska pröva täckning av tjänstens hot. TF reduceras
    inte av denna regel. Källstöd för effektprövningen: SRC-TS-2026-14; steg är inte ett lagkrav.'
omfattning:
  id: BT-OMF-01
  grund: metodval
  forklaring: PTL 2 kap. 2 § kräver omfattning efter storlek och art. Nivånamn, trösklar (2/10 personer,
    1/2 kontor, 3/10 miljoner kronor), riskutlöst utökning och dokumentlängd är ogranskade metodval. Alla
    nivåer analyserar varje erbjuden tjänst och täcker samma krav. Utökad nivå innebär fler tjänsteknutna
    scenarier och fördjupad kontrolluppföljning; byrån beslutar uppföljningstakt.
  kallor:
  - SRC-PTL
  - SRC-14FS-2024-11
  - SRC-TS-2026-14
  enkel_villkor:
    alla:
    - falt: P-ORG.antal_anstallda
      op: <=
      varde: 2
    - falt: P-ORG.verksamhetsstallen
      op: ==
      varde: 1
    - falt: P-VERK.omsattning
      op: <=
      varde: 3000000.0
    - falt: P-TJ.red05_erbjuds
      op: ==
      varde: false
    - falt: P-TJ.red06_erbjuds
      op: ==
      varde: false
    - falt: P-TJ.red07_erbjuds
      op: ==
      varde: false
    - falt: P-TJ.skatt01_erbjuds
      op: ==
      varde: false
    - falt: P-TJ.bolag01_erbjuds
      op: ==
      varde: false
    - falt: P-TJ.bolag02_erbjuds
      op: ==
      varde: false
    - falt: P-TJ.bolag03_erbjuds
      op: ==
      varde: false
  utokad_villkor:
    nagon:
    - falt: P-ORG.antal_anstallda
      op: '>='
      varde: 10
    - falt: P-ORG.verksamhetsstallen
      op: '>='
      varde: 2
    - falt: P-VERK.omsattning
      op: '>='
      varde: 10000000.0
    - falt: P-TJ.red05_erbjuds
      op: ==
      varde: true
    - falt: P-TJ.red06_erbjuds
      op: ==
      varde: true
    - falt: P-TJ.bolag03_erbjuds
      op: ==
      varde: true
    - falt: P-RISK.komplex_agare
      op: ==
      varde: true
    - falt: P-RISK.utlandsk_agare
      op: ==
      varde: true
    - falt: P-RISK.hogrisktredjeland
      op: ==
      varde: true
scenario:
  hotniva:
    id: BT-HOT-01
    grund: metodval
    forklaring: Källbunden hotnivå höjs ett steg, högst hög, när byrån har iakttagit hotet i tjänsten.
      Saknat eller okänt svar ger ingen höjning och ingen sänkning. Ett steg är ogranskat metodval.
    kallor: &id001
    - SRC-LST-GOR-ARB
    - SRC-TS-2026-14
    sakkunnig:
      status: ej_granskad
  sarbarhetsniva:
    id: BT-SARB-01
    grund: metodval
    forklaring: Effekter summeras med golv låg och tak hög i samma hot och dimension. Ersättning gäller
      bara när ersättande faktor själv verkar i scenariot. +1, minst-en-/andelströsklar och tak är provisoriska
      heuristiska metodval, inga sannolikhetsestimat eller antaganden om oberoende. Varje kvarvarande
      orsak och tillämpat villkor redovisas även efter mättnad. B:s snävare distansvillkor bevaras. Korrelerade
      indikatorer kan mätta modellen. Katalogområden bevisar inte självständiga orsaker och alternativa
      vikter saknar kalibreringsunderlag. En kontra flera orsaker kan därför ha samma nivå utan att orsaksbilden
      är densamma.
    kallor: *id001
    sakkunnig:
      status: ej_granskad
  sannolikhetsmatris:
  - id: BT-SANN-02-01
    grund: metodval
    forklaring: Hotnivå låg och sårbarhetsnivå låg ger sannolikhet låg. Trenivåskalan och denna cell är
      ogranskade metodval inspirerade av EU-metodens tyngre sårbarhetsvikt; inte ett bindande krav eller
      en direkt avskrift av fyrgradig EU-matris.
    kallor:
