  kvarstaende:
    id: BT-KVAR-03
    grund: metodval
    forklaring: Motoravdrag kräver belagd utformning, genomförande och verksam effekt samma period samt
      katalogmål för samma tjänst och hot. Högst ett PT-steg, golv låg, är provisoriskt metodval. Katalogmål
      bevisar inte lokalt uppdrag, stickprov eller full täckning. Lokal analys prövar observationsunderlag,
      begränsningar och godtagbarhet; en oprövad sänkning märks och får inte framställas som godkänd.
      TF får inget avdrag. Ett steg och minst en verksam kontroll är inte myndighetskalibrerade. C-TJ-08/09:s
      äldre breda PT-mål kräver lokal prövning; de utvidgas inte till nya MOD-hot för att sänka tjänstens
      max. En kontroll på ett maxscenario täcker inte andra maxscenarier.
    kallor: *id001
    sakkunnig:
      status: ej_granskad
  aggregering:
    id: BT-TJ-01
    grund: metodval
    forklaring: En väsentlig exponeringskedja ska inte döljas av många låga scenarier. Högsta inneboende
      risk respektive högsta kvarstående PT beräknas var för sig. Alla avgörande scenarier och otäckta
      maxled redovisas; PT och TF hålls åtskilda. Max är ett provisoriskt metodval, inte en föreskriven
      formel. Antal scenarier är katalogberoende och är inte en sannolikhet eller exponeringsandel. Max
      kan dölja bredd i slutnivån, därför måste full scenariomatris och motivering läsas.
    kallor: *id001
    sakkunnig:
      status: ej_granskad
