    grund: metodval
    forklaring: Ett PT-scenario sänks högst ett steg, som lägst låg, om en kontroll riktar sig mot samma
      hot i samma tjänst och har belagd utformning, genomförande och verksam effekt för samma period.
      Annars ingen sänkning. TF sänks inte. Ett steg och valet av minst en kontroll är ogranskade metodval;
