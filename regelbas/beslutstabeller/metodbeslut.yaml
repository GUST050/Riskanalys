- id: D2
  namn: Lön, fakturor och brottsvinster
  grund: metodval
  valt: Avgränsa fakturahotet, behåll brottsvinst som lön
  alternativ:
  - Avgränsa fakturahotet, behåll brottsvinst som lön
  - Behåll H-01 och H-02 i varje löneuppdrag
  skal: Ren löneberedning behandlar löneuppgifter, inte generellt leverantörsfakturor.
    Falskt löneunderlag finns i H-TJ-04; löneuttag som legitimerar brottsvinst finns
    i H-02. H-01 prövas i separat erbjuden faktura-/bokföringstjänst och vid nytt
    utvidgat arbetsmoment.
  osakerhet: En byrå kan ha kombinerade uppdrag och korskopplad insyn. Avgränsningen
    förutsätter tjänstekatalogens rena löneuppdrag; den bevisar inte att fakturakedjor
    saknas hos kunden.
