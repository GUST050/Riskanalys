- id: D1
  namn: Löneberedning och momskarusell
  grund: metodval
  valt: Avgränsa momskarusell från ren löneberedning
  alternativ:
  - Avgränsa momskarusell från ren löneberedning
  - Behåll indirekt momsanknytning i varje löneuppdrag
  skal: Källan knyter momskarusell till fakturor, leveranser och betalning. Ren löneberedning ger inte
    generell insyn i dessa led. Separata erbjudna tjänster bedöms var för sig; falskt löneunderlag och
    löneuttag av brottsvinst kvarstår som andra hot. En indirekt kundanknytning räcker inte för ett eget
    direkt momsscenario i löneberedning.
  osakerhet: Källan avgränsar inte uttryckligen alla löneuppdrag. Det kan finnas kombinerade uppdrag och
    avvikande mandat; dessa behöver lokal motivering och vid behov katalogrevision. Borttaget scenario
    är en potentiell sänkning och redovisas även när tjänstens max är oförändrat.
  kallor:
  - SRC-VAGL-2025-03
  - SRC-NRA-2024-25
  - SRC-TS-2026-14
  kallbelagg:
  - kalla: SRC-VAGL-2025-03
    avsnitt: Underlag och dokumentation; fysisk PDF-sida
    sida: 23
    citat: transportdokumenten
    tolkning: Faktura-, transport- och kontantbetalningsled ger karusellmisstanke; ren löneberedning behandlas
      inte.
  - kalla: SRC-NRA-2024-25
    avsnitt: 7.19; fysisk PDF-sida
    sida: 123
    citat: lön och utdelning
    tolkning: Stöder kvarvarande löneuttag från brottsvinster; inget direkt kalibrerat momskarusellscenario
      för lön.
  - kalla: SRC-TS-2026-14
    avsnitt: Identifiering av tjänster och produkter; fysisk PDF-sida
    sida: 7
    citat: individuell analys
    tolkning: Motiverar prövning per arbetsmoment men föreskriver inte att just denna kataloglänk ska
      tas bort.
