- id: D6
  namn: TF-konsekvens, sannolikhet och kontroll
  grund: metodval
  valt: Behåll allvarlig TF-konsekvens och separat sannolikhet
  alternativ:
  - Behåll allvarlig TF-konsekvens och separat sannolikhet
  - Kalibrera TF-konsekvens och kontrollavdrag per tjänst
  skal: TF bedöms separat. Konsekvensens skyddsintresse är möjlig skada på människor
    och samhälle vid terrorändamål; bedömningsenheten är ett relevant missbruksscenario
    i tjänsten, inte kundens betalningsbelopp. Allvarlig konsekvens behålls provisoriskt.
    Sannolikhet följer scenariots relevanta hot och TF-faktorer i aktuell matris.
    Ingen TF-kontrollreduktion beräknas; verksam TF-kontroll kan beskrivas lokalt
    men har ingen kalibrerad avdragsskala.
  osakerhet: Skyddsintresse, fast konsekvens och matrisceller är ej granskade metodval.
    Myndighetens lägesbild fastställer inte dessa val och rapportantal är inte frekvens.
    TF behöver inte vara lägre än PT.
