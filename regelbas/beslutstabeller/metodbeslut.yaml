- id: D8
  namn: Kontrollernas mål, täckning och avdrag
  grund: metodval
  valt: Behåll högst ett PT-steg per belagt täckt scenario
  alternativ:
  - Behåll högst ett PT-steg per belagt täckt scenario
  - Kalibrera avdrag efter kontrollgrad och scenariotäckning
  skal: Motoravdrag kräver belagd utformning, genomförande och verksam effekt samma
    period samt katalogmål för samma tjänst och hot. Högst ett PT-steg, golv låg,
    är provisoriskt metodval. Katalogmål bevisar inte lokalt uppdrag, stickprov eller
    full täckning. Lokal analys prövar observationsunderlag, begränsningar och godtagbarhet;
    en oprövad sänkning märks och får inte framställas som godkänd. TF får inget avdrag.
  osakerhet: Ett steg och minst en verksam kontroll är inte myndighetskalibrerade.
    C-TJ-08/09:s äldre breda PT-mål kräver lokal prövning; de utvidgas inte till nya
    MOD-hot för att sänka tjänstens max. En kontroll på ett maxscenario täcker inte
    andra maxscenarier.
