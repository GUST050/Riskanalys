  - Vikta eller medelvärdesbilda scenarier
  skal: En väsentlig exponeringskedja ska inte döljas av många låga scenarier. Högsta
    inneboende risk respektive högsta kvarstående PT beräknas var för sig. Alla avgörande
    scenarier och otäckta maxled redovisas; PT och TF hålls åtskilda. Max är ett provisoriskt
    metodval, inte en föreskriven formel.
  osakerhet: Antal scenarier är katalogberoende och är inte en sannolikhet eller exponeringsandel.
    Max kan dölja bredd i slutnivån, därför måste full scenariomatris och motivering
    läsas.
