  aterforing: 'Vid avslag: ompröva T-RED-04:s H-MOD-02-länk och arbetsmoment, återställ
    eller villkora den uttryckligen i ny regelversion. Bind om D1 och senare beslut
    som binder T-RED-04. Räkna om sexfall/kontraster och hela scenariokatalogen, uppdatera
    modellvalideringsfacit, bygg nya analyser/skrivunderlag/rapporter/PDF:er och sakkunnigpaket
    samt kräv ny samlad sakgranskning. Äldre låsta paket bevaras.'
