- id: D-LAGRE
  namn: Potentiellt lägre risk och nivåeffekt
  grund: metodval
  valt: Enbart redovisning, ingen automatisk nivåeffekt
  alternativ:
  - Enbart redovisning, ingen automatisk nivåeffekt
  - Avdrag efter belagd relevans-, överlapps- och kontrollprövning
  skal: PTL:s omständigheter kan tyda på låg risk men anger inga automatiska avdrag.
    Nuvarande data räcker inte för att knyta lägre kundrisk till varje tjänsts specifika
    missbruksscenario eller skilja överlapp från redan tillgodoräknade kontroller.
    Alla fem indikatorer redovisas separat utan nivåeffekt. EES-hemvist neutraliserar
    inte riskbransch, kontanter eller andra högre indikatorer.
  osakerhet: Ett framtida tjänsteavdrag kräver kalibrering, kund-/tjänsterelevans,
    känd samtidighet och prövning av dubbelräkning. Okända länder eller saknat centralt
    landunderlag är inte låg risk. Valet att avstå automatisk sänkning är också ett
    ej granskat metodval.
  kallor:
  - SRC-PTL
  kallbelagg:
  - kalla: SRC-PTL
    avsnitt: 2 kap. 4 §; registrerad lydelse 2020-01-01
    citat: kan tyda på
    tolkning: Möjlig indikator, inte föreskrivet automatiskt avdrag i tjänstens allmänna
      riskbedömning.
