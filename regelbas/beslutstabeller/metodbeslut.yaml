- id: D7
  namn: Ideella kunder och H-03
  grund: metodval
  valt: Ideell indikator höjer endast TF
  alternativ:
  - Ideell indikator höjer endast TF
  - Låt organisationsformen höja både PT och TF
  skal: Den lästa TF-lägesbilden stöder TF-relevans men ger inte en självständig generell
    PT-kedja av organisationsformen. S-ARB-05 verkar därför bara i TF-dimensionen.
    H-03 är fortsatt både PT och TF och andra belagda PT-faktorer kvarstår. Organisationsformen
    ensam är inte bevis för missbruk.
  osakerhet: Detta kan sänka PT-sårbarhet och risk i tidigare ideellscenarier. Samma
    kanaler som PT bevisar inte generell PT-effekt av organisationsformen. PEP och
    ideell får fortfarande summeras som portföljindikatorer i TF utan att faktisk
    gemensam kund påstås; överlapp är en separat kunskapslucka enligt D4.
