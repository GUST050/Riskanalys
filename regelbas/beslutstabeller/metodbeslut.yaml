- id: D3
  namn: Portföljfaktorer och tjänsteexponering
  grund: metodval
  valt: Behåll konservativ portföljmodell med synlig begränsning
  alternativ:
  - Behåll konservativ portföljmodell med synlig begränsning
  - Beräkna kundfaktorer med belagd tjänstefördelning
  skal: Gemensamma organisationsfaktorer gäller verksamheten. Kund- och geografifaktorer
    används tills vidare som konservativa modellindikatorer bland tjänstens relevanta
    hot. De fyra frivilliga tjänsteantalen används som lokalt sakunderlag, inte som
    numeriska avgränsningar; de täcker inte alla faktorer och deras trösklar är inte
    kalibrerade. Ingen faktisk samtidig kundexponering påstås.
  osakerhet: Även en dokumenterad lokal nolla kan därför ge kvarstående portföljpåslag
    i motorn. Det är en uttrycklig modellbegränsning, inte en slutsats att kunden
    finns i tjänsten. En tjänstespecifik modell behöver fullständig datamappning,
    okändhantering och separat kalibrering.
  kallor:
  - SRC-TS-2026-14
