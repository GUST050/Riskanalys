- id: D9
  namn: Faktorsummering, trösklar och mättnad
  grund: metodval
  valt: Behåll indikatorpåslag och tak med scenarioavgränsad ersättning
  alternativ:
  - Behåll indikatorpåslag och tak med scenarioavgränsad ersättning
  - Inför kalibrerade vikter, områdespoäng eller nya trösklar
  skal: Effekter summeras med golv låg och tak hög i samma hot och dimension. Ersättning
    gäller bara när ersättande faktor själv verkar i scenariot. +1, minst-en-/andelströsklar
    och tak är provisoriska heuristiska metodval, inga sannolikhetsestimat eller antaganden
    om oberoende. Varje kvarvarande orsak och tillämpat villkor redovisas även efter
    mättnad. B:s snävare distansvillkor bevaras.
  osakerhet: Korrelerade indikatorer kan mätta modellen. Katalogområden bevisar inte
    självständiga orsaker och alternativa vikter saknar kalibreringsunderlag. En kontra
    flera orsaker kan därför ha samma nivå utan att orsaksbilden är densamma.
