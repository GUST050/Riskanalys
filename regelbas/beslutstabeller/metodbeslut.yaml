  aterforing: 'Vid avslag: ompröva D2 och dess angivna sakobjekt/modellfiler i ny
    regelversion. Avslaget får inte kringgås med ändrad text. Bind om alla beslut
    som delar ändrade objekt/filer, fortsätt med ej_granskad och nytt expertbeslut.
    Räkna om varje scenario i sexfallen och kontraster, revidera berörda modellfacit/valideringsrapporter,
    bygg nya analyser/skrivunderlag/V10-rapporter/PDF:er och tre expertpaket, kräv
    ny samlad sakgranskning. Låsta historiska paket ändras inte.'
