- id: C-07
  namn: Bankavstämning mot underlag
  beskrivning: Byrån stämmer av kundens bankkonton mot bokfört underlag och utreder differenser
    och transaktioner som saknar underlag.
  utformning_falt: P-KONTROLL.C-07.utformning
  genomforande_falt: P-KONTROLL.C-07.genomforande
  kallor:
  - SRC-TS-2026-14
  - SRC-NRA-2024-25
  - SRC-FIPO-FORETAG-2026
  - SRC-FIPO-PLATTFORM-2026
  grund: metodval
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.19'
    sida: 123
  effekt_falt: P-KONTROLL.C-07.effekt
  utfall_falt: P-KONTROLL.C-07.utfall
  rackvidd:
  - id: KR-C-07-T-RED-01
    beskrivningsstatus: beskriven
    tjanst: T-RED-01
    hot:
    - H-TJ-01
    - H-03
    - H-01
    - H-02
    - H-MOD-01
    - H-MOD-02
    - H-MOD-04
    - H-TF-01
    - H-TF-02
    kan_belagga: 'Metodval: avstämning av tillgängliga kontoutdrag mot bokfört underlag kan synliggöra
      differenser och transaktioner som saknar förklaring. Detta kan vara observationsunderlag för
      vidare utredning, inte bevis för en verklig affär.'
    begransningar: En matchande faktura styrker inte ensam att affären är verklig; underlag kan vara
      fabricerade. Avstämningen omfattar bara tillgängliga konton och led, inte automatiskt parallella
      bankengagemang. PSP kan dölja den faktiska mottagaren och syftet; plattformars fragmenterade
      information medger inte antagen full täckning. Räckvidden för osynliga flöden är okänd och måste
      kompletteras lokalt.
    forutsattningar: Tillgång till de konton, perioder och transaktionsunderlag som faktiskt omfattas
      samt förståelse för kundens verksamhet. Dokumentera insynsluckor och pröva underlagens tillförlitlighet
      och bakomliggande parter separat. Beskrivningen bekräftar inget utfört arbete eller uppnådd effekt.
    grund: metodval
    kallhanvisningar:
    - kalla: SRC-NRA-2024-25
      avsnitt: '7.19: bristande kundkännedom, osanna fakturor och klientmedelskonton'
      sida: 123
    - kalla: SRC-FIPO-FORETAG-2026
      avsnitt: Parallella bankengagemang och fabricerade underlag
      sida: 2
    - kalla: SRC-FIPO-PLATTFORM-2026
      avsnitt: 'Ökad rapportering: faktisk mottagare vid PSP-betalningar'
      sida: 2
    - kalla: SRC-FIPO-PLATTFORM-2026
      avsnitt: Bristande insyn och transparens är en sårbarhet
      sida: 3
    sakkunnig:
      status: ej_granskad

