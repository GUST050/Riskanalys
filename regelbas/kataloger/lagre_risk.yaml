- id: L-PTL-04-01
  namn: Offentlig kund eller rättsligt bestämmande offentligt inflytande
  beskrivning: 'D-LAGRE: PTL:s omständigheter kan tyda på låg risk men anger inga automatiska avdrag.
    Nuvarande data räcker inte för att knyta lägre kundrisk till varje tjänsts specifika missbruksscenario
    eller skilja överlapp från redan tillgodoräknade kontroller. Alla fem indikatorer redovisas separat
    utan nivåeffekt. EES-hemvist neutraliserar inte riskbransch, kontanter eller andra högre indikatorer.
    Ett framtida tjänsteavdrag kräver kalibrering, kund-/tjänsterelevans, känd samtidighet och prövning
    av dubbelräkning. Okända länder eller saknat centralt landunderlag är inte låg risk. Valet att avstå
    automatisk sänkning är också ett ej granskat metodval.'
  profilfalt:
  - P-KUND.antal_offentlig
  grund: metodval
  kallor:
  - SRC-PTL
  - SRC-NRA-2024-25
  kallhanvisningar:
  - kalla: SRC-PTL
    avsnitt: 2 kap. 4 § p. 1
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.19: verksamhetsspecifik prövning'
    sida: 124
  nivaeffekt: false
  sakkunnig:
    status: ej_granskad
