- id: H-01
  namn: Osanna och falska fakturor
  beskrivning: Fakturor utan verklig prestation används för att flytta pengar, dölja
    brottsvinster eller göra felaktiga avdrag. De passerar byrån som vanliga verifikationer.
  kallor:
  - SRC-VAGL-2025-03
  - SRC-NRA-2024-25
  grund: metodval
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.19'
    sida: 123
- id: H-02
  namn: Brottsvinster redovisas som intäkter
  beskrivning: Pengar från brott blandas in i en lagligt bedriven verksamhet och redovisas
    som försäljning, så att de ser legala ut.
  kallor:
  - SRC-VAGL-2025-03
  - SRC-NRA-2024-25
  grund: metodval
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.19'
    sida: 123
- id: H-03
  namn: Oförklarade in- och utflöden
  beskrivning: Insättningar, uttag och överföringar saknar underlag eller affärsmässig
    förklaring och kan dölja penningtvätt eller finansiering av terrorism.
  galler_tf: true
  kallor:
  - SRC-VAGL-2025-03
  - SRC-NRA-2024-25
  grund: metodval
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.19'
    sida: 123
- id: H-TJ-01
  namn: Utnyttjande av löpande bokföring
  beskrivning: Osanna fakturor och brottsvinster redovisas som vanliga affärshändelser.
  grund: metodval
  kallor:
  - SRC-NRA-2024-25
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.19'
    sida: 123
- id: H-TJ-02
  namn: Utnyttjande av bokslut och årsredovisning
  beskrivning: Övertygande årsredovisning och förfalskade underlag kan legitimera
    brottsvinster eller övervärderade tillgångar.
  grund: metodval
  kallor:
  - SRC-NRA-2024-25
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.19'
    sida: 123
- id: H-TJ-03
  namn: Utnyttjande av deklarationer och deklarationsombud
  beskrivning: Osanna deklarationsunderlag kan dölja skatteundandragande och legitimera
    brottsvinster.
  grund: metodval
  kallor:
  - SRC-NRA-2024-25
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.19'
    sida: 123
- id: H-TJ-04
  namn: Utnyttjande av lönehantering
  beskrivning: Osanna löner kan legitimera brottsvinster; osanna fakturor kan finansiera
    svart arbetskraft.
  grund: metodval
  kallor:
  - SRC-NRA-2024-25
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.19'
    sida: 123
- id: H-TJ-05
  namn: Utnyttjande av betalningar och attest i kundens namn
  beskrivning: Ogrundade utlandsbetalningar, återbetalning till annat konto och slussning
    av medel kan passera betalningsuppdrag.
  grund: metodval
  kallor:
  - SRC-NRA-2024-25
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.19'
    sida: 123
- id: H-TJ-06
  namn: Utnyttjande av klientmedelskonto
  beskrivning: Konto i byråns namn kan dölja vilken kund eller företrädare som står
    bakom medlen.
  grund: metodval
  kallor:
  - SRC-NRA-2024-25
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.19'
    sida: 123
- id: H-TJ-07
  namn: Utnyttjande av ekonomisk rådgivning och ekonomichefstjänster
  beskrivning: Professionell kompetens kan användas för att skapa trovärdiga underlag
    och strukturera transaktioner i brottsupplägg.
  grund: metodval
  kallor:
  - SRC-NRA-2024-25
  kallhanvisningar:
