- id: H-01
  namn: Osanna och falska fakturor
  beskrivning: Fakturor utan verklig prestation används för att flytta pengar, dölja brottsvinster eller
    göra felaktiga avdrag. De passerar byrån som vanliga verifikationer.
  kallor:
  - SRC-VAGL-2025-03
  - SRC-NRA-2024-25
  grund: metodval
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.19'
    sida: 123
- id: H-02
  namn: Brottsvinster redovisas som intäkter
  beskrivning: Pengar från brott blandas in i en lagligt bedriven verksamhet och redovisas som försäljning,
    så att de ser legala ut.
  kallor:
  - SRC-VAGL-2025-03
  - SRC-NRA-2024-25
  grund: metodval
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.19'
    sida: 123
- id: H-03
  namn: Oförklarade in- och utflöden
  beskrivning: Insättningar, uttag och överföringar saknar underlag eller affärsmässig förklaring och
    kan dölja penningtvätt eller finansiering av terrorism.
  galler_tf: true
  kallor:
  - SRC-VAGL-2025-03
  - SRC-NRA-2024-25
  grund: metodval
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.19'
    sida: 123
- id: H-TJ-01
  namn: Utnyttjande av löpande bokföring
  beskrivning: Osanna fakturor och brottsvinster redovisas som vanliga affärshändelser.
  grund: metodval
  kallor:
  - SRC-NRA-2024-25
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.19'
    sida: 123
- id: H-TJ-02
  namn: Utnyttjande av bokslut och årsredovisning
  beskrivning: Övertygande årsredovisning och förfalskade underlag kan legitimera brottsvinster eller
    övervärderade tillgångar.
  grund: metodval
  kallor:
  - SRC-NRA-2024-25
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.19'
    sida: 123
- id: H-TJ-03
  namn: Utnyttjande av deklarationer och deklarationsombud
  beskrivning: Osanna deklarationsunderlag kan dölja skatteundandragande och legitimera brottsvinster.
  grund: metodval
  kallor:
  - SRC-NRA-2024-25
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.19'
    sida: 123
- id: H-TJ-04
  namn: Utnyttjande av lönehantering
  beskrivning: Osanna löner kan legitimera brottsvinster; osanna fakturor kan finansiera svart arbetskraft.
  grund: metodval
  kallor:
  - SRC-NRA-2024-25
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.19'
    sida: 123
- id: H-TJ-05
  namn: Utnyttjande av betalningar och attest i kundens namn
  beskrivning: Ogrundade utlandsbetalningar, återbetalning till annat konto och slussning av medel kan
    passera betalningsuppdrag.
  grund: metodval
  kallor:
  - SRC-NRA-2024-25
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.19'
    sida: 123
- id: H-TJ-06
  namn: Utnyttjande av klientmedelskonto
  beskrivning: Konto i byråns namn kan dölja vilken kund eller företrädare som står bakom medlen.
  grund: metodval
  kallor:
  - SRC-NRA-2024-25
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.19'
    sida: 123
- id: H-TJ-07
  namn: Utnyttjande av ekonomisk rådgivning och ekonomichefstjänster
  beskrivning: Professionell kompetens kan användas för att skapa trovärdiga underlag och strukturera
    transaktioner i brottsupplägg.
  grund: metodval
  kallor:
  - SRC-NRA-2024-25
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.19'
    sida: 123
- id: H-TJ-08
  namn: Utnyttjande av skatterådgivning utöver deklarationer
  beskrivning: Komplexa företagsstrukturer, brevlådeföretag och slussbolag kan dölja pengars ursprung.
  grund: metodval
  kallor:
  - SRC-NRA-2024-25
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.20'
    sida: 126
- id: H-TJ-09
  namn: Utnyttjande av bolagsbildning, lagerbolag och bolagsförmedling
  beskrivning: Historikbolag med kvarvarande konton och registreringar kan bli brottsverktyg och kringgå
    ny kundkännedom.
  grund: metodval
  kallor:
  - SRC-NRA-2024-25
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.25'
    sida: 144
- id: H-TJ-10
  namn: Utnyttjande av registrerad adress eller postadress
  beskrivning: Adress- och posttjänster kan dölja verksamhetens verkliga plats och ge sken av legitim
    verksamhet.
  grund: metodval
  kallor:
  - SRC-NRA-2024-25
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.26'
    sida: 147
- id: H-TJ-11
  namn: Utnyttjande av styrelseuppdrag eller bolagsrättsligt ansvar
  beskrivning: Företrädaruppdrag kan möjliggöra bolag som brottsverktyg och dölja den faktiska kontrollen.
  grund: metodval
  kallor:
  - SRC-NRA-2024-25
  kallhanvisningar:
  - kalla: SRC-NRA-2024-25
    avsnitt: '7.25'
    sida: 144
- id: H-MOD-01
  namn: Felbetalning med återföring till annat konto
  beskrivning: En skenbar felbetalning förs tillbaka till en annan mottagare och ger brottsvinster en
    ny förklaring. Byrån kan bokföra eller verkställa kedjan utan att sambandet utreds.
  kallor:
  - SRC-VAGL-2025-03
  grund: metodval
  galler_tf: false
  kallhanvisningar:
  - kalla: SRC-VAGL-2025-03
    avsnitt: Tillvägagångssätt; fysisk PDF-sida
    sida: 16
- id: H-MOD-02
  namn: Moms- och karusellupplägg med osanna underlag
  beskrivning: Fakturor och redovisning kan ge sken av varuhandel utan styrkt leverans. Moms- och skattebedrägerier
    genererar brottsvinster som kan slussas vidare.
  kallor:
  - SRC-VAGL-2025-03
  grund: metodval
  galler_tf: false
  kallhanvisningar:
  - kalla: SRC-VAGL-2025-03
    avsnitt: Tillvägagångssätt; fysisk PDF-sida
    sida: 23
- id: H-MOD-03
  namn: Bolag som förbrukningsvara och dolda företrädare
  beskrivning: Kortlivade eller övertagna företag används för att samla och föra vidare brottsvinster.
    Målvakter och bolagens befintliga registreringar döljer kontrollen; förmedling och rådgivning kan
    möjliggöra detta.
  kallor:
  - SRC-FIPO-FORETAG-2026
  grund: metodval
  galler_tf: false
  kallhanvisningar:
  - kalla: SRC-FIPO-FORETAG-2026
    avsnitt: Tillvägagångssätt; fysisk PDF-sida
    sida: 1
- id: H-MOD-04
  namn: Snabba direktbetalningar och skiktning
  beskrivning: Brottsvinster från bedrägerier eller narkotika delas mellan många konton och flyttas snabbt
    vidare. Bokföring, attest och avstämning behöver förstå sambandet mellan mottagare, affär och vidarebetalning.
  kallor:
  - SRC-FIPO-SWISH-2025
  grund: metodval
  galler_tf: false
  kallhanvisningar:
  - kalla: SRC-FIPO-SWISH-2025
    avsnitt: Tillvägagångssätt; fysisk PDF-sida
    sida: 1
- id: H-TF-01
  namn: Insamling och vidareförmedling för terrorism
  beskrivning: Företag eller föreningar tar emot många mindre insättningar och för medel vidare, inom
    Sverige eller utomlands. Donationer och andra legala intäkter kan finansiera verksamhet kopplad till
    terrorism; medlens användning behöver utredas även när ursprunget är legalt.
  kallor:
  - SRC-FIPO-TF-2025
  grund: metodval
  galler_tf: true
  kallhanvisningar:
  - kalla: SRC-FIPO-TF-2025
    avsnitt: Tillvägagångssätt; fysisk PDF-sida
    sida: 2
- id: H-TF-02
  namn: Terrorfinansiering via hawala, krypto eller transitländer
  beskrivning: Medel förs via mellanhänder, penningöverföring, hawala eller kryptotillgångar för att dölja
    ändamål och slutmottagare. Små uppdelade belopp kan passera transitländer. Det är relevant för bokförda
    flöden, betalningsuppdrag och rådgivning.
  kallor:
  - SRC-FIPO-TF-2025
  grund: metodval
  galler_tf: true
  kallhanvisningar:
