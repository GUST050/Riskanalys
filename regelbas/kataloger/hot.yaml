- id: H-MOD-06
  namn: Brottsvinster från sanktionsbrott döljs i företagsflöden
  beskrivning: Brottsvinster från sanktionsbrott kan tvättas genom skenbara affärshändelser, dolda motparter
    och transaktionskedjor som bokförs, struktureras eller verkställs med byråns tjänster. Den rättsliga
    grunden för hotposten är penningtvätt av brottsvinster, inte en listträff eller allmän sanktionsanknytning.
    Tjänstekedjan är en ogranskad metodtolkning; övrig sanktionsprövning ligger separat.
  kallor:
  - SRC-FIPO-AR-2025
