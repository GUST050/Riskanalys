    avsnitt: Tillvägagångssätt; fysisk PDF-sida
    sida: 1
  - kalla: SRC-FIPO-TF-2025
    avsnitt: Hawala, kryptovalutor och dolda syften; fysisk PDF-sida
    sida: 2
- id: H-TF-03
  namn: Föreningar eller bolag döljer ändamålet med finansiering
  beskrivning: Juridiska personer med skenbar verksamhetsbeskrivning eller företrädare används för att
    organisera insamling och dölja syftet. Bolagsbildning, adress-, företrädar- och rådgivningstjänster
    kan ge legitimitet åt upplägget.
  kallor:
  - SRC-FIPO-TF-2025
  grund: metodval
  galler_tf: true
  kallhanvisningar:
  - kalla: SRC-FIPO-TF-2025
    avsnitt: Tillvägagångssätt; fysisk PDF-sida
