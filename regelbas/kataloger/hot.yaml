  namn: Insamling och vidareförmedling för terrorism
  beskrivning: Företag eller föreningar tar emot många mindre insättningar och för medel vidare, inom
    Sverige eller utomlands. Donationer och andra legala intäkter kan finansiera verksamhet kopplad till
    terrorism; medlens användning behöver utredas även när ursprunget är legalt.
  kallor:
  - SRC-FIPO-TF-2025
  grund: metodval
  galler_tf: true
  kallhanvisningar:
  - kalla: SRC-FIPO-TF-2025
    avsnitt: Tillvägagångssätt
    sida: 2
  - kalla: SRC-FIPO-TF-2025
    avsnitt: Tillvägagångssätt; fysisk PDF-sida
    sida: 2
  niva: medel
  nivamotivering: 'Ogranskat metodval C: medel behålls som dokumenterat standardvärde. Källcitat: ”Ett
    vanligt förekommande tillvägagångssätt i rapporteringen” (SRC-FIPO-TF-2025, Tillvägagångssätt, fysisk
    PDF-sida 2). Källstället stöder tillvägagångssättets relevans men ger inte en avgränsad frekvens eller
    en kalibrerad låg/medel/hög-hotnivå för var och en av de berörda byråtjänsterna. Underlag för annan
    nivå saknas. Att mönstret är vanligt i misstankerapportering eller att källan beskriver hög risk fastställer
    inte frekvensen hos just tjänstens kunder. Egen bekräftad iakttagelse kan fortsatt höja ett steg;
    inget eller okänt svar sänker inte.'
  sakkunnig:
    status: ej_granskad
- id: H-TF-02
  namn: Terrorfinansiering via hawala, krypto eller transitländer
  beskrivning: Medel förs via mellanhänder, penningöverföring, hawala eller kryptotillgångar för att dölja
    ändamål och slutmottagare. Små uppdelade belopp kan passera transitländer. Det är relevant för bokförda
    flöden, betalningsuppdrag och rådgivning.
