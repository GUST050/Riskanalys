  namn: Oriktiga underlag för offentliga utbetalningar
  beskrivning: Oriktiga bokförings-, löne- eller ansökningsunderlag kan användas för att tillskansa sig
    offentliga medel. Brottsvinster kan därefter döljas som legitima intäkter eller föras vidare genom
    byråns redovisning och betalningsuppdrag. Ett ansökningsfel är inte i sig penningtvätt.
