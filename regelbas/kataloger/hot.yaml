    sida: 3
  niva: medel
  nivamotivering: 'Ogranskat metodval C: medel behålls som dokumenterat standardvärde. Källcitat: ”Snabba
    direktbetalningar är vanligt förekommande” (SRC-FIPO-SWISH-2025, Återkommande transaktionsmönster,
    fysisk PDF-sida 1). Källstället stöder tillvägagångssättets relevans men ger inte en avgränsad frekvens
    eller en kalibrerad låg/medel/hög-hotnivå för var och en av de berörda byråtjänsterna. Underlag för
    annan nivå saknas. Att mönstret är vanligt i misstankerapportering eller att källan beskriver hög
