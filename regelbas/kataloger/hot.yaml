- id: H-MOD-07
  namn: Brottsursprung döljs via krypto i företagsflöden
  beskrivning: Företagsmedel kan föras mellan bankkonton, utlandsled och kryptoplånböcker så att brottsursprunget
    blir svårt att följa. Bokföring, avstämning, betalningsuppdrag eller skatteråd kan ge flödet en skenbar
    legal förklaring. Detta är PT-dimensionen; TF via samma kanaler behandlas separat i H-TF-02.
