- id: S-ARB-05
  namn: Ideella föreningar eller liknande organisationsformer
  beskrivning: Insamling och vidareförmedling av medel kan missbrukas för terrorfinansiering; organisationsformen
    är inte ensam bevis för missbruk.
  metodmotivering: 'D7: Den lästa TF-lägesbilden stöder TF-relevans men ger inte en självständig generell
    PT-kedja av organisationsformen. S-ARB-05 verkar därför bara i TF-dimensionen. H-03 är fortsatt både
    PT och TF och andra belagda PT-faktorer kvarstår. Organisationsformen ensam är inte bevis för missbruk.
    Detta kan sänka PT-sårbarhet och risk i tidigare ideellscenarier. Samma kanaler som PT bevisar inte
    generell PT-effekt av organisationsformen. PEP och ideell får fortfarande summeras som portföljindikatorer
    i TF utan att faktisk gemensam kund påstås; överlapp är en separat kunskapslucka enligt D4.'
  omrade: kund
  grund: metodval
  villkor:
    falt: P-RISK.ideell
    op: ==
    varde: true
  effekt:
