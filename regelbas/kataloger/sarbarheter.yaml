- id: S-ARB-15
  namn: Personal eller uppdragstagare saknar relevant aktuell utbildning
  beskrivning: Bristande utbildning kan leda till att avvikande underlag och flöden inte upptäcks.
  metodmotivering: 'Byråövergripande indikator används konservativt för varje erbjuden tjänst. Ett steg
    och summering med tak i sannolikhetsskalan är ogranskade metodval; kombinationer och tjänstspecifik
    relevans ska sakgranskas och kalibreras. Scenariokoppling (ogranskat metodval): Utbildningsbrister
    kan göra falska fakturor och oförklarade utlandsflöden oupptäckta, enligt Länsstyrelsens exempel.
    Verksamhetens kompetens behövs även för att känna igen varje tjänsts egna missbruk och TF-modus. Samma
    granskningssvaghet prövas mot H-TJ-12 (oriktigt ansökningsunderlag) och H-TJ-13 (vilseledande granskning).
    För H-MOD-05 kan offentliga ersättningar ges en falsk intäktsförklaring; H-MOD-06 kan dölja sanktionsbrottsvinster;
    H-MOD-07 kan bryta spårbarheten till kryptoled. Brister i kompetens, oberoende eller insyn kan låta
    dessa led passera. Kopplingarna är metodtolkning, inte nya vikter eller bedömd kontrollverkan.'
