- id: S-ARB-05
  namn: Ideella föreningar eller liknande organisationsformer
  beskrivning: Insamling och vidareförmedling av medel kan missbrukas för terrorfinansiering; organisationsformen
    är inte ensam bevis för missbruk.
  metodmotivering: 'Byråövergripande indikator används konservativt för varje erbjuden tjänst. Ett steg
    och summering med tak i sannolikhetsskalan är ogranskade metodval; kombinationer och tjänstspecifik
    relevans ska sakgranskas och kalibreras. Scenariokoppling (ogranskat metodval): Insamling och vidareförmedling
    via ideella organisationer kan dölja terrorismändamål. Finanspolisens TF-lägesbild (fysisk PDF-sida 2)
    beskriver också mönstret som många överföringar från okända avsändare som förs vidare; därför kopplas
    faktorn även till oförklarade in- och utflöden, som gäller både penningtvätt och TF. Lägesbilden varken
    stöder eller utesluter uttryckligen en koppling till penningtvätt; den anger (sida 4) att TF ofta går
    via samma kanaler som penningtvätt. Kopplingen till penningtvätt är ett konservativt, ogranskat metodval
    i avvaktan på sakkunnig prövning: faktorn har tidigare höjt penningtvättsrisken, och att ta bort den
    höjningen vore en sänkning som kräver sakkunnigbeslut.'
  omrade: kund
  grund: metodval
  villkor:
    falt: P-RISK.ideell
    op: ==
    varde: true
  effekt:
    sannolikhet: 1
