    sida: 4
  grund: metodval
  metodmotivering: 'Ogranskat förslag: befintliga standardnivåer återanvänds i väntan på C/D. Tjänstekopplingar
    beskriver möjliga missbruk, inte faktiska händelser eller fastställd kontrollverkan. Relevans och
    befogenheter ska prövas lokalt. Granskningsuppdrag beslutar inte kundens affärer. Tjänstevis kopplingsprövning
    (ogranskat metodval): Byrån tar fram ansökningar, stödbelopp och uppgifter om berättigade mottagare
    av offentliga medel. H-MOD-05: Dessa underlag kan ge felaktiga offentliga utbetalningar en skenbar
    legitim intäktsförklaring; ansökningsfel ensamt är inte penningtvätt. H-MOD-06: Arbetsmomentet kan
    legitimera en skenaffär eller dold motpart som döljer brottsvinst från sanktionsbrott. En sanktionsanknytning
    ensam är inte denna PT-kedja. H-MOD-07: Arbetsmomentet kan ge bank- och kryptoled en falsk affärsförklaring
    eller dölja sambandet mellan ursprung, företag och plånbok. Kryptoinnehav ensamt innebär inte brott.
    H-TF-03: Arbetsmomentet kan legitimera eller ge underlag för vidareföring även av legalt intjänade
    medel till terrorändamål. Brottsligt ursprung krävs inte för TF; ändamål och mottagarkedja är här
    den möjliga mekanismen. Källorna beskriver modus och sektor, medan just arbetsmomentets koppling är
    programmets metodtolkning. Inget betalningsmandat eller faktisk händelse antas; lokal relevans ska
    prövas och kontrollmål utvidgas inte automatiskt.'
