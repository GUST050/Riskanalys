  metodmotivering: 'Förslag: grundnivån och kombinationerna ska granskas och kalibreras separat. NRA:s
    sektorsrisk är inte direkt likställd med motorns skala. Källornas modus är möjliga tillvägagångssätt,
    inte konstaterade händelser hos byrån. Nya byråövergripande indikatorers viktning kräver tjänstevis
    relevansprövning och kalibrering. Tjänstevis kopplingsprövning (ogranskat metodval): Byrån beräknar
    löner och sammanställer löneunderlag, arbetsgivardeklarationer och mottagaruppgifter. H-MOD-05: Dessa
    underlag kan ge felaktiga offentliga utbetalningar en skenbar legitim intäktsförklaring; ansökningsfel
    ensamt är inte penningtvätt. H-MOD-06: Arbetsmomentet kan legitimera en skenaffär eller dold motpart
    som döljer brottsvinst från sanktionsbrott. En sanktionsanknytning ensam är inte denna PT-kedja. H-MOD-07:
    Arbetsmomentet kan ge bank- och kryptoled en falsk affärsförklaring eller dölja sambandet mellan ursprung,
    företag och plånbok. Kryptoinnehav ensamt innebär inte brott. H-TF-03: Arbetsmomentet kan legitimera
    eller ge underlag för vidareföring även av legalt intjänade medel till terrorändamål. Brottsligt ursprung
    krävs inte för TF; ändamål och mottagarkedja är här den möjliga mekanismen. Källorna beskriver modus
    och sektor, medan just arbetsmomentets koppling är programmets metodtolkning. Inget betalningsmandat
    eller faktisk händelse antas; lokal relevans ska prövas och kontrollmål utvidgas inte automatiskt.
    D1, provisorisk avgränsning: H-MOD-02 beräknas inte i ren löneberedning/lönerapportering eftersom
    lästa källor beskriver faktura-, moms- och varuleveransled utan att belägga detta arbetsmoment i en
    ren lönetjänst. Moms-/fakturagranskning och betalningar bedöms i de tjänster där de faktiskt erbjuds.
    Samma kund kan ha andra tjänster men sådan samförekomst antas inte. Lönens eget falska underlag och
    löneuttag av brottsvinst finns kvar genom H-TJ-04 och H-02. Avgränsningen är ett ej granskat metodval,
    inte bevis för att en lönekund saknar momsbrott. D2: Ren löneberedning behandlar löneuppgifter, inte
    generellt leverantörsfakturor. Falskt löneunderlag finns i H-TJ-04; löneuttag som legitimerar brottsvinst
    finns i H-02. H-01 prövas i separat erbjuden faktura-/bokföringstjänst och vid nytt utvidgat arbetsmoment.'
