    sektorsrisk är inte direkt likställd med motorns skala. Källornas modus är möjliga tillvägagångssätt,
    inte konstaterade händelser hos byrån. Nya byråövergripande indikatorers viktning kräver tjänstevis
    relevansprövning och kalibrering. Tjänstevis kopplingsprövning (ogranskat metodval): Byrån verkställer
    betalningar eller attesterar i kundens namn inom faktiskt uppdragsmandat. H-MOD-06: Arbetsmomentet
    kan legitimera en skenaffär eller dold motpart som döljer brottsvinst från sanktionsbrott. En sanktionsanknytning
    ensam är inte denna PT-kedja. H-MOD-07: Arbetsmomentet kan ge bank- och kryptoled en falsk affärsförklaring
