  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 3 kap. 5 §
  text: Bestämmelser om förenklade åtgärder för kundkännedom finns i 3 kap. 15 § lagen
    (2017:630) om åtgärder mot penningtvätt och finansiering av terrorism.
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 3 kap. 6 §
  text: Bestämmelser om skärpta åtgärder för kundkännedom finns i 3 kap. 16 och 17
    §§ lagen (2017:630) om åtgärder mot penningtvätt och finansiering av terrorism.
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 3 kap. 7 §
  text: Verksamhetsutövarens dokumentation av de vidtagna kontrollåtgärderna enligt
    detta kapitel ska bevaras i enlighet med 5 kap. 1 och 2 §§ dessa föreskrifter.
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 4 kap. 1 §
  text: 'Bestämmelser om uppgiftslämning till Polismyndigheten eller Säkerhetspolisen
    och system för uppgiftslämningen finns i 4 kap. 6 och 7 §§ lagen (2017:630) om
    åtgärder mot penningtvätt och finansiering av terrorism.

    Systemet för uppgiftslämning ska vara strukturerat och sökbart. Det kan vara antingen
    elektroniskt eller manuellt under förutsättning att det är möjligt för verksamhetsutövaren
    att behandla och lämna uppgifterna på det sätt som Polismyndigheten eller Säkerhetspolisen
    anvisar.'
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 5 kap. 1 §
  text: 'Verksamhetsutövaren ska på ett betryggande sätt bevara de handlingar och
    uppgifter som anges i 5 kap. 3 § lagen (2017:630) om åtgärder mot penningtvätt
    och finansiering av terrorism.

    Handlingarna och uppgifterna ska i enlighet med 5 kap. 3 § samma lag bevaras i
    fem år. Tiden räknas från det att åtgärden eller transaktionen utfördes eller,
    i de fall då en affärsförbindelse har etablerats, från det att affärsförbindelsen
    upphörde.

    Handlingarna och uppgifterna ska vara ordnade elektroniskt eller i pappersform
    så att de är sökbara samt enkla att identifiera, ta fram och sammanställa.'
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 5 kap. 2 §
  text: Efter en förfrågan från Polismyndigheten eller annan behörig myndighet, ska
    verksamhetsutövaren bevara uppgifter och handlingar under en längre period än
    fem år. Tiden för det förlängda bevarandet ska anpassas utifrån den tid som myndigheten
    behöver för att förebygga, upptäcka eller utreda penningtvätt eller finansiering
    av terrorism. Den sammanlagda tiden som handlingarna och uppgifterna bevaras får
    inte överstiga tio år.
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 6 kap. 1 §
  text: Bestämmelser om verksamhetsutövarens rutiner och riktlinjer samt funktioner
    för intern kontroll finns i 6 kap. 1 och 2 §§ lagen (2017:630) om åtgärder mot
    penningtvätt och finansiering av terrorism.
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 6 kap. 2 §
  text: Verksamhetsutövarens rutiner och riktlinjer för intern kontroll ska innehålla
    en beskrivning av vilka åtgärder verksamhetsutövaren ska vidta för att kunna upptäcka
    och korrigera brister i verksamheten.
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 6 kap. 3 §
  text: 'Av 6 kap. 2 § lagen (2017:630) om åtgärder mot penningtvätt och finansiering
    av terrorism framgår det att verksamhetsutövaren ska utse funktioner för intern
    kontroll när det är motiverat med hänsyn till verksamhetens storlek och art.

    När en verksamhetsutövare bedömer om det behöver inrättas funktioner enligt första
    stycket ska verksamhetsutövaren bland annat ta hänsyn till följande omständigheter
    som avser verksamhetens storlek och art:

    1. Verksamhetens omsättning.

    2. Antalet anställda.

    3. Antalet verksamhetsställen.

    4. Den verksamhet som bedrivs.

    5. De produkter och tjänster som erbjuds.

    6. Verksamhetens komplexitet.

    7. Verksamhetsutövarens allmänna riskbedömning.

    Av verksamhetsutövarens rutiner och riktlinjer för intern kontroll ska det framgå
    om funktioner enligt första stycket har utsetts. Det ska också framgå av rutinerna
    och riktlinjerna vem som innehar respektive funktion.'
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 6 kap. 4 §
  text: 'När det inte är motiverat att utse funktioner enligt 6 kap. 2 § lagen (2017:630)
    om åtgärder mot penningtvätt och finansiering av terrorism, ska verksamhetsutövaren
    genom sina rutiner och riktlinjer säkerställa att det finns en funktion för regelefterlevnad
    som ansvarar för 1. att verksamhetsutövarens skyldigheter enligt lagen om åtgärder
    mot penningtvätt och finansiering av terrorism och dessa föreskrifter genomförs
    och verkställs i verksamheten, och 2. verksamhetsutövarens rapporter till Polismyndigheten
    om misstänkt penningtvätt eller finansiering av terrorism enligt 4 kap. 3 § samma
    lag.

    Av verksamhetsutövarens rutiner och riktlinjer för intern kontroll ska det framgå
    om funktionen enligt första stycket har utsetts. Det ska också framgå av rutinerna
    och riktlinjerna vem som innehar funktionen.'
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 7 kap. 1 §
  text: En verksamhetsutövare ska periodiskt eller på begäran lämna uppgifter om sin
    verksamhet, sina kunder och andra förhållanden som är nödvändiga för att länsstyrelsen
    ska kunna bedöma den risk som kan förknippas med de verksamhetsutövare som står
    under tillsyn.
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 7 kap. 2 §
  text: Uppgifter enligt 7 kap. 1 § dessa föreskrifter kan avse 1. den verksamhet
    som verksamhetsutövaren bedriver, 2. verksamhetens kunder, 3. verksamhetsutövarens
    riskbedömningar och rutiner, eller 4. övriga åtgärder mot penningtvätt och finansiering
    av terrorism.
