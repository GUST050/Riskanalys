- kalla: SRC-14FS-2024-11
  lagrum: 1 kap. 1 §
  text: 'Dessa föreskrifter ska tillämpas av fysiska och juridiska personer som driver
    sådan verksamhet som anges i 1 kap. 2 § första stycket 16, 17, 19, 20 och 22–24
    lagen (2017:630) om åtgärder mot penningtvätt och finansiering av terrorism.

    I föreskrifterna benämns dessa fysiska och juridiska personer som verksamhetsutövare.'
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 1 kap. 2 §
  text: I dessa föreskrifter används de definitioner som anges i 1 kap. 6–10 §§ lagen
    (2017:630) om åtgärder mot penningtvätt och finansiering av terrorism.
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 2 kap. 1 §
  text: 'Bestämmelser om innehållet i och omfattningen av verksamhetsutövarens allmänna
    riskbedömning finns i 2 kap. 1 och 2 §§ lagen (2017:630) om åtgärder mot penningtvätt
    och finansiering av terrorism.

    Verksamhetsutövarens allmänna riskbedömning ska enligt 2 kap. 2 § samma lag vara
    dokumenterad.'
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 2 kap. 2 §
  text: 'Verksamhetsutövaren ska i den allmänna riskbedömningen göra följande:

    – Identifiera de produkter och tjänster som tillhandahålls i verksamheten.

    – Identifiera och analysera de hot som är relevanta för de produkter och tjänster
    som tillhandahålls i verksamheten. Vid denna bedömning ska verksamhetsutövaren
    särskilt ta hänsyn till uppgifter som kommer fram vid verksamhetsutövarens rapportering
    av misstänkta aktiviteter och transaktioner.

    Verksamhetsutövaren ska också särskilt ta hänsyn till information om tillvägagångssätt
    för penningtvätt och finansiering av terrorism och andra relevanta uppgifter som
    myndigheter lämnar.

    – Identifiera och analysera de sårbarheter som kan innebära att de produkter och
    tjänster som tillhandahålls i verksamheten utnyttjas för penningtvätt eller finansiering
    av terrorism. Vid denna bedömning ska verksamhetsutövaren särskilt beakta vilka
    kunder och distributionskanaler som finns samt vilka geografiska riskfaktorer
    som föreligger. Verksamhetsutövaren ska även beakta andra relevanta verksamhetsspecifika
    omständigheter som kan innebära en sårbarhet för att verksamhetens produkter och
    tjänster utnyttjas för penningtvätt eller finansiering av terrorism.

    – Värdera riskerna som är förenade med de bedömda hoten och sårbarheterna.

    Verksamhetsutövaren ska motivera angivna risknivåer.'
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 2 kap. 3 §
  text: 'Verksamhetsutövaren ska utvärdera den allmänna riskbedömningen regelbundet,
    minst en gång per år, och uppdatera den vid behov.

    Den allmänna riskbedömningen ska alltid utvärderas innan verksamhetsutövaren 1.
    erbjuder nya eller väsentligt förändrade produkter eller tjänster, 2. riktar sig
    till nya marknader, eller 3. gör andra förändringar som är relevanta för verksamheten.

    Verksamhetsutövaren ska dokumentera datum för utvärdering och eventuell uppdatering
    av den allmänna riskbedömningen. Datum för utvärdering och eventuell uppdatering
    ska framgå av den allmänna riskbedömningen.'
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 2 kap. 4 §
  text: Bestämmelser om verksamhetsutövarens riskbedömning av kunder (kundens riskprofil)
    finns i 2 kap. 3 § lagen (2017:630) om åtgärder mot penningtvätt och finansiering
    av terrorism. I 2 kap. 4 och 5 §§ samma lag finns exempel på omständigheter som
    kan tyda på att kundrelationen innebär en låg respektive hög risk för penningtvätt
    eller finansiering av terrorism.
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 2 kap. 5 §
  text: 'Bestämmelser om vad verksamhetsutövarens rutiner och riktlinjer ska omfatta
    finns i 2 kap. 8–10, 13 och 15 §§ samt 6 kap. 1 § lagen (2017:630) om åtgärder
    mot penningtvätt och finansiering av terrorism.

    Verksamhetsutövarens rutiner och riktlinjer ska därutöver omfatta det som anges
    om 1. identifiering och kontroll, verklig huvudman samt förenklade och skärpta
    åtgärder enligt 3 kap. dessa föreskrifter, 2. system för uppgiftslämning enligt
    4 kap. dessa föreskrifter, 3. bevarande av handlingar och uppgifter enligt 5 kap.
    dessa föreskrifter, och 4. rutiner och funktioner för intern kontroll enligt 6
    kap. dessa föreskrifter.'
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 2 kap. 6 §
  text: Verksamhetsutövare med anställda, uppdragstagare och andra som på liknande
    grund deltar i verksamheten ska, utöver vad som anges i 2 kap. 5 § dessa föreskrifter,
    även ha rutiner och riktlinjer avseende 1. lämplighetsprövningen av anställda,
    uppdragstagare och andra som på liknande grund deltar i verksamheten enligt 2
    kap. 9 § dessa föreskrifter, och 2. skydd för anställda, uppdragstagare och andra
    som på liknande grund deltar i verksamheten från hot eller fientliga åtgärder
    enligt 2 kap. 12 § dessa föreskrifter.
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 2 kap. 7 §
  text: Verksamhetsutövarens rutiner och riktlinjer ska genom detaljerade handlingsregler
    beskriva vilka åtgärder som ska vidtas i olika situationer och hur dessa åtgärder
    ska vidtas. Verksamhetsutövarens rutiner och riktlinjer ska i relevanta delar
    vara anpassade efter riskerna för penningtvätt och finansiering av terrorism i
    verksamheten, verksamhetens storlek och art samt den situation där de ska användas.
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 2 kap. 8 §
  text: 'Verksamhetsutövaren ska utvärdera sina rutiner och riktlinjer regelbundet,
    minst en gång per år, och uppdatera dem vid behov.

    Verksamhetsutövarens rutiner och riktlinjer för kundkännedom, övervakning och
    rapportering samt för behandling av personuppgifter ska enligt 2 kap. 8 § lagen
    (2017:630) om åtgärder mot penningtvätt och finansiering av terrorism vara dokumenterade.

    Verksamhetsutövaren ska dokumentera datum för utvärdering och eventuell uppdatering
    av de dokumenterade rutinerna och riktlinjerna. Datum för utvärdering och eventuell
    uppdatering ska framgå av de dokumenterade rutinerna och riktlinjerna.'
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 2 kap. 9 §
  text: 'Bestämmelser om verksamhetsutövarens rutiner för lämplighetsprövning av anställda,
    uppdragstagare och andra som på liknande grund deltar i verksamheten finns i 2
    kap. 13 § lagen (2017:630) om åtgärder mot penningtvätt och finansiering av terrorism.

    Verksamhetsutövarens rutiner och riktlinjer ska säkerställa att kontrollen av
    lämpligheten är proportionerlig i förhållande till personens arbetsuppgifter och
    funktion samt den allmänna riskbedömningen av verksamheten.'
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 2 kap. 10 §
  text: 'Bestämmelser om en verksamhetsutövares utbildning av och information till
    anställda, uppdragstagare och andra som på liknande grund deltar i verksamheten
    finns i 2 kap. 14 § lagen (2017:630) om åtgärder mot penningtvätt och finansiering
    av terrorism.

    Utbildningen och informationen ska utformas utifrån de risker som verksamhetsutövaren
    har identifierat i sin allmänna riskbedömning. När den allmänna riskbedömningen
    uppdateras ska utbildningen anpassas därefter. Utbildningens innehåll och frekvens
    ska också anpassas utifrån de anställdas och uppdragstagarnas arbetsuppgifter
    och funktioner.'
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 2 kap. 11 §
  text: Verksamhetsutövaren ska dokumentera utbildningar som genomförts i enlighet
    med 2 kap. 14 § lagen (2017:630) om åtgärder mot penningtvätt och finansiering
    av terrorism. Av dokumentationen ska det framgå vad utbildningen innehåller, namnen
    på deltagarna samt datumet för utbildningen.
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 2 kap. 12 §
  text: Bestämmelser om verksamhetsutövarens rutiner och åtgärder för att skydda anställda,
    uppdragstagare och andra som på liknande grund deltar i verksamheten mot hot,
    hämnd eller andra fientliga åtgärder finns i 2 kap. 15 § första stycket samt 6
    kap. 4 a § första stycket lagen (2017:630) om åtgärder mot penningtvätt och finansiering
    av terrorism. Verksamhetsutövaren ska använda slutsatserna från sin hantering
    av hot, hämnd eller andra fientliga åtgärder som inträffat i verksamheten för
    att vidta nödvändiga åtgärder i det enskilda fallet samt vid behov uppdatera sin
    allmänna riskbedömning samt rutiner och riktlinjer.
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 3 kap. 1 §
  text: 'Bestämmelser om identifiering och kontroll finns i 3 kap. 7 § lagen (2017:630)
    om åtgärder mot penningtvätt och finansiering av terrorism.

    Verksamhetsutövaren ska genomföra identifiering på det sätt som anges i 3 kap.
    3 § dessa föreskrifter. Verksamhetsutövaren ska genomföra kontroll av identitet
    på det sätt som anges i 3 kap. 4 § dessa föreskrifter.'
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 3 kap. 2 §
  text: 'Bestämmelser om vad som avses med verklig huvudman finns i 1 kap. 3–7 §§
    lagen (2017:631) om registrering av verkliga huvudmän. Bestämmelser om utredning
    av verklig huvudman finns i 3 kap. 8 § lagen (2017:630) om åtgärder mot penningtvätt
    och finansiering av terrorism. Bestämmelser om kontroll av den verkliga huvudmannens
    identitet finns i 3 kap. 9 § samma lag.

    Verksamhetsutövaren ska kontrollera den verkliga huvudmannens identitet på det
    sätt som anges i 3 kap. 4 § dessa föreskrifter.'
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 3 kap. 3 §
  text: 'Verksamhetsutövaren ska identifiera en kund som är en fysisk person genom
    att begära uppgifter om personens namn, personnummer, samordningsnummer eller
    motsvarande nummer samt adress.

    Verksamhetsutövaren ska identifiera en kund som är en juridisk person genom att
    begära uppgifter om den juridiska personens namn och organisationsnummer, registrerad
    adress samt företrädare.

    Om kunden företräds av ett ombud eller motsvarande, ska verksamhetsutövaren också
    identifiera den personen i enlighet med första stycket.'
  ikraft: '2024-07-01'
  upphor: null
  inford_genom: 14FS 2024:11
- kalla: SRC-14FS-2024-11
  lagrum: 3 kap. 4 §
