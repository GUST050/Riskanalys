    person samt företrädare för en kund som är en juridisk person. Om kunden företräds
    av ett ombud eller motsvarande, ska verksamhetsutövaren också kontrollera ombudets
    identitet och behörighet att företräda kunden.

    Kontrollåtgärderna ska utföras och dokumenteras på det sätt som anges i nedanstående
    tabell. Av dokumentationen ska det även framgå när kontrollen har utförts. Identitetskontroll
    ska genomföras även om kunden är en offentlig person eller känd sedan tidigare.

