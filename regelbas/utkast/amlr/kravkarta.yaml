  text: 'Lagring av uppgifter 1. Ansvariga enheter ska bevara följande handlingar
    och uppgifter: a) En kopia av de handlingar och de uppgifter som erhållits vid
    åtgärder för kundkännedom enligt kapitel III, inbegripet uppgifter som erhållits
    med hjälp av medel för elektronisk identifiering, b) Dokumentation av den bedömning
    som gjorts enligt artikel 69.2, inbegripet de uppgifter och omständigheter som
    beaktats och resultaten av en sådan bedömning, oavsett om en sådan bedömning leder
    till att en rapport om misstänkta transaktioner lämnas till finansunderrättelseenheten
    eller inte, samt en kopia av dessa rapporter om misstänkta transaktioner om det
    finns några. c) Styrkande handlingar och dokumentation av transaktioner i form
    av originalhandlingar eller i rättsliga förfaranden godkända kopior enligt tillämplig
    nationell rätt, vilka behövs för att identifiera transaktioner. d) Kopior av de
    handlingar och den information som erhållits inom ramen för partnerskap för informationsutbyte
    enligt kapitel VI samt dokumentation av alla fall av informationsutbyte, när de
    deltar i sådana partnerskap. Ansvariga enheter ska säkerställa att handlingar,
    uppgifter och dokumentation enligt denna artikel inte redigeras. 2. Genom undantag
    från punkt 1 får ansvariga enheter besluta att ersätta lagring av kopior av uppgifterna
    med lagring av hänvisningar till sådana uppgifter, förutsatt att arten av och
    metoden för lagring av sådana uppgifter säkerställer att de ansvariga enheterna
    omedelbart kan lämna uppgifterna till de behöriga myndigheterna och att uppgifterna
    inte kan ändras. De ansvariga enheter som använder sig av det undantag som avses
    i första stycket ska i sina interna förfaranden som upprättas enligt artikel 9
    fastställa vilka kategorier av uppgifter som de kommer att spara en hänvisning
    till i stället för en kopia eller ett original, samt förfarandena för att hämta
    uppgifterna så att de på begäran kan lämnas till behöriga myndigheter. 3. De uppgifter
    som avses i punkterna 1 och 2 ska sparas under en period på fem år från och med
    den dag då affärsförbindelsen avbryts eller den dag då den enstaka transaktionen
    utfördes eller den dag då inledandet av en affärsförbindelse eller genomförandet
    av en enstaka transaktion vägrades. Utan att det påverkar lagringsperioder för
    uppgifter som samlats in i enlighet med andra unionsrättsakter eller nationell
    rätt som är förenliga med förordning (EU) 2016/679 ska ansvariga enheter radera
    personuppgifter vid utgången av denna lagringsperiod. De behöriga myndigheterna
    får från fall till fall kräva ytterligare lagring av de uppgifter som avses i
    första stycket, förutsatt att sådan lagring är nödvändig för att förebygga, upptäcka,
    utreda eller lagföra penningtvätt eller finansiering av terrorism. Den ytterligare
    lagringstiden ska inte överstiga en period på fem år. 4. I de fall där det den
    10 juli 2027 i en medlemsstat pågår rättsliga förfaranden som rör förebyggande,
    upptäckt, utredning eller lagföring av misstänkt penningtvätt eller finansiering
    av terrorism, och en ansvarig enhet innehar uppgifter eller handlingar som rör
    dessa pågående förfaranden, får den ansvariga enheten lagra dessa uppgifter eller
    handlingar för en period på fem år från och med den 10 juli 2027. Medlemsstaterna
    får, utan att det påverkar nationell straffrätt om bevis som är tillämpliga på
    pågående brottsutredningar och rättsliga förfaranden, tillåta eller kräva att
    sådana uppgifter eller handlingar lagras i ytterligare fem år, om det har fastställts
    att en sådan ytterligare lagringstid är nödvändig och proportionerlig för att
    förebygga, upptäcka, utreda eller lagföra misstänkt penningtvätt eller finansiering
    av terrorism. Artikel 78'
