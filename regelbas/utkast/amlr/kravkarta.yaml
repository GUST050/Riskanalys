  motsvarigheter: []
  text: 'Identifiering av verkliga huvudmän för företag för kollektiva investeringar
    Genom undantag från artikel 51 första stycket och artikel 58.1 ska de verkliga
    huvudmännen för företag för kollektiva investeringar vara de fysiska personer
    som uppfyller ett eller flera av följande villkor: a) De innehar direkt eller
    indirekt minst 25 % av andelarna i företaget för kollektiva investeringar. b)
    De har möjlighet att fastställa eller påverka investeringspolicyn för företaget
    för kollektiva investeringar. c) De kontrollerar verksamheten i företaget för
    kollektiva investeringar på annat sätt. Artikel 62'
  delkrav: []
