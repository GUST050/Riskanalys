  motsvarigheter: []
  text: Filialer och dotterföretag i tredjeländer 1. Om ansvariga enheter har filialer
    eller dotterföretag i tredjeländer där minimikraven på bekämpning av penningtvätt
    och finansiering av terrorism är mindre stränga än de som anges i denna förordning
    ska moderföretaget säkerställa att dessa filialer eller dotterföretag uppfyller
    de krav som fastställs i denna förordning, inbegripet de krav som avser dataskydd,
    eller likvärdiga krav. 2. Om ett tredjelands lag inte medger att denna förordning
    följs ska moderföretaget vidta ytterligare åtgärder för att säkerställa att filialer
    och dotterföretag i det tredjelandet på ett effektivt sätt hanterar risken för
    penningtvätt eller finansiering av terrorism, och informera tillsynsorganen i
    sin hemmedlemsstat om dessa ytterligare åtgärder. Om tillsynsorganen i hemmedlemsstaten
    anser att de ytterligare åtgärderna inte är tillräckliga ska de vidta ytterligare
    tillsynsåtgärder, såsom att kräva av koncernen att den inte ingår några affärsförbindelser,
    att den avbryter befintliga affärsförbindelser eller inte utför transaktioner
    eller att den avvecklar sin verksamhet i tredjelandet. 3. Senast den 10 juli 2026
    ska Amla utarbeta förslag till tekniska standarder för tillsyn och överlämna dem
    till kommissionen för antagande. I förslagen till tekniska standarder för tillsyn
    ska det anges vilken typ av ytterligare åtgärder som avses i punkt 2 i den här
    artikeln, inbegripet de minimiåtgärder som ska vidtas av ansvariga enheter om
    ett tredjelands lag inte medger att de åtgärder som krävs enligt artikel 16 genomförs
    samt de ytterligare tillsynsåtgärder som krävs i sådana fall. 4. Kommissionen
    ges befogenhet att komplettera denna förordning genom att anta de tekniska standarder
    för tillsyn som avses i punkt 3 i denna artikel i enlighet med artiklarna 49–52
    i förordning (EU) 2024/1620. AVSNITT 3 Utkontraktering Artikel 18
