  text: Identifiering av tredjeländer med brister i efterlevnaden i sina nationella
    system för bekämpning av penningtvätt och finansiering av terrorism 1. Tredjeländer
    med brister i efterlevnaden i sina nationella system för bekämpning av penningtvätt
    och finansiering av terrorism ska identifieras av kommissionen. 2. För att identifiera
    de tredjeländer som avses i punkt 1 ges kommissionen befogenhet att anta delegerade
    akter i enlighet med artikel 85 för att komplettera denna förordning, i fall då
    a) brister i efterlevnaden har konstaterats i tredjelandets rättsliga och institutionella
    ramverk för bekämpning av penningtvätt och finansiering av terrorism, b) brister
    i efterlevnaden har konstaterats i effektiviteten hos tredjelandets system för
    bekämpning av penningtvätt och finansiering av terrorism när det gäller hantering
    av riskerna för penningtvätt eller finansiering av terrorism eller i dess system
    för bedömning och minskning av riskerna för att FN:s ekonomiska sanktioner relaterade
    till finansiering av spridning av massförstörelsevapen kringgås eller inte genomförs.
    Dessa delegerade akter ska antas inom 20 kalenderdagar efter det att kommissionen
    förvissar sig om att kriterierna i första stycket a eller b är uppfyllda. 3. Kommissionen
    ska vid utarbetandet av de delegerade akter som avses i punkt 2 som en utgångspunkt
    för sin bedömning beakta information om jurisdiktioner som omfattas av ökad övervakning
    från internationella organisationer och normgivare med befogenheter på området
    för förhindrande av penningtvätt och bekämpning av finansiering av terrorism,
    samt relevanta utvärderingar, bedömningar, rapporter eller offentliga uttalanden
    från dessa. 4. Den delegerade akt som avses i punkt 2 ska bland de skärpta åtgärder
    för kundkännedom som förtecknas i artikel 34.4 fastställa de särskilda skärpta
    åtgärder för kundkännedom som ansvariga enheter ska tillämpa för att minska riskerna
    i samband med affärsförbindelser eller enstaka transaktioner som involverar fysiska
    eller juridiska personer från det tredjelandet. 5. Kommissionen ska regelbundet
    se över de delegerade akter som avses i punkt 2 för att säkerställa att de särskilda
    skärpta åtgärder för kundkännedom som fastställts enligt punkt 4 tar hänsyn till
    förändringar i tredjelandets ramverk för bekämpning av penningtvätt och finansiering
    av terrorism, och att de är proportionella och lämpliga i förhållande till riskerna.
    Artikel 31
