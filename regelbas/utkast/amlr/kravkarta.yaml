  motsvarigheter: []
  text: 'Verkligt huvudmannaskap genom kontroll 1. Kontroll över ett företag eller
    en annan juridisk enhet ska utövas genom ägarintresse eller på annat sätt. 2.
    I detta kapitel gäller följande definitioner: a) kontroll över den juridiska enheten
    : möjligheten att direkt eller indirekt utöva ett betydande inflytande och fatta
    relevanta beslut inom den juridiska enheten. b) indirekt kontroll över en juridisk
    enhet : kontroll över förmedlande juridiska enheter i ägarstrukturen eller i olika
    kedjor av ägarstrukturen, där den direkta kontrollen identifieras på varje nivå
    av strukturen. c) kontroll genom ägarintresse i företaget : direkt eller indirekt
    ägande av 50 % plus en av aktierna eller rösträtterna eller annat ägarintresse
    i företaget. 3. Kontroll över den juridiska enheten på annat sätt ska under alla
    omständigheter omfatta möjligheten att utöva a) i fråga om ett företag, majoriteten
    av rösträtterna i företaget, oavsett om de delas av personer som handlar i samförstånd
    eller inte, b) rätten att utse eller avsätta en majoritet av styrelseledamöterna,
    ledamöterna i förvaltnings-, lednings- eller tillsynsorganet eller liknande tjänstemän
    i den juridiska enheten, c) relevant vetorätt eller beslutsrätt som är knuten
    till andelen i företaget, d) beslut om vinstutdelning för den juridiska enheten
    eller beslut som leder till en överföring av den juridiska enhetens tillgångar.
    4. Utöver vad som anges i punkt 3 får kontroll över den juridiska enheten utövas
    på andra sätt. Beroende på den juridiska enhetens särskilda situation och struktur
    kan andra sätt att utöva kontroll omfatta följande: a) Formella eller informella
    avtal med ägare, medlemmar eller juridiska enheter, bestämmelser i bolagsordningen,
    partnerskapsavtal, syndikeringsavtal eller motsvarande handlingar eller avtal
    beroende på den juridiska enhetens särdrag samt omröstningsbestämmelser. b) Förhållanden
    mellan familjemedlemmar. c) Användning av formella eller informella arrangemang
    för nominella företrädare. I denna punkt avses med formellt arrangemang för nominella
    företrädare ett avtal eller likvärdigt arrangemang mellan en nominerande part
    och en nominerad part, där den nominerande parten är en juridisk enhet eller fysisk
    person som instruerar en nominerad part att agera för dennes räkning i en viss
    roll, inbegripet som styrelseledamot eller aktieägare eller instiftare, och den
    nominerade parten är en juridisk enhet eller fysisk person som instrueras av den
    nominerande parten att agera för dennes räkning. Artikel 54'
  delkrav: []
