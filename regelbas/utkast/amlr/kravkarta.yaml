- id: Artikel 1
  status: aterstaende
  motivering: Inventerad artikel. Juridisk relevans och delkrav återstår; svenska
    motsvarigheter får inte antas identiska.
  motsvarigheter: []
  text: Innehåll I denna förordning fastställs bestämmelser om a) de åtgärder som
    ska vidtas av ansvariga enheter för att förhindra penningtvätt och finansiering
    av terrorism, b) krav på transparens i fråga om verkligt huvudmannaskap för juridiska
    enheter, uttryckliga truster och liknande juridiska konstruktioner, c) åtgärder
    för att begränsa missbruket av anonyma instrument. Artikel 2
  delkrav: []
- id: Artikel 2
  status: aterstaende
  motivering: Inventerad artikel. Juridisk relevans och delkrav återstår; svenska
    motsvarigheter får inte antas identiska.
  motsvarigheter: []
  text: 'Definitioner 1. I denna förordning gäller följande definitioner: 1. penningtvätt
    : de handlingar som anges i artikel 3.1 och 3.5 i direktiv (EU) 2018/1673, inbegripet
    medhjälp, anstiftan och försök till dessa handlingar, oavsett om de handlingar
    som frambringat den egendom som ska tvättas begåtts på en medlemsstats territorium
    eller på ett tredjelands territorium; vetskap, uppsåt eller ändamål som utgör
    rekvisit för dessa gärningar får härledas ur objektiva, faktiska omständigheter.
    2. finansiering av terrorism : de handlingar som anges i artikel 11 i direktiv
    (EU) 2017/541, inbegripet medhjälp, anstiftan och försök till dessa handlingar,
    oavsett om handlingarna begås på en medlemsstats territorium eller på ett tredjelands
    territorium; vetskap, uppsåt eller ändamål som utgör rekvisit för dessa gärningar
    får härledas ur objektiva, faktiska omständigheter. 3. brottslig verksamhet :
    brottslig verksamhet enligt definitionen i artikel 2.1 i direktiv (EU) 2018/1673,
    samt bedrägeri som riktar sig mot unionens finansiella intressen enligt definitionen
    i artikel 3.2 i direktiv (EU) 2017/1371, passiv och aktiv korruption enligt definitionen
    i artikel 4.2 och förskingring enligt definitionen i artikel 4.3 andra stycket
    i det direktivet. 4. medel eller egendom : egendom enligt definitionen i artikel
    2.2 i direktiv (EU) 2018/1673. 5. kreditinstitut : a) ett kreditinstitut enligt
    definitionen i artikel 4.1.1 i Europaparlamentets och rådets förordning (EU) nr
    575/2013, b) en filial till ett kreditinstitut, enligt definitionen i artikel
    4.1.17 i förordning (EU) nr 575/2013, om den är belägen i unionen, oavsett om
    dess huvudkontor är beläget i en medlemsstat eller i ett tredjeland. 6. finansiellt
    institut : a) Ett företag som inte är ett kreditinstitut eller värdepappersföretag
    och som bedriver en eller flera av de verksamheter som anges i punkterna 2–12,
    14 och 15 i bilaga I till Europaparlamentets och rådets direktiv 2013/36/EU (
    32 ) , inbegripet sådan verksamhet som bedrivs vid valutaväxlingskontor, med undantag
    för de verksamheter som förtecknas i punkt 8 i bilaga I till direktiv (EU) 2015/2366,
    eller ett företag som har som huvudverksamhet att förvärva holdingföretag, inbegripet
    ett finansiellt holdingföretag, ett blandat finansiellt holdingföretag eller ett
    finansiellt holdingföretag med blandad verksamhet. b) Ett försäkringsföretag enligt
    definitionen i artikel 13.1 i Europaparlamentets och rådets direktiv 2009/138/EG
    ( 33 ) , i den mån det bedriver livförsäkringsverksamhet eller annan investeringsrelaterad
    försäkringsverksamhet som omfattas av det direktivet, inbegripet försäkringsholdingbolag
    och försäkringsholdingföretag med blandad verksamhet enligt definitionerna i artikel
    212.1 f respektive g i direktiv 2009/138/EG. c) En försäkringsförmedlare enligt
    definitionen i artikel 2.1.3 i direktiv (EU) 2016/97, om den förmedlar livförsäkringar
    och andra investeringsrelaterade försäkringstjänster, med undantag för försäkringsförmedlare
    som inte uppbär premier eller belopp som är avsedda för kunden och som agerar
    under ansvar av ett eller flera försäkringsföretag eller en eller flera försäkringsförmedlare
    för de respektive produkter som berör dem. d) Ett värdepappersföretag enligt definitionen
    i artikel 4.1.1 i Europaparlamentets och rådets direktiv 2014/65/EU ( 34 ) . e)
    Ett företag för kollektiva investeringar, i synnerhet i) ett företag för kollektiva
    investeringar i överlåtbara värdepapper (fondföretag) enligt definitionen i artikel
    1.2 i direktiv 2009/65/EG och dess förvaltningsbolag enligt definitionen i artikel
    2.1 b i det direktivet eller ett investeringsbolag som är auktoriserat i enlighet
    med det direktivet och som inte har utsett något förvaltningsbolag, vilka tillhandahåller
    andelar i fondföretag för försäljning i unionen, ii) en alternativ investeringsfond
    enligt definitionen i artikel 4.1 a i direktiv 2011/61/EU och dess förvaltare
    enligt definitionen i artikel 4.1 b i det direktivet som omfattas av det tillämpningsområde
    som anges i artikel 2 i det direktivet, f) En värdepapperscentral enligt definitionen
    i artikel 2.1.1 i Europaparlamentets och rådets förordning (EU) nr 909/2014 (
    35 ) . g) En kreditgivare enligt definitionen i artikel 4.2 i Europaparlamentets
    och rådets direktiv 2014/17/EU ( 36 ) och i artikel 3 b i Europaparlamentets och
    rådets direktiv 2008/48/EG ( 37 ) . h) En kreditförmedlare enligt definitionen
    i artikel 4.5 i direktiv 2014/17/EU och artikel 3 f i direktiv 2008/48/EG, om
    den innehar medel enligt definitionen i artikel 4.25 i direktiv (EU) 2015/2366
    i samband med kreditavtalet, med undantag för kreditförmedlare som bedriver verksamhet
    under ansvar av en eller flera kreditgivare eller kreditförmedlare. i) En leverantör
    av kryptotillgångstjänster. j) En filial till ett finansiellt institut som avses
    i leden a–i, när den är belägen i unionen, oavsett om dess huvudkontor är beläget
    i en medlemsstat eller i ett tredjeland. 7. kryptotillgång : kryptotillgång enligt
    definitionen i artikel 3.1.5 i förordning (EU) 2023/1114, utom när den omfattas
    av någon av de kategorier som anges i artikel 2.4 i den förordningen. 8. kryptotillgångstjänster
    : kryptotillgångstjänster enligt definitionen i artikel 3.1.16 i förordning (EU)
    2023/1114, med undantag för tillhandahållande av rådgivning om kryptotillgångar
    som avses i artikel 3.1.16 h i den förordningen. 9. leverantör av kryptotillgångstjänster:
    en leverantör av kryptotillgångstjänster enligt definitionen i artikel 3.1.15
    i förordning (EU) 2023/1114 som utför en eller flera kryptotillgångstjänster.
    10. finansiellt holdingföretag med blandad verksamhet : ett företag som inte är
    ett finansiellt holdingföretag eller ett blandat finansiellt holdingföretag och
    som inte är dotterföretag till ett annat företag och vars dotterföretag omfattar
    minst ett kreditinstitut eller finansiellt institut. 11. tjänsteleverantör till
    truster eller bolag : alla fysiska eller juridiska personer som affärsmässigt
    tillhandahåller tredje parter någon av följande tjänster: a) Bildande av bolag
    eller andra typer av juridiska personer. b) Fullgörande av funktion som styrelseledamot
    eller bolagsrättsligt ansvarig på ett bolag, partner i ett handelsbolag eller
    liknande ställning i andra juridiska personer, eller åtgärder för att någon annan
    ska utöva en sådan funktion. c) Tillhandahållande av säte, företagsadress, korrespondensadress
    eller administrativ adress samt andra därmed sammanhängande tjänster för ett aktiebolag,
    ett handelsbolag eller någon annan form av juridisk person eller juridisk konstruktion.
    d) Förvaltning av en uttrycklig trust eller utövande av motsvarande funktion för
    en liknande juridisk konstruktion, eller åtgärder för att någon annan ska kunna
    utöva sådan förvaltning eller motsvarande funktion. e) Funktion som nominell aktieägare
    för en annan person, eller åtgärder för att någon annan ska kunna utöva en sådan
    funktion. 12. speltjänster : en tjänst som innebär att penningvärden satsas på
    slumpspel, inbegripet spel med inslag av skicklighet, exempelvis lotterier, kasinospel,
    pokerspel och vadhållning som tillhandahålls på en fysisk plats eller annars på
    distans, på elektronisk eller annan teknisk väg för att underlätta kommunikation,
    och på enskild begäran av en tjänstemottagare. 13. icke-finansiellt holdingföretag
    med blandad verksamhet : ett företag som inte är ett finansiellt holdingföretag
    eller ett blandat finansiellt holdingföretag och som inte är dotterföretag till
    ett annat företag och vars dotterföretag omfattar minst en annan ansvarig enhet
    som avses i artikel 3.3. 14. fristående adress : fristående adress enligt definitionen
    i artikel 3.20 i förordning (EU) 2023/1113. 15. leverantör av gräsrotsfinansieringstjänster
    : leverantör av gräsrotsfinansieringstjänster enligt definitionen i artikel 2.1
    e i förordning (EU) 2020/1503. 16. förmedlare av gräsrotsfinansiering : ett annat
    företag än en leverantör av gräsrotsfinansieringstjänster och vars verksamhet,
    genom ett internetbaserat informationssystem som är öppet för allmänheten eller
    för ett begränsat antal finansiärer, ska sammanföra eller underlätta sammanförandet
    av a) projektägare, dvs. varje fysisk eller juridisk person som söker finansiering
    för projekt, bestående av en eller flera på förhand fastställda insatser som syftar
    till ett visst mål, inbegripet insamling av medel för ett visst ändamål eller
    evenemang, oavsett om projekten föreslås för allmänheten eller för ett begränsat
    antal finansiärer, och b) finansiärer, dvs. fysiska eller juridiska personer som
    bidrar till finansieringen av projekt genom lån, med eller utan ränta, eller gåvor,
    även när sådana gåvor ger givaren rätt till en icke-materiell förmån. 17. elektroniska
    pengar : elektroniska pengar enligt definitionen i artikel 2.2 i Europaparlamentets
    och rådets direktiv 2009/110/EG ( 38 ) , men med undantag för penningvärde enligt
    vad som avses i artikel 1.4 och 1.5 i det direktivet. 18. etablering : en ansvarig
    enhets faktiska utövande av en ekonomisk verksamhet som omfattas av artikel 3
    i en annan medlemsstat eller ett annat tredjeland än det land där dess huvudkontor
    är beläget på obestämd tid och genom en stabil infrastruktur, inbegripet a) en
    filial eller ett dotterföretag, b) när det gäller kreditinstitut och finansiella
    institut, en infrastruktur som betraktas som en etablering enligt en stabilitetsreglering.
    19. affärsförbindelse : en affärsmässig, yrkesmässig eller handelsmässig förbindelse
    som är förbunden med den yrkesmässiga verksamheten i en ansvarig enhet, som har
    ingåtts mellan en ansvarig enhet och en kund, även utan ett skriftligt avtal,
    och som när avtalet ingås förväntas ha, eller som senare får, ett inslag av upprepning
    eller en viss varaktighet. 20. förbundna transaktioner : två eller flera transaktioner
    med identiska eller liknande ursprung, destinationer och syften, eller andra relevanta
    särdrag, under en specifik period. 21. tredjeland : en jurisdiktion, en oberoende
    stat eller ett autonomt territorium som inte tillhör unionen och som har egen
    lagstiftning eller ett eget genomförandesystem för bekämpning av penningtvätt
    och finansiering av terrorism. 22. korrespondentförbindelse : a) tillhandahållande
    av banktjänster där ett kreditinstitut är korrespondent och ett annat kreditinstitut
    motpart, inbegripet tillhandahållande av ett löpande konto eller annat passivkonto
    och härtill knutna tjänster, t.ex. likviditetsförvaltning, internationella överföringar
    av medel enligt definitionen i artikel 4.25 i direktiv (EU) 2015/2366, checkavräkning,
    payable-through -konton och valutatjänster, b) förbindelserna mellan kreditinstitut
    och finansiella institut, inbegripet när liknande tjänster tillhandahålls av ett
    korrespondentinstitut till ett motpartsinstitut, och inbegripet förbindelser som
    ingåtts för värdepapperstransaktioner eller överföring av medel enligt definitionen
    i artikel 4.25 i direktiv (EU) 2015/2366, kryptotillgångstransaktioner eller överföringar
    av kryptotillgångar. 23. brevlådeinstitut : a) för andra kreditinstitut och finansiella
    institut än leverantörer av kryptotillgångstjänster: ett kreditinstitut eller
    finansiellt institut, eller ett institut som utför verksamhet som likställs med
    den som utförs av kreditinstitut eller finansiella institut, som är skapat i en
    jurisdiktion där det saknar en meningsfull fysisk närvaro och ledning och inte
    är anknutet till en reglerad finanskoncern. b) för leverantörer av kryptotillgångstjänster:
    en enhet vars namn finns i det register som inrättats av Europeiska värdepappers-
    och marknadsmyndigheten enligt artikel 110 i förordning (EU) 2023/1114 eller enheter
    i tredjeländer som tillhandahåller kryptotillgångstjänster utan att vara licensierade
    eller registrerade eller omfattas av tillsyn av bekämpningen av penningtvätt och
    finansiering av terrorism där. 24. konto för kryptotillgångar : ett konto för
    kryptotillgångar enligt definitionen i artikel 3.19 i förordning (EU) 2023/1113.
    25. anonymitetsstärkande mynt : kryptotillgångar som har inbyggda funktioner som
    är utformade för att anonymisera information vid överföring av kryptotillgångar,
    antingen systematiskt eller som ett valbart alternativ. 26. virtuellt IBAN-nummer
    : en identifierare som leder till att betalningar omdirigeras till ett betalkonto
    som identifieras av ett annat IBAN-nummer än denna identifierare. 27. LEI-kod
    ( Legal Entity Identifier ): en unik alfanumerisk referenskod baserad på ISO 17442-standarden
    och som tilldelats en juridisk enhet. 28. verklig huvudman : en fysisk person
    som ytterst äger eller kontrollerar en juridisk enhet eller en uttrycklig trust
    eller liknande juridisk konstruktion 29. uttrycklig trust : en trust som avsiktligt
    upprättats av instiftaren, inter vivos eller vid dödsfall, vanligtvis i form av
    en skriftlig handling, för att placera tillgångar under en förvaltares kontroll
    till förmån för en förmånstagare eller för ett bestämt ändamål. 30. föremål för
    en befogenhet : de fysiska eller juridiska personer eller den kategori av fysiska
    eller juridiska personer bland vilka förvaltare får välja ut förmånstagarna i
    en diskretionär trust. 31. förmånstagare vid uteblivet utövande av befogenheter
    : den fysiska eller juridiska person eller kategori av fysiska eller juridiska
    personer som är förmånstagare till en diskretionär trust om förvaltarna inte utövar
    sina diskretionära befogenheter. 32. juridisk konstruktion : en uttrycklig trust
    eller en konstruktion som till sin struktur eller funktion liknar en uttrycklig
    trust, inbegripet fiducie och vissa typer av Treuhand och fideicomiso. 33. grundläggande
    information : a) När det gäller en juridisk enhet: i) Juridisk form och namn.
    ii) Stiftelseurkunden och bolagsordningen, om den har tagits in i en separat handling,
    iii) Adress till stadgeenligt eller officiellt säte samt, om dessa skiljer sig
    från den adressen, huvudsakligt verksamhetsställe och land där den juridiska enheten
    skapades. iv) En förteckning över rättsliga företrädare. v) I förekommande fall,
    en förteckning över aktieägare eller medlemmar, inbegripet information om det
    antal aktier som innehas av varje aktieägare, kategorierna av dessa aktier och
    arten av tillhörande rösträtter. vi) Registreringsnummer, europeisk unik identifieringskod,
    skatteregistreringsnummer och identifieringskod för juridiska personer, om dessa
    uppgifter finns att tillgå. vii) För stiftelser, de tillgångar som stiftelsen
    innehar för att fullgöra sitt syfte. b) När det gäller en juridisk konstruktion:
    i) Den juridiska konstruktionens namn eller unika identifieringskod. ii) Trusturkund
    för trusten eller motsvarande handling. iii) Den juridiska konstruktionens syften,
    i förekommande fall. iv) De tillgångar som innehas i den juridiska konstruktionen
    eller som förvaltas genom den. v) Den plats där de uttryckliga trusternas förvaltare
    eller personer som innehar likvärdiga ställningar i den liknande juridiska konstruktionen
    har sin hemvist och, om denna är en annan, den plats från vilken den uttryckliga
    trusten eller den liknande juridiska konstruktionen förvaltas. 34. person i politiskt
    utsatt ställning : en fysisk person som innehar eller har innehaft viktiga offentliga
    funktioner, inbegripet följande: a) I en medlemsstat: i) Stats- eller regeringschefer,
    ministrar samt ställföreträdande och biträdande ministrar. ii) Parlamentsledamöter
    eller ledamöter av liknande lagstiftande organ. iii) Ledamöter i politiska partiers
    styrande organ som innehar platser i nationella verkställande eller lagstiftande
    organ eller i regionala eller lokala verkställande eller lagstiftande organ som
    företräder valkretsar med minst 50 000 invånare. iv) Domare i högsta domstolar,
    författningsdomstolar eller andra rättsliga organ på hög nivå vars beslut inte
    kan överklagas, utom under exceptionella omständigheter, v) Ledamöter i revisionsrätter
    eller styrelseledamöter i centralbanker. vi) Ambassadörer, chargés d’affaires
    samt höga officerare inom försvarsmakten. vii) Ledamöter i förvaltnings-, lednings-
    och tillsynsorgan i företag som, enligt någon av de förbindelser som förtecknas
    i artikel 22 i direktiv 2013/34/EU, kontrolleras antingen av staten eller, om
    dessa företag räknas som medelstora eller stora företag eller medelstora eller
    stora koncerner enligt definitionerna i artikel 3.3, 3.4, 3.6 och 3.7 i det direktivet,
    av regionala eller lokala myndigheter. viii) Chefer för regionala och lokala myndigheter,
    inbegripet kommungrupperingar och storstadsregioner med minst 50 000 invånare.
    ix) Andra viktiga offentliga funktioner som medlemsstaterna tillhandahåller. b)
    I en internationell organisation: i) De högsta tjänstemännen, deras ställföreträdare
    samt ledamöter av en internationell organisations styrelse eller motsvarande funktion.
    ii) Företrädare i en medlemsstat eller unionen. c) På unionsnivå: Funktioner på
    nivån för unionens institutioner och organ motsvarande de som anges i led a i,
    ii, iv, v och vi. d) I ett tredjeland: Funktioner motsvarande de som anges i led
    a. 35. familjemedlem : a) En make/maka eller en person med vilken registrerat
    partnerskap, borgerligt partnerskap eller liknande arrangemang ingåtts. b) Ett
    barn och en make/maka till, eller en person som ingått registrerat partnerskap,
    borgerligt partnerskap eller liknande arrangemang med det barnet. c) Förälder.
    d) För de funktioner som avses i punkt 34 a i och likvärdiga funktioner på unionsnivå
    eller i ett tredjeland, ett syskon. 36. känd nära medarbetare : a) en fysisk person
    om vilken det är känt att den gemensamt med en person i politiskt utsatt ställning
    är verkliga huvudmän till juridiska enheter eller juridiska konstruktioner, eller
    har andra nära affärsförbindelser med en person i politiskt utsatt ställning,
    b) en fysisk person som är den enda verkliga huvudmannen bakom juridiska enheter
    eller juridiska konstruktioner om vilka det är känt att de i praktiken har inrättats
    till förmån för en person i politiskt utsatt ställning. 37. ledningsorgan: ett
    eller flera organ vid en ansvarig enhet som utses i enlighet med nationell rätt
    och som har befogenhet att fastställa den ansvariga enhetens strategi, mål och
    allmänna inriktning och som har uppsikt över och övervakar ledningens beslutsfattande,
    och inbegriper de personer som i praktiken leder den ansvariga enhetens verksamhet;
    om inget sådant organ finns, den person som i praktiken leder den ansvariga enhetens
    verksamhet. 38. ledningsorgan i dess ledningsfunktion : det ledningsorgan som
    ansvarar för den dagliga ledningen av den ansvariga enheten. 39. ledningsorgan
    i dess tillsynsfunktion : ledningsorganet i dess roll att ha uppsikt över och
    övervaka ledningens beslutsfattande. 40. företagsledning : ledamöterna i ledningsorganet
    i dess ledningsfunktion, samt tjänstemän och anställda som har tillräckliga kunskaper
    om den ansvariga enhetens riskexponering mot penningtvätt och finansiering av
    terrorism och som har tillräckliga befogenheter att fatta beslut som påverkar
    dess riskexponering. 41. koncern : en grupp av företag som består av ett moderföretag,
    dess dotterföretag samt företag som står till varandra i ett sådant förhållande
    som avses i artikel 22 i direktiv 2013/34/EU. 42. moderföretag : a) för koncerner
    med huvudkontor som är beläget i unionen: en ansvarig enhet som är ett moderföretag
    enligt definitionen i artikel 2.9 i direktiv 2013/34/EU men inte självt ett dotterföretag
    till ett annat företag i unionen, förutsatt att minst ett dotterföretag är en
    ansvarig enhet. b) för koncerner med huvudkontor som är beläget utanför unionen
    och om minst två dotterföretag är ansvariga enheter som är etablerade i unionen:
    ett företag inom den koncernen som är etablerat i unionen och som i) är en ansvarig
    enhet, ii) är ett företag som inte är ett dotterföretag till ett annat företag
    som är en ansvarig enhet som är etablerad i unionen, iii) har en tillräckligt
    framträdande plats inom koncernen och en tillräcklig förståelse för den verksamhet
    inom koncernen som omfattas av kraven i denna förordning, och iv) ges ansvaret
    för att genomföra koncernomfattande krav enligt kapitel II avsnitt 2 i denna förordning.
    43. kontanter : kontanta medel enligt definitionen i artikel 2.1 a i Europaparlamentets
    och rådets förordning (EU) 2018/1672 ( 39 ) . 44. behörig myndighet : a) en finansunderrättelseenhet,
    b) en tillsynsmyndighet, c) en offentlig myndighet som har till uppgift att utreda
    eller lagföra penningtvätt, förbrott till penningtvätt eller finansiering av terrorism,
    eller som har till uppgift att spåra, beslagta eller frysa och förverka tillgångar
    som härrör från brott, d) en offentlig myndighet med specifikt ansvar för att
    bekämpa penningtvätt eller finansiering av terrorism. 45. tillsynsorgan: ett organ
    som anförtrotts ansvar att säkerställa att ansvariga enheter efterlever kraven
    i denna förordning, inbegripet Amla när denna utför de uppgifter den anförtros
    i artikel 5.2 i förordning (EU) 2024/1620. 46. tillsynsmyndighet : ett tillsynsorgan
    som är ett offentligt organ eller den offentliga myndighet under vars överinseende
    självreglerande organ utför sina tillsynsfunktioner enligt artikel 37 i direktiv
    (EU) 2024/1640, eller Amla när det agerar som tillsynsorgan. 47. självreglerande
    organ : ett organ som representerar medlemmar i en yrkesgrupp och har i uppgift
    att reglera dem, utföra vissa tillsyns- eller övervakningsfunktioner och säkerställa
    att reglerna som rör dem följs. 48. medel eller andra tillgångar : alla tillgångar,
    inbegripet men inte begränsat till finansiella tillgångar, ekonomiska resurser,
    inbegripet olja och andra naturresurser, egendom av alla slag, materiell eller
    immateriell, lös eller fast, oavsett hur den har förvärvats, samt rättsliga handlingar
    eller instrument i alla former, även elektroniska eller digitala, som styrker
    äganderätt till eller intresse i sådana medel eller andra tillgångar, inbegripet
    men inte begränsat till bankkrediter, resecheckar, bankcheckar, betalningsorder,
    aktier, värdepapper, obligationer, växlar eller remburser samt räntor, utdelningar
    eller andra inkomster eller värden som härrör från eller genereras av sådana medel
    eller andra tillgångar, samt alla andra tillgångar som potentiellt kan användas
    för att erhålla medel, varor eller tjänster. 49. riktade ekonomiska sanktioner
    : frysning av tillgångar och förbud mot att ställa medel eller andra tillgångar
    till förfogande, direkt eller indirekt, till förmån för personer och enheter som
    upptagits på förteckningar enligt rådsbeslut antagna på grundval av artikel 29
    i EU-fördraget och rådsförordningar antagna på grundval av artikel 215 i EUF-fördraget.
    50. FN:s ekonomiska sanktioner : frysning av tillgångar och förbud mot att ställa
    medel eller andra tillgångar till förfogande, direkt eller indirekt, till förmån
    för personer och enheter som upptagits på förteckningar enligt: a) FN:s säkerhetsråds
    resolution 1267 (1999) och efterföljande resolutioner, b) FN:s säkerhetsråds resolution
    1373 (2001), inbegripet fastställandet av att de relevanta sanktionerna ska tillämpas
    på personen eller enheten och offentliggörandet av detta fastställande, c) FN:s
    ekonomiska sanktioner relaterade till finansiering av spridning av massförstörelsevapen.
    51. FN:s ekonomiska sanktioner relaterade till finansiering av spridning av massförstörelsevapen
    : frysning av tillgångar och förbud mot att ställa medel eller andra tillgångar
    till förfogande, direkt eller indirekt, till förmån för personer och enheter som
    upptagits på förteckningar enligt: a) FN:s säkerhetsråds resolution 1718 (2006)
    och efterföljande resolutioner, b) FN:s säkerhetsråds resolution 2231 (2015) och
    efterföljande resolutioner, c) alla andra resolutioner från FN:s säkerhetsråd
    om frysning av tillgångar och förbud mot att ställa medel eller andra tillgångar
    till förfogande i samband med finansiering av spridning av massförstörelsevapen.
    52. professionell fotbollsklubb : en juridisk person som är, äger eller förvaltar
    en fotbollsklubb som har beviljats licens och deltar i den eller de nationella
    fotbollsligorna i en medlemsstat och vars spelare och personal är kontrakterade
    och får ersättning i utbyte mot sina tjänster. 53. fotbollsagen t: en fysisk eller
    juridisk person som mot en avgift tillhandahåller förmedlingstjänster och företräder
    fotbollsspelare eller professionella fotbollsklubbar i förhandlingar för att ingå
    ett avtal för en fotbollsspelare eller företräder professionella fotbollsklubbar
    i förhandlingar om att ingå ett övergångsavtal för en fotbollsspelare. 54. varor
    av högt värde : varor som förtecknas i bilaga IV. 55. ädla metaller och ädelstenar
    : metaller och stenar som förtecknas i bilaga V. 56. kulturföremå l: varor som
    förtecknas i bilaga I till rådets förordning (EG) nr 116/2009 ( 40 ) . 57. partnerskap
    för informationsutbyte : en mekanism som gör det möjligt att dela och behandla
    information mellan ansvariga enheter och, i tillämpliga fall, de behöriga myndigheter
    som avses i led 44 a, b och c, i syfte att förebygga och bekämpa penningtvätt,
    förbrott till penningtvätt och finansiering av terrorism, oavsett om det sker
    på nationell nivå eller över gränserna, och oavsett form av partnerskap. 2. Viktiga
    offentliga funktioner enligt punkt 1.34 ska inte anses omfatta tjänstemän på mellannivå
    eller lägre tjänstemän. 3. Om det är motiverat med beaktande av deras administrativa
    organisation och av risk får medlemsstaterna fastställa lägre tröskelvärden för
    följande viktiga offentliga funktioner a) ledamöter i styrande organ för politiska
    partier som är representerade på regional eller lokal nivå, som avses i punkt
    1.34 a iii, b) chefer för regionala och lokala myndigheter, som avses i punkt
    1.34 a iii, Medlemsstaterna ska underrätta kommissionen om dessa lägre tröskelvärden.
    4. När det gäller punkt 1.34 a vii i denna artikel, om det är motiverat med beaktande
    av deras administrativa organisation och av risk, får medlemsstaterna fastställa
    lägre tröskelvärden för identifiering av andra företag som kontrolleras av regionala
    eller lokala myndigheter än de som definieras i artikel 3.3, 3.4, 3.6 och 3.7
    i direktiv 2013/34/EU. Medlemsstaterna ska underrätta kommissionen om dessa lägre
    tröskelvärden. 5. Om det är motiverat på grund av deras sociala och kulturella
    strukturer och på grund av risker får medlemsstaterna tillämpa ett mer omfattande
    tillämpningsområde för att betrakta syskon som familjemedlemmar till personer
    i politiskt utsatt ställning, som avses i punkt 1.35 d. Medlemsstaterna ska underrätta
    kommissionen om detta mer omfattande tillämpningsområde. AVSNITT 2 Tillämpningsområde
    Artikel 3'
