    den 10 juli 2029. Denna förordning är till alla delar bindande och direkt tillämplig
    i alla medlemsstater. Utfärdad i Bryssel den 31 maj 2024. På Europaparlamentets
    vägnar Ordförande R. METSOLA På rådets vägnar Ordförande H. LAHBIB ( 1 ) EUT C
