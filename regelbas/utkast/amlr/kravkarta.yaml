  motsvarigheter: []
  text: 'Vidtagande av åtgärder för kundkännedom 1. Ansvariga enheter ska vidta åtgärder
    för kundkännedom under någon av följande omständigheter: a) När en affärsförbindelse
    ingås. b) Vid utförandet av enstaka transaktioner till ett värde av minst 10 000
    EUR, eller motsvarande belopp i nationell valuta, oavsett om den transaktionen
    utförs vid ett enda tillfälle eller genom förbundna transaktioner, eller ett lägre
    värde som fastställts enligt punkt 9. c) Vid deltagande i skapandet av en juridisk
    enhet, upprättandet av en juridisk konstruktion eller, för de ansvariga enheter
    som avses i artikel 3.3 a, b eller c, i överföringen av äganderätten till en juridisk
    enhet, oberoende av transaktionens värde. d) När det finns misstankar om penningtvätt
    eller finansiering av terrorism, oavsett eventuella undantag eller tröskelvärden.
    e) När det råder tvivel om hur tillförlitliga eller tillräckliga tidigare erhållna
    kundidentifieringsuppgifter är. f) När det råder tvivel om huruvida den person
    som de interagerar med är en kund eller en person som är bemyndigad att agera
    på kundens vägnar. 2. Utöver de omständigheter som avses i punkt 1 ska kreditinstitut
    och finansiella institut, med undantag av leverantörer av kryptotillgångstjänster,
    vidta åtgärder för kundkännedom när de initierar eller utför en enstaka transaktion
    som utgör en överföring av medel enligt definitionen i artikel 3.9 i förordning
    (EU) 2023/1113, till ett värde av minst 1 000 EUR, eller motsvarande belopp i
    nationell valuta, oavsett om den transaktionen utförs vid ett enda tillfälle eller
    genom förbundna transaktioner. 3. Genom undantag från punkt 1 b ska leverantörer
    av kryptotillgångstjänster a) vidta åtgärder för kundkännedom när de utför en
    enstaka transaktion till ett värde av minst 1 000 EUR, eller motsvarande belopp
    i nationell valuta, oavsett om transaktionen utförs vid ett enda tillfälle eller
    genom förbundna transaktioner, b) vidta åtminstone de åtgärder för kundkännedom
    som avses i artikel 20.1 a när de utför en enstaka transaktion där värdet understiger
    1 000 EUR, eller motsvarande belopp i nationell valuta, oavsett om transaktionen
    utförs vid ett enda tillfälle eller genom förbundna transaktioner. 4. Genom undantag
    från punkt 1 b ska ansvariga enheter vidta åtminstone de åtgärder för kundkännedom
    som avses i artikel 20.1 a när de utför en enstaka transaktion i kontanta medel
    till ett värde av minst 3 000 EUR, eller motsvarande belopp i nationell valuta,
    oavsett om transaktionen utförs vid ett enda tillfälle eller genom förbundna transaktioner.
    Första stycket i denna punkt ska inte vara tillämpligt om medlemsstaterna i enlighet
    med artikel 80.2 och 80.3 har infört en gräns för stora kontantbetalningar på
    högst 3 000 EUR, eller motsvarande belopp i nationell valuta, utom i de fall som
    omfattas av punkt 4 b i den artikeln. 5. Utöver de omständigheter som avses i
    punkt 1 ska tillhandahållare av speltjänster vidta åtgärder för kundkännedom vid
    utbetalning av vinster, betalning av insatser, eller båda, vid transaktioner som
    uppgår till minst 2 000 EUR eller motsvarande belopp i nationell valuta, oavsett
    om transaktionen utförs vid ett enda tillfälle eller genom förbundna transaktioner.
    6. Vid tillämpningen av detta kapitel ska ansvariga enheter betrakta följande
    personer som sina kunder: a) När det gäller de ansvariga enheter som avses i artikel
    3.3 e, f och i och personer som handlar med varor med högt värde enligt artikel
    3.3 j: utöver deras direkta kund, varuleverantören. b) När det gäller notarier,
    advokater och andra oberoende jurister som agerar som mellanhänder i en transaktion
    och i den mån de är den enda notarie eller advokat eller annan oberoende jurist
    som agerar som mellanhand i transaktionen: båda parterna i transaktionen. c) När
    det gäller fastighetsmäklare: båda parterna i transaktionen. d) När det gäller
    betalningsinitieringstjänster som utförs av leverantörer av betalningsinitieringstjänster:
    säljföretaget. e) När det gäller leverantörer av gräsrotsfinansieringstjänster
    och förmedlare av gräsrotsfinansiering: den fysiska eller juridiska person som
    både söker finansiering och tillhandahåller finansiering via plattformen för gräsrotsfinansiering.
    7. Tillsynsorganen får, direkt eller i samarbete med andra myndigheter i den medlemsstaten,
    undanta ansvariga enheter från att helt eller delvis tillämpa de åtgärder för
    kundkännedom som avses i artikel 20.1 a, b och c med avseende på elektroniska
    pengar på grundval av den bevisade låga risken till följd av produktens art, om
    samtliga följande riskreducerande villkor är uppfyllda: a) Betalningsinstrumentet
    är inte återuppladdningsbart och det högsta belopp som lagras elektroniskt överstiger
    inte 150 EUR eller motsvarande belopp i nationell valuta. b) Betalningsinstrumentet
    används uteslutande för att köpa varor eller tjänster som tillhandahålls av utgivaren
    eller inom ett nätverk av tjänsteleverantörer. c) Betalningsinstrumentet är inte
    kopplat till ett betalkonto och det tillåter inte att något lagrat belopp byts
    mot kontanta medel eller mot kryptotillgångar. d) Utgivaren övervakar transaktionen
    eller affärsförbindelsen så noga att denne kan upptäcka ovanliga eller misstänkta
    transaktioner. 8. Tillhandahållare av speltjänster får fullgöra sin skyldighet
    att vidta åtgärder för kundkännedom som avses i artikel 20.1 a genom att kunden
    identifieras och kundens identitet kontrolleras vid inträdet i kasinot eller på
    andra fysiska spelplatser, förutsatt att de har system som gör det möjligt för
    dem att hänföra transaktioner till specifika kunder. 9. Senast den 10 juli 2026
    ska Amla utarbeta förslag till tekniska standarder för tillsyn och överlämna dem
    till kommissionen för antagande. I förslagen till tekniska standarder för tillsyn
    ska följande anges: a) De ansvariga enheter, sektorer eller transaktioner som
    är förknippade med större risk för penningtvätt och finansiering av terrorism
    och för vilka ett lägre värde än det värde som fastställs i punkt 1 b tillämpas.
    b) De relaterade värdena för enstaka transaktioner. c) De kriterier som ska beaktas
    för att identifiera enstaka transaktioner och affärsförbindelser. d) Kriterier
    för identifiering av förbundna transaktioner. Vid utarbetandet av de förslag till
    tekniska standarder för tillsyn som avses i första stycket ska Amla ta vederbörlig
    hänsyn till den inneboende risknivån hos olika typer av ansvariga enheters olika
    affärsmodeller och den riskbedömning på unionsnivå som kommissionen gjort enligt
    artikel 7 i direktiv (EU) 2024/1640. 10. Kommissionen ges befogenhet att komplettera
    denna förordning genom att anta de tekniska standarder för tillsyn som avses i
    punkt 9 i denna artikel i enlighet med artiklarna 49–52 i förordning (EU) 2024/1620.
    Artikel 20'
