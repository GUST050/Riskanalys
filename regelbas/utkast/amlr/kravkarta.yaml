  text: Behandling av personuppgifter 1. I den mån det är absolut nödvändigt för att
    förhindra penningtvätt och finansiering av terrorism får ansvariga enheter behandla
    de särskilda kategorier av personuppgifter som avses i artikel 9.1 i förordning
    (EU) 2016/679 samt de personuppgifter som rör fällande domar i brottmål och de
    överträdelser som avses i artikel 10 i den förordningen, med förbehåll för de
    skyddsåtgärder som föreskrivs i punkterna 2 och 3 i den här artikeln. 2. De ansvariga
    enheterna ska kunna behandla de personuppgifter som omfattas av artikel 9 i förordning
    (EU) 2016/679 under förutsättning att a) de informerar sina kunder eller presumtiva
    kunder om att sådana kategorier av uppgifter får behandlas i syfte att uppfylla
    kraven i denna förordning, b) uppgifterna kommer från tillförlitliga källor, är
    korrekta och aktuella, c) de inte fattar beslut som skulle leda till partiska
    och diskriminerande resultat på grundval av dessa uppgifter, d) de vidtar åtgärder
    med hög säkerhetsnivå i enlighet med artikel 32 i förordning (EU) 2016/679, särskilt
    när det gäller konfidentialitet. 3. Ansvariga enheter ska kunna behandla personuppgifter
    som omfattas av artikel 10 i förordning (EU) 2016/679 förutsatt att de uppfyller
    villkoren som fastställs i punkt 2 i den här artikeln och att a) sådana personuppgifter
    rör penningtvätt, förbrott till penningtvätt eller finansiering av terrorism,
    b) de ansvariga enheterna har inrättat förfaranden som gör det möjligt att vid
    behandlingen av sådana uppgifter skilja mellan påståenden, utredningar, förfaranden
    och domar, med beaktande av den grundläggande rätten till en rättvis rättegång,
    rätten till försvar och oskuldspresumtionen. 4. Personuppgifter ska behandlas
    av ansvariga enheter på grundval av denna förordning endast i syfte att förebygga
    penningtvätt och finansiering av terrorism och får inte senare behandlas på ett
    sätt som är oförenligt med dessa syften. Behandling av personuppgifter på grundval
    av denna förordning för kommersiella ändamål ska vara förbjuden. 5. Ansvariga
    enheter får anta beslut till följd av automatiserade processer, inbegripet profilering
    enligt definitionen i artikel 4.4 i förordning (EU) 2016/679 eller processer som
    inbegriper AI-system enligt definitionen i artikel 3.1 i Europaparlamentets och
    rådets förordning (EU) 2024/xxx ( 45 ) förutsatt att a) de uppgifter som behandlas
    av sådana system är begränsade till uppgifter som erhållits enligt kapitel III
    i den här förordningen, b) varje beslut om att inleda eller vägra att inleda eller
    upprätthålla en affärsförbindelse med en kund eller att utföra eller vägra att
    utföra en enstaka transaktion för en kund, eller att öka eller minska omfattningen
    av de åtgärder för kundkännedom som tillämpas enligt artikel 20 i denna förordning,
    är föremål för meningsfullt mänskligt ingripande för att säkerställa att ett sådant
    beslut är korrekt och lämpligt, och c) kunden kan få en förklaring av det beslut
    som fattats av den ansvariga enheten och får överklaga det beslutet, förutom när
    det gäller en rapport som avses i artikel 69 i denna förordning. Artikel 77
  delkrav: []
