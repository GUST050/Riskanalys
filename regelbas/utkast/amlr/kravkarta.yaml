  text: Medvetenhet om kraven Ansvariga enheter ska vidta åtgärder för att säkerställa
    att deras anställda eller personer i jämförbar ställning, i den mån de har en
    funktion som kräver det, inbegripet deras ombud och distributörer, är medvetna
    om de krav som följer av denna förordning, förordning (EU) 2023/1113, och alla
    förvaltningsakter som utfärdats av något tillsynsorgan, och av den verksamhetsomfattande
    riskbedömningen och de riktlinjer, förfaranden och kontroller som införts inom
    den ansvariga enheten, även vad gäller behandling av personuppgifter vid tillämpningen
    av denna förordning. De åtgärder som avses i första stycket ska inbegripa att
    de anställda, eller personer i jämförbara ställningar, inbegripet ombud och distributörer,
    deltar i särskilda fortlöpande utbildningsprogram för att hjälpa dem att känna
    igen transaktioner som kan vara kopplade till penningtvätt eller finansiering
    av terrorism samt instruera dem om hur de ska handla i sådana fall. Dessa utbildningsprogram
    ska vara lämpliga med hänsyn till deras funktioner eller verksamheter och till
    de risker för penningtvätt och finansiering av terrorism som den ansvariga enheten
    är exponerad för och ska dokumenteras på vederbörligt sätt. Artikel 13
