  text: Anställdas integritet 1. En anställd, eller person i jämförbar ställning,
    inbegripet ombud och distributörer, som deltar direkt i den ansvariga enhetens
    efterlevnad av denna förordning, förordning (EU) 2023/1113, och alla förvaltningsakter
    som utfärdats av något tillsynsorgan, ska genomgå en bedömning som står i proportion
    till de risker som är förknippade med de uppgifter som utförs och vars innehåll
    har godkänts av den regelefterlevnadsansvariga med avseende på a) individuell
    kompetens, kunskap och expertis att effektivt utföra funktionerna, b) gott anseende,
    ärlighet och integritet. Den bedömning som avses i första stycket ska göras innan
    den anställde eller personen i jämförbar ställning, inbegripet ombud och distributörer,
    inleder sin verksamhet och ska upprepas regelbundet. Intensiteten i de efterföljande
    bedömningarna ska fastställas på grundval av de uppgifter som personen anförtros
    och de risker som är förknippade med den funktion som denne utför. 2. Anställda,
    eller personer i jämförbar ställning, inbegripet ombud och distributörer, som
    anförtros uppgifter som rör den ansvariga enhetens efterlevnad av denna förordning,
    förordning (EU) 2023/1113, och alla förvaltningsakter som utfärdats av något tillsynsorgan,
    ska informera den regelefterlevnadsansvariga om alla eventuella nära privata eller
    yrkesmässiga relationer till den ansvariga enhetens kunder eller presumtiva kunder
    och ska förhindras från att utföra uppgifter som rör den ansvariga enhetens efterlevnad
    i relation till dessa kunder. 3. Ansvariga enheter ska inrätta förfaranden för
    att förebygga och hantera intressekonflikter som kan påverka utförandet av uppgifter
    som rör den ansvariga enhetens efterlevnad av denna förordning, förordning (EU)
    2023/1113, och alla förvaltningsakter som utfärdats av något tillsynsorgan. 4.
    Denna artikel ska inte tillämpas om den ansvariga enheten är en fysisk person
    eller en juridisk person vars verksamhet bedrivs av en enda fysisk person. Artikel
    14
