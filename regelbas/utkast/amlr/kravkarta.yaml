  text: Anmälningar Varje medlemsstat ska senast den 10 oktober 2027 till kommissionen
    anmäla en förteckning över de typer av rättsliga enheter som enligt dess nationella
    rätt finns med verkliga huvudmän som identifierats i enlighet med artiklarna 51
    och 52.4. Den anmälan ska omfatta särskilda kategorier av enheter, beskrivning
    av egenskaper och, i tillämpliga fall, rättslig grund enligt den berörda medlemsstatens
    nationella rätt. Den ska också innehålla en uppgift om huruvida mekanismen enligt
    artikel 63.4 är tillämplig, med avseende på den specifika formen och strukturen
    hos andra juridiska enheter än företag, tillsammans med en detaljerad motivering
    av skälen till detta. Kommissionen ska informera de övriga medlemsstaterna om
    den anmälan som avses i första stycket. Artikel 57
  delkrav: []
