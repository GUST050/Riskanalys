  text: Funktioner för regelefterlevnad 1. Ansvariga enheter ska utse en ledamot av
    ledningsorganet i dess ledningsfunktion som ska ansvara för att säkerställa efterlevnaden
    av denna förordning, förordning (EU) 2023/1113, och alla förvaltningsakter som
    utfärdats av något tillsynsorgan ( regelefterlevnadschef ). Regelefterlevnadschefen
    ska säkerställa att den ansvariga enhetens interna riktlinjer, förfaranden och
    kontroller överensstämmer med den ansvariga enhetens riskexponering och att de
    genomförs. Regelefterlevnadschefen ska också säkerställa att det avsätts tillräckligt
    med mänskliga och materiella resurser för detta ändamål. Regelefterlevnadschefen
    ska ansvara för att ta emot uppgifter om betydande eller väsentliga brister i
    sådana riktlinjer, förfaranden och kontroller. Om ledningsorganet i dess ledningsfunktion
    är ett organ som gemensamt ansvarar för sina beslut ska regelefterlevnadschefen
    ansvara för att bistå och ge råd till detta och för att förbereda de beslut som
    avses i denna artikel. 2. Ansvariga enheter ska ha en regelefterlevnadsansvarig,
    som ska utses av ledningsorganet i dess ledningsfunktion och ha en tillräckligt
    hög ställning i hierarkin, som ska vara ansvarig för riktlinjerna, förfarandena
    och kontrollerna i det dagliga arbetet med den ansvariga enhetens riktlinjer för
    kraven på bekämpning av penningtvätt och finansiering av terrorism, inbegripet
    i samband med genomförandet av riktade ekonomiska sanktioner, och ska utgöra en
    kontaktpunkt för behöriga myndigheter. Den regelefterlevnadsansvariga ska också
    ansvara för att rapportera misstänkta transaktioner till finansunderrättelseenheten
    enligt artikel 69.6. När det gäller ansvariga enheter vars företagsledning eller
    verkliga huvudmän omfattas av kontroller enligt artikel 6 i direktiv (EU) 2024/1640
    eller andra unionsrättsakter ska det kontrolleras att de regelefterlevnadsansvariga
    uppfyller de aktuella kraven. Om det är motiverat på grund av den ansvariga enhetens
    storlek och en låg risknivå på dess verksamhet får en ansvarig enhet som ingår
    i en koncern utse en person som utför funktionen som regelefterlevnadsansvarig
    vid en annan enhet inom samma koncern till regelefterlevnadsansvarig. Den regelefterlevnadsansvariga
    får endast entledigas efter förhandsanmälan till ledningsorganet i dess ledningsfunktion.
    Den ansvariga enheten ska underrätta tillsynsorganet om entledigandet av den regelefterlevnadsansvariga
    och ange om beslutet har samband med utförandet av de uppgifter som tilldelas
    enligt denna förordning. Den regelefterlevnadsansvariga får på eget initiativ
    eller på begäran lämna information om entledigandet till tillsynsorganet. Tillsynsorganet
    får använda den informationen för att utföra sina uppgifter enligt andra stycket
    i denna punkt och enligt artikel 37.4 i direktiv (EU) 2024/1640. 3. Ansvariga
    enheter ska tilldela efterlevnadsfunktionerna adekvata resurser, inbegripet personal
    och teknik, i proportion till den ansvariga enhetens storlek, typ och risker,
    så att uppgifterna kan utföras effektivt, och ska säkerställa att de personer
    som ansvarar för dessa funktioner beviljas befogenhet att föreslå sådana åtgärder
    som krävs för att säkerställa att den ansvariga enhetens interna riktlinjer, förfaranden
    och kontroller fungerar effektivt. 4. Ansvariga enheter ska vidta åtgärder för
    att säkerställa att den regelefterlevnadsansvariga är skyddad mot repressalier,
    diskriminering och annan orättvis behandling och att den regelefterlevnadsansvarigas
    beslut inte undermineras eller på ett otillbörligt sätt påverkas av den ansvariga
    enhetens affärsintressen. 5. Ansvariga enheter ska säkerställa att den regelefterlevnadsansvariga
    och den person som ansvarar för den revisionsfunktion som avses i artikel 9.2
    b på ett oberoende sätt kan rapportera direkt till ledningsorganet i dess ledningsfunktion
    och, om ett sådant organ finns, till ledningsorganet i dess tillsynsfunktion,
    och kan ta upp farhågor och varna ledningsorganet om en viss riskutveckling påverkar
    eller kan påverka den ansvariga enheten. Ansvariga enheter ska säkerställa att
    de personer som direkt eller indirekt deltar i genomförandet av denna förordning,
    förordning (EU) 2023/1113, och alla förvaltningsakter som utfärdats av något tillsynsorgan
    har tillgång till all information och alla uppgifter som behövs för att utföra
    sina uppgifter. 6. Regelefterlevnadschefen ska regelbundet rapportera till ledningsorganet
    om genomförandet av den ansvariga enhetens interna riktlinjer, förfaranden och
    kontroller. I synnerhet ska regelefterlevnadschefen en gång om året, eller i tillämpliga
    fall oftare, lämna in en rapport som den regelefterlevnadsansvariga utarbetat
    om genomförandet av den ansvariga enhetens interna riktlinjer, förfaranden och
    kontroller till ledningsorganet och hålla det informerat om resultatet av eventuella
    översyner. Regelefterlevnadschefen ska utan dröjsmål vidta de åtgärder som krävs
    för att avhjälpa eventuella brister som upptäcks. 7. Om det kan anses motiverat
    med tanke på arten av den ansvariga enhetens verksamhet, inbegripet dess risk
    och komplexitet, och storlek, får regelefterlevnadschefens och den regelefterlevnadsansvarigas
    funktioner utföras av en och samma fysiska person. Dessa funktioner får läggas
    samman med andra funktioner. Om den ansvariga enheten är en fysisk person eller
    en juridisk person vars verksamhet bedrivs av en enda fysisk person ska den personen
    ansvara för att utföra uppgifterna enligt denna artikel. Artikel 12
