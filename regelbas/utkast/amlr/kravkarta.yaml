  text: 'Förvaltares skyldigheter 1. När det gäller juridiska konstruktioner som förvaltas
    i en medlemsstat eller av en person med en likvärdig ställning i en liknande juridisk
    konstruktion som är bosatt eller etablerad i en medlemsstat ska förvaltarna och
    de personer som innehar en likvärdig ställning i en liknande juridisk konstruktion
    erhålla och inneha följande uppgifter om den juridiska konstruktionen: a) Grundläggande
    information om den juridiska konstruktionen. b) Adekvata, korrekta och aktuella
    uppgifter om verkligt huvudmannaskap enligt vad som föreskrivs i artikel 62. c)
    Om juridiska enheter eller juridiska konstruktioner är parter i den juridiska
    konstruktionen, grundläggande information och uppgifter om verkligt huvudmannaskap
    för dessa juridiska enheter och juridiska konstruktioner. d) Uppgifter om ombud
    som är bemyndigade att agera på den juridiska konstruktionens vägnar eller att
    vidta åtgärder med avseende på den och om de ansvariga enheter med vilka förvaltaren
    eller den person som innehar en likvärdig ställning i en liknande juridisk konstruktion
    ingår en affärsförbindelse på den juridiska konstruktionens vägnar. Den information
    som avses i första stycket ska sparas i fem år efter det att medverkan av förvaltaren
    eller den person som innehar en likvärdig ställning i den uttryckliga trusten
    eller den liknande juridiska konstruktionen har upphört. 2. Förvaltaren eller
    den person som innehar en likvärdig ställning i en liknande juridisk konstruktion
    ska inhämta och till det centrala registret rapportera uppgifter om verkligt huvudmannaskap
    och grundläggande information om den juridiska konstruktionen, utan onödigt dröjsmål
    efter upprättandet av den uttryckliga trusten eller den liknande juridiska konstruktionen,
    och under alla omständigheter inom 28 kalenderdagar därefter. Förvaltaren eller
    den person som innehar en likvärdig ställning i en liknande juridisk konstruktion
    ska säkerställa att varje ändring av verkligt huvudmannaskap eller av grundläggande
    information om den juridiska konstruktionen rapporteras till det centrala registret,
    utan onödigt dröjsmål, inom 28 kalenderdagar därefter. Förvaltaren eller den person
    som innehar en likvärdig ställning i en liknande juridisk konstruktion ska regelbundet
    kontrollera att de uppgifter om den juridiska konstruktionen enligt punkt 1 första
    stycket som han eller hon förfogar över uppdateras. Denna kontroll ska utföras
    minst en gång per år, antingen som en fristående process eller som en del av andra
    periodiska processer. 3. De förvaltare eller personer som innehar en likvärdig
    ställning i en liknande juridisk konstruktion som avses i punkt 1 ska offentliggöra
    sin status och tillhandahålla ansvariga enheter uppgifter om verkliga huvudmän
    och om de tillgångar i de juridiska konstruktionerna som ska förvaltas i samband
    med en affärsförbindelse eller en enstaka transaktion, när de ansvariga enheterna
    tillämpar åtgärder för kundkännedom i enlighet med kapitel III. 4. Andra verkliga
    huvudmän för en juridisk konstruktion än förvaltare eller de personer som innehar
    en likvärdig ställning, dess ombud och de ansvariga enheter som förvaltar den
    juridiska konstruktionen samt varje person och, när det gäller juridiska konstruktioner,
    deras förvaltare, som ingår i den juridiska konstruktionens kontrollstruktur med
    flera nivåer ska tillhandahålla förvaltarna eller de personer som innehar en likvärdig
    ställning i en liknande juridisk konstruktion alla de uppgifter och den dokumentation
    som krävs för att förvaltarna eller de personer som innehar en likvärdig ställning
    ska kunna uppfylla kraven i detta kapitel. 5. Förvaltare av en uttrycklig trust
    och personer som innehar en likvärdig ställning i en liknande juridisk konstruktion
    ska på begäran och utan dröjsmål tillgängliggöra den information som samlas in
    enligt denna artikel för behöriga myndigheter. 6. Om, när det gäller juridiska
    konstruktioner vars parter är juridiska enheter, ingen har identifierats som dessa
    juridiska enheters verkliga huvudman när alla tänkbara metoder för identifiering
    enligt artiklarna 51–57 har utnyttjats, eller om det då fortfarande råder betydande
    och välgrundat tvivel om att de personer som har identifierats är de verkliga
    huvudmännen, ska förvaltarna av de uttryckliga trusterna eller de personer som
    innehar en likvärdig ställning dokumentera de åtgärder som vidtas för att identifiera
    de verkliga huvudmännen. 7. I de fall som avses i punkt 6 i denna artikel ska
    förvaltare av uttryckliga truster eller personer som innehar en likvärdig ställning
    i liknande juridiska konstruktioner, när de tillhandahåller uppgifter om verkligt
    huvudmannaskap i enlighet med artikel 20 i denna förordning och artikel 10 i direktiv
    (EU) 2024/1640, tillhandahålla följande: a) En förklaring om att det inte finns
    någon verklig huvudman eller att de verkliga huvudmännen inte kunde fastställas,
    åtföljd av en motivering till varför det inte var möjligt att fastställa den verkliga
    huvudmannen i enlighet med artiklarna 51–57 i denna förordning och vad som utgör
    tvivel om de konstaterade uppgifterna. b) Uppgifter om alla fysiska personer som
    är en ledande befattningshavare i den juridiska enhet som är part i den juridiska
    konstruktionen motsvarande de uppgifter som krävs enligt artikel 62.1 andra stycket
    a i denna förordning. Artikel 65'
