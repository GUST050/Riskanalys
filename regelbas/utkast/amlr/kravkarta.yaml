  text: Särskilda skärpta åtgärder för kundkännedom för gränsöverskridande korrespondentförbindelser
    för leverantörer av kryptotillgångstjänster 1. Genom undantag från artikel 36
    ska leverantörer av kryptotillgångstjänster, när det gäller gränsöverskridande
    korrespondentförbindelser som inbegriper utförande av kryptotillgångstjänster,
    med en motpartsenhet som inte är etablerad i unionen och som tillhandahåller liknande
    tjänster, inbegripet överföringar av kryptotillgångar, utöver de åtgärder för
    kundkännedom som fastställs i artikel 20, när de ingår en affärsförbindelse, vara
    skyldiga att a) fastställa om motpartsenheten har tillstånd eller är registrerad,
    b) samla in så mycket information om motpartsenheten att de har full insikt i
    dess affärsverksamhet och utifrån offentligt tillgänglig information kan bedöma
    dess anseende och övervakningens kvalitet, c) bedöma de kontroller för bekämpning
    av penningtvätt och finansiering av terrorism som motpartsenheten har infört,
    d) inhämta godkännande från företagsledningen innan de ingår den nya korrespondentförbindelsen,
    e) dokumentera respektive ansvarsområden för varje part i korrespondentförbindelsen,
    f) för payable-through -konton för kryptotillgångar försäkra sig om att motpartsenheten
    har kontrollerat kundens identitet och löpande vidtagit åtgärder för kundkännedom
    med avseende på de kunder som har direkt tillgång till korrespondentenhetens konton
    och att den på begäran kan tillhandahålla korrespondentenheten relevanta kundkännedomsuppgifter.
    Om leverantörer av kryptotillgångstjänster beslutar att avsluta korrespondentförbindelser
    av skäl som rör strategin för bekämpning av penningtvätt och finansiering av terrorism,
    ska de dokumentera sitt beslut. Leverantörer av kryptotillgångstjänster ska uppdatera
    kundkännedomsuppgifterna för korrespondentförbindelsen regelbundet eller när nya
    risker uppstår i förhållande till motpartsenheten. 2. Leverantörer av kryptotillgångstjänster
    ska beakta de uppgifter som samlas in enligt punkt 1 för att på grundval av en
    riskbedömning fastställa vilka lämpliga åtgärder som ska vidtas för att minska
    de risker som är förknippade med motpartsenheten. 3. Senast den 10 juli 2027 ska
    Amla utfärda riktlinjer för att specificera de kriterier och aspekter som leverantörer
    av kryptotillgångstjänster ska ta i beaktande för den bedömning som avses i punkt
    1 och de riskreducerande åtgärder som avses i punkt 2, inbegripet de minimiåtgärder
    som leverantörer av kryptotillgångstjänster ska vidta efter fastställande av att
    motpartsenheten inte är registrerad eller har tillstånd. Artikel 38
  delkrav: []
