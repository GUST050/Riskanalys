  text: Förfarande för utnyttjande av en annan ansvarig enhets åtgärder för kundkännedom
    1. Ansvariga enheter ska från den ansvariga enheten inhämta alla nödvändiga uppgifter
    om de åtgärder för kundkännedom som föreskrivs i artikel 20.1 a, b och c, eller
    om den verksamhet som kommer att omfattas. 2. Ansvariga enheter som för kundkännedom
    utnyttjar andra ansvariga enheter ska vidta alla nödvändiga åtgärder för att säkerställa
    att den ansvariga enhet som de utnyttjar på begäran tillhandahåller a) kopior
    av den information som samlats in för att identifiera kunden, b) alla styrkande
    handlingar eller tillförlitliga informationskällor som använts för att kontrollera
    kundens identitet och, i förekommande fall, identiteten på kundens verkliga huvudmän
    eller de personer för vars räkning kunden agerar, inklusive uppgifter som erhållits
    med hjälp av medel för elektronisk identifiering och relevanta betrodda tjänster
    i enlighet med förordning (EU) nr 910/2014, och c) all information om affärsförbindelsens
    syfte och avsedda natur. 3. De uppgifter som avses i punkterna 1 och 2 ska tillhandahållas
    av den ansvariga enhet som utnyttjas utan dröjsmål och under alla omständigheter
    inom fem arbetsdagar. 4. Villkoren för översändande av de uppgifter och handlingar
    som avses i punkterna 1 och 2 ska specificeras i ett skriftligt avtal mellan de
    ansvariga enheterna. 5. Om den ansvariga enheten utnyttjar en ansvarig enhet som
    ingår i samma koncern får det skriftliga avtalet ersättas av ett internt förfarande
    som fastställts på koncernnivå, under förutsättning att alla villkor som fastställs
    i artikel 48.3 är uppfyllda. Artikel 50
  delkrav: []
