  text: Personer i politiskt utsatt ställning som är förmånstagare i försäkringsavtal
    Ansvariga enheter ska vidta rimliga åtgärder för att avgöra om livförsäkringars
    eller andra investeringsrelaterade försäkringars förmånstagare eller, i förekommande
    fall, förmånstagarens verkliga huvudman är personer i politiskt utsatt ställning.
    Dessa åtgärder ska vidtas senast då försäkringen helt eller delvis utbetalas eller
    överlåts. Om högre risker konstaterats ska ansvariga enheter utöver att tillämpa
    de åtgärder för kundkännedom som fastställs i artikel 20 a) informera företagsledningen
    innan försäkringsbeloppet utbetalas, b) skärpa kontrollen av hela affärsförbindelsen
    med försäkringstagaren. Artikel 45
  delkrav: []
