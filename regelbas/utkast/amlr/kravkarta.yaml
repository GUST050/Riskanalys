  text: 'Identifiering av en kategori av förmånstagare 1. När det gäller juridiska
    enheter som liknar uttryckliga truster enligt artikel 57 eller, med undantag för
    diskretionära truster, uttryckliga truster och liknande juridiska konstruktioner
    enligt artikel 58, där förmånstagarna ännu inte har fastställts, ska kategorin
    av förmånstagare och dess allmänna kännetecken identifieras. Förmånstagare inom
    kategorin ska vara verkliga huvudmän så snart de har identifierats eller utsetts.
    2. I följande fall ska endast kategorin av förmånstagare och dess kännetecken
    identifieras: a) Pensionsplaner som omfattas av direktiv (EU) 2016/2341. b) System
    för anställdas finansiella ägande eller deltagande, förutsatt att medlemsstaterna
    efter en lämplig riskbedömning har dragit slutsatsen att det är låg risk för missbruk
    för penningtvätt eller finansiering av terrorism. c) Juridiska enheter som liknar
    uttryckliga truster enligt artikel 57, uttryckliga truster och liknande juridiska
    konstruktioner enligt artikel 58, under förutsättning att i) den juridiska enheten,
    den uttryckliga trusten eller den liknande juridiska konstruktionen har inrättats
    utan vinstsyfte eller för välgörande ändamål, och ii) medlemsstaterna, efter en
    lämplig riskbedömning, har dragit slutsatsen att kategorin av juridisk enhet,
    uttrycklig trust eller liknande juridisk konstruktion löper låg risk för missbruk
    för penningtvätt eller finansiering av terrorism. 3. Medlemsstaterna ska underrätta
    kommissionen om kategorierna av juridiska enheter, uttryckliga truster och liknande
    juridiska konstruktioner enligt punkt 2, tillsammans med en motivering som grundar
    sig på den specifika riskbedömningen. Kommissionen ska informera de övriga medlemsstaterna
    om den underrättelsen. Artikel 60'
