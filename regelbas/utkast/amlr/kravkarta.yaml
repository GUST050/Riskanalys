- id: Artikel 22
  status: aterstaende
  motivering: Inventerad artikel. Juridisk relevans och delkrav återstår; svenska
    motsvarigheter får inte antas identiska.
  motsvarigheter: []
  text: 'Fastställande och kontroll av kundens och de verkliga huvudmännens identitet
    1. Med undantag för de fall av lägre risk där åtgärder enligt avsnitt 3 är tillämpliga
    och oaktat vidtagande av ytterligare åtgärder i fall av högre risk som omfattas
    av avsnitt 4 ska ansvariga enheter inhämta åtminstone följande uppgifter för att
    identifiera kunden, alla personer som påstår sig handla på kundens vägnar och
    de fysiska personer på vars vägnar eller till vars förmån en transaktion eller
    åtgärd utförs: a) För fysiska personer: i) Samtliga namn och efternamn. ii) Födelseort
    och fullständigt födelsedatum. iii) Medborgarskap, eller i tillämpliga fall statslöshet
    och status som flykting eller som subsidiärt skyddsbehövande, samt i tillämpliga
    fall nationellt identifikationsnummer. iv) Stadigvarande bostadsort eller, om
    det inte finns någon fast bostadsadress med laglig bosättning i unionen, den adress
    på vilken den fysiska personen kan nås och, om tillgängligt, skatteregistreringsnummer.
    b) För juridiska enheter: i) Juridisk form och namn. ii) Adress till stadgeenligt
    eller officiellt säte samt, om dessa skiljer sig från den adressen, huvudsakligt
    verksamhetsställe och land där den juridiska enheten skapades. iii) Namn på de
    rättsliga företrädarna för den juridiska enheten samt, i mån av tillgänglighet,
    registreringsnummer, skatteregistreringsnummer och identifieringskod för juridiska
    personer. iv) Namnen på de personer som innehar aktier eller en styrelsepost i
    form av nominella företrädare, inbegripet uppgift om deras ställning som nominella
    aktieägare eller styrelseledamöter. c) För förvaltare av en uttrycklig trust eller
    personer som innehar en likvärdig ställning i en liknande juridisk konstruktion:
    i) Grundläggande information om den juridiska konstruktionen; när det gäller de
    tillgångar som innehas i den juridiska konstruktionen eller förvaltas genom den
    ska dock endast de tillgångar som ska förvaltas inom ramen för affärsförbindelsen
    eller den enstaka transaktionen identifieras. ii) Bosättningsadress för de förvaltare
    alternativt de personer som innehar en likvärdig ställning i en liknande juridisk
    konstruktion och den ort från vilken den uttryckliga trusten eller motsvarande
    juridiska konstruktion förvaltas, om denna är en annan, samt de befogenheter som
    reglerar och är bindande för den juridiska konstruktionen samt, i mån av tillgänglighet,
    skatteregistreringsnummer och identifieringskod för juridiska personer. d) För
    andra organisationer som har rättskapacitet enligt nationell rätt: i) Namn samt
    adress till säte eller motsvarande. ii) Namn på de personer som har behörighet
    att företräda organisationen samt, i tillämpliga fall, juridisk form, skatteregistreringsnummer,
    registreringsnummer, identifieringskod för juridiska personer och stiftelseurkund
    eller motsvarande. 2. I syfte att identifiera juridiska enheters eller juridiska
    konstruktioners verkliga huvudmän ska ansvariga enheter samla in de uppgifter
    som anges i artikel 62.1 andra stycket a. Om det, när alla möjliga medel för identifiering
    har utnyttjats, inte har identifierats några fysiska personer som verkliga huvudmän
    eller om det finns tvivel om att de personer som har identifierats är verkliga
    huvudmän, ska ansvariga enheter dokumentera att ingen verklig huvudman identifierades
    och identifiera samtliga fysiska personer som är ledande befattningshavare vid
    den juridiska enheten och kontrollera deras identitet. Om kunden på grund av utförandet
    av den identitetskontroll som avses i andra stycket kan få kännedom om att den
    ansvariga enheten hyser tvivel om den juridiska enhetens verkliga huvudmannaskap,
    ska den ansvariga enheten avstå från att kontrollera de ledande befattningshavarnas
    identitet och i stället dokumentera de åtgärder som vidtagits för att fastställa
    de verkliga huvudmännens och de ledande befattningshavarnas identitet. De ansvariga
    enheterna ska dokumentera de åtgärder som vidtagits och de svårigheter under identifieringsprocessen
    som föranlett tillämpningen av alternativet att identifiera en ledande befattningshavare.
    3. Kreditinstitut och finansiella institut ska för virtuella IBAN-nummer som de
    utfärdar inhämta information för att identifiera och kontrollera identiteten hos
    de fysiska eller juridiska personer som använder sådana virtuella IBAN-nummer
    och det tillhörande bank- eller betalkontot. Det kreditinstitut eller finansiella
    institut som förvaltar det bank- eller betalkonto till vilket ett virtuellt IBAN-nummer
    som utfärdats av ett annat kreditinstitut eller finansiellt institut omdirigerar
    betalningar ska säkerställa att det från det institut som utfärdar det virtuella
    IBAN-numret kan erhålla information som identifierar och kontrollerar identiteten
    på den fysiska person som använder det virtuella IBAN-numret utan dröjsmål och
    under alla omständigheter inom fem arbetsdagar från att den har begärt den informationen.
    4. När det gäller trusters eller liknande juridiska enheters eller konstruktioners
    förmånstagare som utpekas genom särskilda kännetecken eller klass ska en ansvarig
    enhet inhämta tillräcklig information om förmånstagaren så att den kan fastställa
    dennes identitet vid utbetalningstillfället eller när förmånstagaren hävdar sina
    förvärvade rättigheter. 5. När det gäller diskretionära truster ska en ansvarig
    enhet inhämta tillräcklig information om föremålen för en befogenhet och förmånstagare
    vid uteblivet utövande av befogenheter för att den ska kunna fastställa förmånstagarens
    identitet vid den tidpunkt då förvaltarna utövar sina diskretionära befogenheter
    eller vid den tidpunkt då förmånstagarna vid uteblivet utövande av befogenheter
    blir förmånstagare på grund av att förvaltarna inte har utövat sina diskretionära
    befogenheter. 6. Ansvariga enheter ska inhämta den information, de handlingar
    och de uppgifter som krävs för att kontrollera kundens identitet och identiteten
    för alla personer som påstår sig handla på deras vägnar genom en av följande metoder:
    a) Inlämning av en identitetshandling, pass eller motsvarande och i relevanta
    fall inhämtande av information från tillförlitliga och oberoende källor, oavsett
    om det sker genom direktåtkomst eller genom kundens tillhandahållande. b) Användning
    av medel för elektronisk identifiering som uppfyller kraven i förordning (EU)
    nr 910/2014 vad gäller tillitsnivåerna väsentlig eller hög och relevanta kvalificerade
    betrodda tjänster enligt den förordningen. 7. Ansvariga enheter ska kontrollera
    identiteten på den verkliga huvudmannen och, i förekommande fall, de personer
    på vars vägnar eller till vars förmån en transaktion eller verksamhet utförs på
    något av följande sätt: a) I enlighet med punkt 6. b) Genom att vidta rimliga
    åtgärder för att erhålla nödvändiga uppgifter, handlingar och uppgifter från kunden
    eller andra tillförlitliga källor, inbegripet andra offentliga register än de
    centrala registren Ansvariga enheter ska avgöra omfattningen av den information
    som ska konsulteras med beaktande av de risker som är förknippade med den enskilda
    transaktionen eller affärsförbindelsen och den verkliga huvudmannen, inbegripet
    risker med avseende på ägarstrukturen. Utöver de kontrollmetoder som föreskrivs
    i första stycket i denna punkt ska ansvariga enheter kontrollera informationen
    om de verkliga huvudmännen genom att konsultera de centrala registren. Artikel
    23'
