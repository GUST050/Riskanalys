  text: Ägarstrukturer som omfattar juridiska konstruktioner eller liknande juridiska
    enheter Om juridiska enheter enligt artikel 57 eller juridiska konstruktioner,
    antingen enskilt eller sammanlagt, innehar ett ägarintresse i företaget eller
    direkt eller indirekt kontrollerar företaget genom ägarintresse eller på annat
