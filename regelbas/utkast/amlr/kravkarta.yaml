  text: Identifiering av verkliga huvudmän för juridiska enheter De verkliga huvudmännen
    för juridiska enheter ska vara de fysiska personer som a) direkt eller indirekt
    har ett ägarintresse i ett företag, eller b) direkt eller indirekt kontrollerar
    ett företag eller en annan juridisk enhet genom ägarintresse eller på annat sätt.
    Kontroll på annat sätt enligt första stycket b ska fastställas oberoende av och
    parallellt med förekomsten av ett ägarintresse eller kontroll genom ägarintresse.
    Artikel 52
  delkrav: []
