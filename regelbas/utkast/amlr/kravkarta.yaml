  text: 'Riktlinjer för utnyttjande av andra ansvariga enheters åtgärder för kundkännedom
    Senast den 10 juli 2027 ska Amla utfärda riktlinjer till ansvariga enheter om
    följande: a) De villkor som är godtagbara för att ansvariga enheter ska kunna
    utnyttja information som samlats in av en annan ansvarig enhet, inbegripet vid
    kundkännedom på distans. b) De involverade ansvariga enheternas roller och ansvar
    i en situation där de utnyttjar en annan ansvarig enhet. c) Tillsynsmetoder för
    utnyttjande av andra ansvariga enheter. KAPITEL IV TRANSPARENS I FRÅGA OM VERKLIGT
    HUVUDMANNASKAP Artikel 51'
