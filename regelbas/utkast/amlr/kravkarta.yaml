  text: Tillfälliga åtgärder för kunder som är föremål för FN:s ekonomiska sanktioner
    1. När det gäller kunder som är föremål för FN:s ekonomiska sanktioner eller som
    kontrolleras av fysiska eller juridiska personer eller enheter som är föremål
    för FN:s ekonomiska sanktioner eller i vilka fysiska eller juridiska personer
    eller enheter som är föremål för FN:s ekonomiska sanktioner har mer än 50 % av
    en enhets äganderätt eller majoritetsinnehav i denna, antingen enskilt eller kollektivt,
    ska ansvariga enheter dokumentera a) de medel eller andra tillgångar som de förvaltar
    för kundens räkning vid den tidpunkt då FN:s ekonomiska sanktioner offentliggörs,
    b) de transaktioner som kunden har försökt utföra, och c) de transaktioner som
    utförts för kunden. 2. Ansvariga enheter ska tillämpa denna artikel mellan den
    tidpunkt då FN:s ekonomiska sanktioner offentliggörs och den tidpunkt då de relevanta
    riktade ekonomiska sanktionerna börjar tillämpas i unionen. Artikel 28
  delkrav: []
