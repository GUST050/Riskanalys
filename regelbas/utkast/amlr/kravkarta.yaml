  text: Förteckning över viktiga offentliga funktioner 1. Varje medlemsstat ska utfärda
    och uppdatera en förteckning som anger exakt vilka funktioner som i enlighet med
    sina nationella lagar och andra författningar betecknas som viktiga offentliga
    funktioner vid tillämpningen av artikel 2.1.34. Medlemsstaterna ska kräva att
    varje internationell organisation som är godkänd inom deras territorium utfärdar
    och uppdaterar en förteckning över viktiga offentliga funktioner vid tillämpningen
    av artikel 2.1.34. Dessa förteckningar ska även innehålla alla funktioner som
    kan komma att anförtros åt företrädare för tredjeländer och internationella organ
    som har godkänts på medlemsstatsnivå. Medlemsstaterna ska anmäla dessa förteckningar
    och eventuella ändringar av dem till kommissionen och Amla. 2. Kommissionen får
    genom en genomförandeakt fastställa formatet för upprättandet och överlämnandet
    av medlemsstaternas förteckningar över viktiga offentliga funktioner enligt punkt
    1. Den genomförandeakten ska antas i enlighet med det granskningsförfarande som
    avses i artikel 86.2. 3. Kommissionen ges befogenhet att anta delegerade akter
    i enlighet med artikel 85 för att komplettera artikel 2.1.34 om ytterligare gemensamma
    kategorier av viktiga offentliga funktioner anges i de förteckningar som medlemsstaterna
    anmält enligt punkt 1 och dessa kategorier av viktiga offentliga funktioner är
    relevanta för unionen som helhet. När kommissionen utarbetar delegerade akter
    enligt första stycket ska den samråda med Amla. 4. Kommissionen ska upprätta och
    uppdatera en förteckning över exakt vilka funktioner som betecknas som viktiga
    offentliga funktioner på unionsnivå. Denna förteckning ska även innehålla alla
    funktioner som kan komma att anförtros åt företrädare för tredjeländer och för
    internationella organ som har godkänts på unionsnivå. 5. Kommissionen ska på grundval
    av de förteckningar som föreskrivs i punkterna 1 och 4 i denna artikel sammanställa
    en enda förteckning över alla viktiga offentliga funktioner för tillämpningen
    av artikel 2.1.34. Kommissionen ska offentliggöra denna enda förteckning i Europeiska
    unionens officiella tidning . Amla ska göra den förteckningen allmänt tillgänglig
    på sin webbplats. Artikel 44
  delkrav: []
