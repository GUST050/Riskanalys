  text: 'Ansvariga enheter Vid tillämpning av denna förordning ska följande enheter
    anses vara ansvariga enheter: 1. Kreditinstitut. 2. Finansiella institut. 3. Följande
    fysiska eller juridiska personer vid utövandet av deras yrkesmässiga verksamhet:
    a) Revisorer, externa revisorer och skatterådgivare samt varje annan fysisk eller
    juridisk person, inbegripet oberoende jurister såsom advokater, som åtar sig att
    tillhandahålla – antingen direkt eller genom någon som personen i fråga är kopplad
    till – materiellt bistånd, stöd eller rådgivning i skattefrågor som huvudsaklig
    affärs- eller yrkesverksamhet. b) Notarier, advokater och andra oberoende jurister,
    där de på en klients vägnar och för dennes räkning deltar i finansiella transaktioner
    eller transaktioner avseende fast egendom eller bistår vid planering eller utförande
    av transaktioner för dennes räkning i samband med något av följande: i) Köp och
    försäljning av fastigheter eller företag. ii) Förvaltning av klientens pengar,
    värdepapper eller andra tillgångar, inbegripet kryptotillgångar. iii) Öppnande
    eller förvaltning av bank-, spar- eller värdepapperskonton eller konton för kryptotillgångar.
    iv) Säkerställande av kapital för att bilda, driva eller leda företag. v) Skapande,
    upprättande, drift eller ledning av truster, bolag, stiftelser eller liknande
    strukturer. c) Tjänsteleverantörer till truster eller bolag. d) Fastighetsmäklare
    och andra yrkesverksamma i fastighetsbranschen när de agerar som mellanhänder
    vid fastighetstransaktioner, inbegripet vid uthyrning av fast egendom i fråga
    om transaktioner för vilka månadshyran uppgår till minst 10 000 EUR, eller motsvarande
    belopp i nationell valuta, oavsett betalningsmedel. e) Personer som handlar med
    ädla metaller och ädelstenar, som en regelbunden eller en huvudsaklig yrkesverksamhet.
    f) Personer som handlar med varor av högt värde som en regelbunden eller en huvudsaklig
    yrkesverksamhet. g) Tillhandahållare av speltjänster. h) Leverantörer av gräsrotsfinansieringstjänster
    och förmedlare av gräsrotsfinansiering. i) Personer som handlar med eller agerar
    som mellanhänder vid handel med kulturföremål, även när detta utförs av konstgallerier
    och auktionshus, där värdet av transaktionen eller de förbundna transaktionerna
    uppgår till 10 000 EUR eller mer, eller motsvarande belopp i nationell valuta.
    j) Personer som förvarar, handlar med eller agerar som mellanhänder vid handel
    med kulturföremål och varor av högt värde när detta utförs i frizoner och tullager,
    där värdet av transaktionen eller de förbundna transaktionerna uppgår till 10
    000 EUR eller mer, eller motsvarande belopp i nationell valuta. k) kreditförmedlare
    som erbjuder hypotekslån och konsumentkrediter och som inte är kreditinstitut
    och finansiella institut, med undantag för kreditförmedlare som bedriver verksamhet
    under ansvar av en eller flera kreditgivare eller kreditförmedlare. l) Aktörer
    inom investeringsmigration som har tillstånd att företräda tredjelandsmedborgare
    eller tillhandahålla förmedlingstjänster till tredjelandsmedborgare som vill få
    uppehållstillstånd i en medlemsstat i utbyte mot någon form av investering, inbegripet
    kapitalöverföringar, köp eller hyra av egendom, investeringar i statsobligationer,
    investeringar i företagsenheter, donation eller tilldelning av en verksamhet som
    bidrar till det allmänna bästa och bidrag till statsbudgeten. m) Icke-finansiella
    holdingföretag med blandad verksamhet. n) Fotbollsagenter. o) Professionella fotbollsklubbar
    när det gäller följande transaktioner: i) Transaktioner med en investerare. ii)
    Transaktioner med en sponsor. iii) Transaktioner med fotbollsagenter eller andra
    mellanhänder. iv) Transaktioner för övergång av en fotbollsspelare. Artikel 4'
  delkrav: []
