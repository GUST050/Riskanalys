  motsvarigheter: []
  text: 'Identifiering av verkliga huvudmän för juridiska enheter som liknar uttryckliga
    truster 1. När det gäller andra juridiska enheter än de som avses i artikel 51,
    som liknar uttryckliga truster, såsom stiftelser, ska de verkliga huvudmännen
    vara samtliga följande fysiska personer: a) Grundarna. b) Ledamöterna i ledningsorganet
    i dess ledningsfunktion. c) Ledamöterna i ledningsorganet i dess tillsynsfunktion.
    d) Förmånstagarna, såvida inte artikel 59 är tillämplig. e) Varje annan fysisk
    person som direkt eller indirekt kontrollerar den juridiska enheten. 2. Om de
    juridiska enheter som avses i punkt 1 tillhör kontrollstrukturer med flera nivåer
    och någon av de ställningar som förtecknas i punkt 1 innehas av en juridisk enhet,
    ska den verkliga huvudmannen för den juridiska enhet som avses i punkt 1 vara
    a) de fysiska personer som förtecknas i punkt 1, och b) de verkliga huvudmännen
    för de juridiska enheter som innehar någon av de ställningar som anges i punkt
    1. 3. Medlemsstaterna ska senast den 10 oktober 2027 till kommissionen anmäla
    en förteckning över typer av juridiska enheter vars verkliga huvudmän har identifierats
    i enlighet med punkt 1. Den anmälan som avses i första stycket ska åtföljas av
    en beskrivning av a) dessa juridiska enheters form och grundläggande funktioner,
    b) den process genom vilken de kan inrättas, c) processen för att få tillgång
    till grundläggande information och uppgifter om verkligt huvudmannaskap för dessa
    juridiska enheter, d) de webbplatser där de centrala register som innehåller information
    om de verkliga huvudmännen för dessa juridiska enheter kan konsulteras och kontaktuppgifterna
    till de enheter som ansvarar för dessa register. 4. Kommissionen får genom en
    genomförandeakt anta en förteckning över typer av juridiska enheter som regleras
    i medlemsstaternas rätt och som bör omfattas av de krav som föreskrivs i denna
    artikel. Denna genomförandeakt ska antas i enlighet med det granskningsförfarande
    som avses i artikel 86.2. Artikel 58'
  delkrav: []
- id: Artikel 58
  status: aterstaende
  motivering: Inventerad artikel. Juridisk relevans och delkrav återstår; svenska
    motsvarigheter får inte antas identiska.
  motsvarigheter: []
  text: 'Identifiering av verkliga huvudmän för uttryckliga truster och liknande juridiska
    konstruktioner 1. De verkliga huvudmännen för uttryckliga truster ska vara samtliga
    följande fysiska personer: a) Instiftarna. b) Förvaltarna. c) Beskyddarna, om
    sådana finns. d) Förmånstagarna, såvida inte artikel 59 eller 60 är tillämplig.
    e) Eventuella andra fysiska personer som utövar den yttersta kontrollen över den
    uttryckliga trusten genom direkt eller indirekt ägande eller genom andra medel,
    inbegripet genom en kedja av kontroll eller ägande. 2. De verkliga huvudmännen
    för andra juridiska konstruktioner som liknar uttryckliga truster ska vara de
    fysiska personer som innehar likvärdiga eller liknande ställningar som de som
    avses i punkt 1. 3. Om de juridiska konstruktionerna tillhör kontrollstrukturer
    med flera nivåer och om någon av de ställningar som förtecknas i punkt 1 innehas
    av en juridisk enhet, ska de juridiska konstruktionernas verkliga huvudman vara
    a) de fysiska personer som förtecknas i punkt 1, och b) den verkliga huvudmannen
    för de juridiska enheter som innehar någon av de ställningar som anges i punkt
    1. 4. Medlemsstaterna ska senast den 10 oktober 2027 till kommissionen anmäla
    en förteckning över de typer av juridiska konstruktioner som liknar uttryckliga
    truster som regleras enligt nationell rätt. Den anmälan ska åtföljas av en beskrivning
    av a) dessa juridiska konstruktioners form och grundläggande funktioner, b) den
    process genom vilken dessa juridiska konstruktioner kan inrättas, c) processen
    för att få tillgång till grundläggande information och uppgifter om verkligt huvudmannaskap
    för dessa juridiska enheter, d) de webbplatser där de centrala register som innehåller
    information om de verkliga huvudmännen för dessa juridiska konstruktioner kan
    konsulteras och kontaktuppgifterna till de enheter som ansvarar för dessa register.
    Anmälan ska även åtföljas av en motivering som anger skälen till att medlemsstaten
    anser att de anmälda juridiska konstruktionerna liknar uttryckliga truster och
    till att den dragit slutsatsen att andra juridiska konstruktioner som regleras
    enligt dess rätt inte liknar uttryckliga truster. 5. Kommissionen får genom en
    genomförandeakt anta en förteckning över typer av juridiska konstruktioner som
    regleras i medlemsstaternas rätt och som bör omfattas av samma krav på transparens
    i fråga om verkligt huvudmannaskap som uttryckliga truster; denna förteckning
    ska åtföljas av den information som avses i punkt 4 andra stycket i denna artikel.
    Denna genomförandeakt ska antas i enlighet med det granskningsförfarande som avses
    i artikel 86.2. Artikel 59'
  delkrav: []
