  motsvarigheter: []
  text: Sanktioner 1. Medlemsstaterna ska fastställa regler om vilka sanktioner som
    ska gälla vid överträdelser av bestämmelserna i detta kapitel och vidta alla nödvändiga
    åtgärder för att säkerställa att de genomförs. Sanktionerna ska vara effektiva,
    proportionella och avskräckande. Medlemsstaterna ska till kommissionen anmäla
    dessa regler om sanktioner senast den 10 januari 2025 tillsammans med deras rättsliga
    grund och utan dröjsmål anmäla eventuella senare ändringar som påverkar dem. 2.
    Senast den 10 juli 2026 ska kommissionen anta delegerade akter i enlighet med
    artikel 85 för att komplettera denna förordning genom att fastställa a) de kategorier
    av överträdelser som är föremål för sanktioner och de personer som är ansvariga
    för sådana överträdelser, b) indikatorer för att klassificera allvarlighetsgraden
    för överträdelser som är föremål för sanktioner, c) de kriterier som ska beaktas
    när sanktionsnivån fastställs. Kommissionen ska regelbundet se över den delegerade
    akt som avses i första stycket för att säkerställa att den identifierar de relevanta
    kategorierna av överträdelser och att de dithörande sanktionerna är effektiva,
    avskräckande och proportionella. KAPITEL V RAPPORTERINGSSKYLDIGHETER Artikel 69
  delkrav: []
- id: Artikel 69
  status: aterstaende
  motivering: Inventerad artikel. Juridisk relevans och delkrav återstår; svenska
