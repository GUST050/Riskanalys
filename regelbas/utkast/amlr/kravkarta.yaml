  motsvarigheter: []
  text: 'Uppgifter om verkligt huvudmannaskap 1. Juridiska enheter och förvaltare
    av uttryckliga truster eller personer som innehar likvärdiga ställningar i liknande
    juridiska konstruktioner ska säkerställa att uppgifterna om verkligt huvudmannaskap
    som de innehar, lämnar till ansvariga enheter i samband med förfaranden för kundkännedom
    i enlighet med kapitel III eller lämnar till de centrala registren är adekvata,
    korrekta och aktuella. De uppgifter om verkligt huvudmannaskap som avses i första
    stycket ska omfatta följande: a) Den verkliga huvudmannens samtliga för- och efternamn,
    födelseort, fullständiga födelsedatum, bostadsadress, hemvistland och medborgarskap,
    nummer på identitetshandlingen, t.ex. ett pass eller en nationell identitetshandling
    och, om det finns, det unika personliga identifieringsnummer som tilldelats personen
    i det land där personen är stadigvarande bosatt samt en allmän beskrivning av
    källan till detta nummer. b) Arten och omfattningen av det förmånsintresse som
    innehas i den juridiska enheten eller juridiska konstruktionen, antingen genom
    ägarintresse eller kontroll på annat sätt, samt den dag från vilken förmånsintresset
    innehas. c) Uppgifter om den juridiska enhet som den fysiska personen är den verkliga
    huvudmannen för i enlighet med artikel 22.1 b eller, när det gäller juridiska
    konstruktioner där den fysiska personen är den verkliga huvudmannen, grundläggande
    information om den juridiska konstruktionen. d) Om ägar- och kontrollstrukturen
    innehåller mer än en juridisk enhet eller juridisk konstruktion, en beskrivning
    av denna struktur, inbegripet namnen på och, om det finns, identifieringsnumret
    för de enskilda juridiska enheter eller juridiska konstruktioner som ingår i den
    strukturen och en beskrivning av förhållandet mellan dem, inbegripet andelen av
    det intresse som innehas. e) Om en kategori av förmånstagare identifieras enligt
    artikel 59, en allmän beskrivning av egenskaperna för kategorin av förmånstagare.
    f) Om föremål för en befogenhet och förmånstagare vid uteblivet utövande av befogenheter
    identifieras i enlighet med artikel 60: i) för fysiska personer, deras för- och
    efternamn, ii) för juridiska enheter och juridiska konstruktioner, deras namn,
    iii) för en kategori av föremål för en befogenhet eller förmånstagare vid uteblivet
    utövande av befogenheter, en beskrivning av den. 2. Juridiska enheter och förvaltare
    av uttryckliga truster eller personer som innehar en likvärdig ställning i en
    liknande juridisk konstruktion ska erhålla adekvata, korrekta och aktuella uppgifter
    om verkligt huvudmannaskap inom 28 kalenderdagar från skapandet av den juridiska
    enheten eller upprättandet av den juridiska konstruktionen. De uppgifterna ska
    uppdateras omgående och under alla omständigheter inom 28 kalenderdagar efter
    varje ändring av den, liksom på årsbasis. Artikel 63'
  delkrav: []
- id: Artikel 63
  status: aterstaende
  motivering: Inventerad artikel. Juridisk relevans och delkrav återstår; svenska
