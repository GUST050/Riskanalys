  motsvarigheter: []
  text: 'Informationsutbyte inom ramen för partnerskap för informationsutbyte 1. Medlemmar
    i partnerskap för informationsutbyte får utbyta information med varandra när det
    är absolut nödvändigt för att fullgöra skyldigheterna enligt kapitel III och artikel
    69 och i enlighet med grundläggande rättigheter och rättssäkerhetsgarantier. 2.
    Ansvariga enheter som avser att delta i ett partnerskap för informationsutbyte
    ska underrätta sina respektive tillsynsmyndigheter som, i förekommande fall i
    samråd med varandra och med de myndigheter som ansvarar för att kontrollera efterlevnaden
    av förordning (EU) 2016/679, ska kontrollera att partnerskapet för informationsutbyte
    har inrättat mekanismer för att säkerställa efterlevnad av denna artikel och att
    den konsekvensbedömning avseende dataskydd som avses i punkt 4 h har genomförts.
    Kontrollen ska äga rum innan verksamheten inom partnerskapet för informationsutbyte
    inleds. I förekommande fall ska tillsynsmyndigheterna också samråda med finansunderrättelseenheterna.
    Ansvaret för att kraven i unionsrätten eller nationell rätt efterlevs ska förbli
    hos deltagarna i partnerskapet för informationsutbyte. 3. Information som utbyts
    inom ramen för ett partnerskap för informationsutbyte ska begränsas till följande:
    a) Uppgifter om kunden, inbegripet alla uppgifter som erhållits i samband med
    identifiering och kontroll av kundens identitet och, i förekommande fall, kundens
    verkliga huvudman. b) Information om affärsförbindelsens eller den enstaka transaktionens
    syfte och avsedda natur mellan kunden och den ansvariga enheten samt, i tillämpliga
    fall, källan till kundens förmögenhet och källan till kundens medel. c) Information
    om kundtransaktioner. d) Information om högre och lägre riskfaktorer som är förknippade
    med kunden. e) Den ansvariga enhetens analys av de risker som är förknippade med
    kunden enligt artikel 20.2. f) Information som innehas av den ansvariga enheten
    enligt artikel 77.1. g) Information om misstankar enligt artikel 69. Den information
    som avses i första stycket ska endast utbytas i den utsträckning det är nödvändigt
    för genomförandet av verksamheten inom partnerskapet för informationsutbyte. 4.
    Följande villkor ska tillämpas på informationsutbyte inom ramen för ett partnerskap
    för informationsutbyte: a) De ansvariga enheterna ska dokumentera alla fall av
    informationsutbyte inom partnerskapet. b) De ansvariga enheterna ska inte enbart
    förlita sig på den information som mottagits inom ramen för partnerskapet för
    att uppfylla kraven i denna förordning. c) De ansvariga enheterna får inte dra
    slutsatser eller fatta beslut som påverkar affärsförbindelsen med kunden eller
    utförandet av enstaka transaktioner för kundens räkning på grundval av information
    som mottagits från andra deltagare i partnerskapet för informationsutbyte utan
    att ha bedömt denna information; all information som mottagits inom ramen för
    partnerskapet och som används vid en bedömning som leder till ett beslut om att
    vägra eller avsluta en affärsförbindelse eller att genomföra en enstaka transaktion
    ska ingå i dokumentationen enligt artikel 21.3, och denna dokumentation ska innehålla
    en hänvisning till att informationen härrör från ett partnerskap för informationsutbyte.
    d) De ansvariga enheterna ska göra en egen bedömning av transaktioner som involverar
    kunder för att bedöma vilka transaktioner som kan ha samband med penningtvätt
    eller finansiering av terrorism eller omfatta vinning av brottslig verksamhet.
    e) De ansvariga enheterna ska genomföra lämpliga tekniska och organisatoriska
    åtgärder, inbegripet åtgärder för att möjliggöra pseudonymisering, i syfte att
    säkerställa en säkerhets- och sekretessnivå som står i proportion till arten och
    omfattningen av den information som utbyts. f) Utbyte av information ska endast
    ske i förhållande till kunder i) vars beteende eller transaktionsverksamhet förknippas
    med en högre risk för penningtvätt, förbrott till penningtvätt eller finansiering
    av terrorism, enligt riskbedömningar på unionsnivå och nationella riskbedömningar
    som gjorts i enlighet med artiklarna 7 och 8 i direktiv (EU) 2024/1640, ii) som
    befinner sig i någon av de situationer som avses i artiklarna 29, 30, 31 och 36–46
    i denna förordning, eller iii) för vilka de ansvariga enheterna behöver samla
    in ytterligare information för att avgöra om de är förknippade med en högre risknivå
    för penningtvätt, förbrott till penningtvätt eller finansiering av terrorism.
    g) Information som genereras genom användning av artificiell intelligens, maskininlärningsteknik
    eller algoritmer får endast delas om dessa processer varit föremål för tillräcklig
    mänsklig tillsyn. h) En konsekvensbedömning avseende dataskydd som avses i artikel
    35 i förordning (EU) 2016/679 ska genomföras före behandlingen av personuppgifter.
    i) De behöriga myndigheter som är medlemmar i ett partnerskap för informationsutbyte
    ska endast erhålla, tillhandahålla och utbyta information i den utsträckning som
    krävs för att de ska kunna utföra sina uppgifter enligt relevant unionsrätt eller
    nationell rätt. j) Om de behöriga myndigheter som avses i artikel 2.1.44 c i denna
    förordning deltar i ett partnerskap för informationsutbyte ska de endast erhålla,
    tillhandahålla eller utbyta personuppgifter och operativ information i enlighet
    med nationell rätt som införlivar Europaparlamentets och rådets direktiv (EU)
    2016/680 ( 44 ) och med tillämpliga nationella straffprocessrättsliga bestämmelser,
    inbegripet förhandstillstånd från rättsliga myndigheter eller andra nationella
    rättssäkerhetsgarantier i enlighet med vad som krävs. k) Utbyte av information
    om misstänkta transaktioner enligt punkt 3 g i denna artikel får endast äga rum
    om den finansunderrättelseenhet till vilken rapporten om misstänkta transaktioner
    överlämnades enligt artikel 69 eller 70 har samtyckt till ett sådant utlämnande.
    5. Information som tagits emot inom ramen för ett partnerskap för informationsutbyte
    ska inte vidarebefordras ytterligare om a) informationen lämnas till en annan
    ansvarig enhet enligt artikel 49.1, b) uppgifterna ska ingå i en rapport som lämnas
    in till finansunderrättelseenheten eller lämnas som svar på en begäran från en
    finansunderrättelseenhet enligt artikel 69.1, c) informationen tillhandahålls
    Amla enligt artikel 93 i förordning (EU) 2024/1620, d) informationen begärs av
    brottsbekämpande eller rättsliga myndigheter, med förbehåll för eventuella förhandstillstånd
    eller andra förfarandegarantier som krävs enligt nationell rätt. 6. Ansvariga
    enheter som deltar i partnerskap för informationsutbyte ska fastställa riktlinjer
    och förfaranden för informationsutbyte i sina interna riktlinjer och förfaranden
    som fastställts enligt artikel 9. Dessa riktlinjer och förfaranden ska a) specificera
    den bedömning som ska göras för att fastställa omfattningen av den information
    som ska utbytas och, när det är relevant för informationens art eller tillämpliga
    rättsliga garantier, föreskriva differentierad eller begränsad tillgång till information
    för medlemmar i partnerskap, b) beskriva roller och ansvarsområden för parterna
    i partnerskapet för informationsutbyte, c) identifiera de riskbedömningar som
    den ansvariga enheten kommer att beakta för att fastställa situationer med högre
    risk där information kan delas. De interna riktlinjer och förfaranden som avses
    i första stycket ska utarbetas före deltagandet i ett partnerskap för informationsutbyte.
    7. Om tillsynsmyndigheterna anser det nödvändigt ska ansvariga enheter som deltar
    i ett partnerskap för informationsutbyte beställa en oberoende revision av hur
    partnerskapet fungerar och delge tillsynsmyndigheterna resultaten. KAPITEL VII
    DATASKYDD OCH LAGRING AV UPPGIFTER Artikel 76'
