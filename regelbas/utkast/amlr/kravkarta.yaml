  text: Tidpunkt för kontroll av kundens och den verkliga huvudmannens identitet 1.
    Kontroll av kundens identitet, den verkliga huvudmannens identitet och identiteten
    för alla personer enligt artikel 20.1 h och i ska ske innan en affärsförbindelse
    ingås eller en enstaka transaktion utförs. Denna skyldighet ska inte gälla situationer
    med lägre risk som omfattas av avsnitt 3 i detta kapitel, förutsatt att den lägre
    risken motiverar ett senareläggande av sådan kontroll. För fastighetsmäklare ska
    den kontroll som avses i första stycket utföras efter den tidpunkt då ett anbud
    godtas av säljaren eller uthyraren och under alla omständigheter innan medel eller
    egendom överförs. 2. Genom undantag från punkt 1 får kontroll av kundens och den
    verkliga huvudmannens identitet slutföras när affärsförbindelsen ingås, om detta
    är nödvändigt för att inte störa den normala affärsverksamheten och om risken
    för penningtvätt eller finansiering av terrorism är låg. I sådana situationer
    ska dessa förfaranden slutföras snarast möjligt efter inledande kontakt. 3. Genom
    undantag från punkt 1 i den här artikeln får ett kreditinstitut eller finansiellt
    institut öppna ett konto, inbegripet konton som möjliggör transaktioner i överlåtbara
    värdepapper, i enlighet med en kunds behov, om det finns tillräckliga skyddsåtgärder
    för att säkerställa att transaktioner inte kan utföras av kunden eller på kundens
    vägnar innan de åtgärder för kundkännedom som fastställs i artikel 20.1 första
    stycket a och b har uppfyllts. 4. När en ny affärsförbindelse ingås med en sådan
    juridisk enhet, förvaltare av en uttrycklig trust eller person som innehar en
    likvärdig ställning i en liknande juridisk konstruktion som avses i artiklarna
    51, 57, 58, 61 och 67 och som är föremål för registrering av uppgifter om verkligt
    huvudmannaskap enligt artikel 10 i direktiv (EU) 2024/1640, ska ansvariga enheter
    samla in giltiga bevis på registrering eller ett nyligen utfärdat utdrag från
    registret som bekräftar registreringens giltighet. Artikel 24
  delkrav: []
