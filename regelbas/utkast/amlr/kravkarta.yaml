  text: 'Identifiering av tredjeländer som utgör ett specifikt och allvarligt hot
    mot unionens finansiella system 1. Kommissionen ges befogenhet att anta delegerade
    akter i enlighet med artikel 85 för att komplettera denna förordning genom att
    identifiera tredjeländer om den i undantagsfall anser det vara oundgängligt att
    minska ett särskilt och allvarligt hot mot unionens finansiella system och en
    väl fungerande inre marknad som utgörs av dessa tredjeländer och som inte kan
    minskas enligt artiklarna 29 och 30. 2. Kommissionen ska vid utarbetandet av de
    delegerade akter som avses i punkt 1 särskilt beakta följande kriterier: a) Tredjelandets
    rättsliga och institutionella ramverk för bekämpning av penningtvätt och finansiering
    av terrorism, särskilt i) kriminalisering av penningtvätt och finansiering av
    terrorism, ii) åtgärder som rör kundkännedom, iii) krav som rör dokumentation,
    iv) krav som rör rapportering av misstänkta transaktioner, v) tillgång för behöriga
    myndigheter till korrekt och aktuell information om det verkliga huvudmannaskapet
    för juridiska personer och konstruktioner. b) Tredjelandets behöriga myndigheters
    befogenheter och förfaranden för bekämpning av penningtvätt och finansiering av
    terrorism, inbegripet lämpliga effektiva, proportionella och avskräckande sanktioner,
    samt tredjelandets metoder för samarbete och informationsutbyte med medlemsstaternas
    behöriga myndigheter. c) Effektiviteten hos tredjelandets system för bekämpning
    av penningtvätt och finansiering av terrorism när det gäller hantering av riskerna
    för penningtvätt och finansiering av terrorism. 3. För att fastställa den hotnivå
    som avses i punkt 1 får kommissionen begära att Amla antar ett yttrande i syfte
    att bedöma den specifika inverkan på integriteten hos unionens finansiella system
    på grund av den hotnivå som ett tredjeland utgör. 4. Om Amla konstaterar att ett
    annat tredjeland än de som identifierats enligt artiklarna 29 och 30 utgör ett
    specifikt och allvarligt hot mot unionens finansiella system får den avge ett
    yttrande till kommissionen där den anger det hot som den har identifierat och
    skälen till att den anser att kommissionen bör identifiera tredjelandet enligt
    punkt 1. Om kommissionen beslutar att inte identifiera det tredjeland som avses
    i första stycket, ska den lämna en motivering till Amla. 5. Kommissionen ska vid
    upprättandet av de delegerade akter som avses i punkt 1 särskilt ta hänsyn till
    relevanta utvärderingar, bedömningar eller rapporter från internationella organisationer
    och normgivare med befogenheter på området för bekämpning av penningtvätt och
    finansiering av terrorism. 6. Om det identifierade särskilda och allvarliga hotet
    från det berörda tredjelandet utgör en betydande strategisk brist ska artikel
    29.4 tillämpas och den delegerade akt som avses i punkt 1 i den här artikeln ska
    fastställa de särskilda motåtgärder som avses i artikel 29.5. 7. Om det identifierade
    särskilda och allvarliga hotet från det berörda tredjelandet utgör en bristande
    överensstämmelse ska den delegerade akt som avses i punkt 1 fastställa de särskilda
    skärpta åtgärder för kundkännedom bland de som anges i artikel 34.4 som ansvariga
    enheter ska tillämpa för att minska riskerna i samband med affärsförbindelser
    eller enstaka transaktioner som involverar fysiska eller juridiska personer från
    det tredjelandet. 8. Kommissionen ska regelbundet se över de delegerade akter
    som avses i punkt 1 för att säkerställa att de motåtgärder som avses i punkt 6
    och de skärpta åtgärder för kundkännedom som avses i punkt 7 tar hänsyn till förändringar
    i tredjelandets ramverk för bekämpning av penningtvätt och finansiering av terrorism,
    och att de är proportionella och lämpliga i förhållande till riskerna. 9. Kommissionen
    får genom en genomförandeakt anta metoden för identifiering av tredjeländer enligt
    denna artikel. I den genomförandeakten ska särskilt följande fastställas: a) Hur
    kriterierna i punkt 2 bedöms. b) Förfarandet för interaktion med det tredjeland
    som är föremål för bedömning. c) Förfarandet för medlemsstaternas och Amlas deltagande
    i identifieringen av tredjeländer som utgör ett specifikt och allvarligt hot mot
    unionens finansiella system. Den genomförandeakt som avses i första stycket i
    denna punkt ska antas i enlighet med det granskningsförfarande som avses i artikel
    86.2. Artikel 32'
