  text: Förbud mot korrespondentförbindelser med brevlådeinstitut 1. Kreditinstitut
    och finansiella institut får inte ingå eller upprätthålla korrespondentförbindelser
    med brevlådeinstitut. Kreditinstitut och finansiella institut ska vidta lämpliga
    åtgärder för att säkerställa att de inte ingår eller upprätthåller korrespondentförbindelser
    med ett kreditinstitut eller finansiellt institut som är känt för att tillåta
    att dess konton används av brevlådeinstitut. 2. Utöver kravet i punkt 1 ska leverantörer
    av kryptotillgångstjänster säkerställa att deras konton inte används av brevlådeinstitut
    för tillhandahållande av kryptotillgångstjänster. I detta syfte ska leverantörer
    av kryptotillgångstjänster ha infört interna riktlinjer, förfaranden och kontroller
    för att upptäcka alla försök att använda deras konton för tillhandahållande av
    oreglerade kryptotillgångstjänster. Artikel 40
  delkrav: []
