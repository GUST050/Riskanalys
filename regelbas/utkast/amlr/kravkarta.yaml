  text: Särskilda skärpta åtgärder för kundkännedom för gränsöverskridande korrespondentförbindelser
    När det gäller gränsöverskridande korrespondentförbindelser, inbegripet förbindelser
    som ingås för värdepapperstransaktioner och överföring av medel, som involverar
    utförande av betalningar med ett motpartsinstitut i ett tredjeland, ska kreditinstitut
    och finansiella institut, utöver de åtgärder för kundkännedom som fastställs i
    artikel 20, vid ingående av en affärsförbindelse vara skyldiga att a) samla in
    så mycket information om motpartsinstitutet att de har full insikt i dess affärsverksamhet
    och utifrån offentligt tillgänglig information kan bedöma dess anseende och övervakningens
    kvalitet, b) göra en bedömning av motpartsinstitutets kontroller för bekämpning
    av penningtvätt och finansiering av terrorism, c) inhämta godkännande från företagsledningen
    innan de ingår nya korrespondentförbindelser, d) dokumentera varje instituts respektive
    ansvarsområden, e) för payable-through -konton försäkra sig om att motpartsinstitutet
    har kontrollerat kundens identitet och löpande vidtagit åtgärder för kundkännedom
    med avseende på de kunder som har direkt tillgång till korrespondentinstitutets
    konton och att det på begäran kan tillhandahålla korrespondentinstitutet relevanta
    kundkännedomsuppgifter. Om kreditinstitut och finansiella institut beslutar att
    avsluta gränsöverskridande korrespondentförbindelser av skäl som rör strategin
    för bekämpning av penningtvätt och finansiering av terrorism, ska de dokumentera
    sitt beslut. Artikel 37
  delkrav: []
