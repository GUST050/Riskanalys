  text: 'Undantag för vissa finansiella verksamheter 1. Medlemsstaterna får, undantaget
    personer som bedriver penningöverföring enligt definitionen i artikel 4.22 i direktiv
    (EU) 2015/2366, besluta att undanta juridiska eller fysiska personer, som endast
    tillfälligt eller i mycket begränsad omfattning bedriver finansiell verksamhet
    som förtecknas i punkterna 2–12, 14 och 15 i bilaga I till direktiv 2013/36/EU,
    där risken för penningtvätt eller finansiering av terrorism är liten, från de
    krav som fastställs i denna förordning, förutsatt att samtliga följande kriterier
    är uppfyllda: a) Den finansiella verksamheten är begränsad i absoluta termer.
    b) Den finansiella verksamheten är begränsad när det gäller transaktioner. c)
    Den finansiella verksamheten är inte sådana personers huvudverksamhet. d) Den
    finansiella verksamheten är en biverksamhet och direkt knuten till sådana personers
    huvudverksamhet. e) Sådana personers huvudverksamhet är inte en sådan verksamhet
    som avses i artikel 3.3 a–d eller g i denna förordning. f) Den finansiella verksamheten
    avser endast sådana personers huvudverksamhets kunder och är inte allmänt tillgänglig
    för allmänheten. 2. Vid tillämpningen av punkt 1 a ska medlemsstaterna kräva att
    den finansiella verksamhetens totala omsättning inte överstiger ett tillräckligt
    lågt tröskelvärde. Detta tröskelvärde ska fastställas på nationell nivå och bero
    på typen av finansiell verksamhet. 3. Vid tillämpningen av punkt 1 b ska medlemsstaterna
    tillämpa ett högsta tröskelvärde per kund och transaktion, oavsett om transaktionen
    utförs vid ett enda tillfälle eller genom förbundna transaktioner. Detta tröskelvärde
    ska fastställas på nationell nivå och bero på typen av finansiell verksamhet.
    Det ska vara tillräckligt lågt för att säkerställa att de berörda transaktionstyperna
    är en opraktisk och ineffektiv metod för penningtvätt eller finansiering av terrorism
    och det får inte överstiga 1 000 EUR eller motsvarande belopp i nationell valuta,
    oavsett betalningsmedel. 4. Vid tillämpningen av punkt 1 c ska medlemsstaterna
    kräva att den finansiella verksamhetens omsättning inte överstiger 5 % av den
    berörda fysiska eller juridiska personens totala omsättning. 5. När medlemsstaterna
    vid tillämpningen av denna artikel bedömer risken för penningtvätt eller finansiering
    av terrorism ska de särskilt beakta finansiell verksamhet vars natur gör att det
    är särskilt sannolikhet att den ska användas eller missbrukas för penningtvätt
    eller för finansiering av terrorism. 6. Medlemsstaterna ska inrätta en riskbaserad
    övervakningsverksamhet eller vidta andra lämpliga åtgärder för att säkerställa
    att undantag som beviljas genom beslut enligt denna artikel inte missbrukas. Artikel
    7'
