  motsvarigheter: []
  text: Oförmåga att uppfylla kravet på att vidta åtgärder för kundkännedom 1. Om
    en ansvarig enhet inte kan uppfylla de krav på att vidta åtgärder för kundkännedom
    som fastställs i artikel 20.1 ska enheten avstå från att utföra en transaktion
    eller ingå en affärsförbindelse samt avbryta affärsförbindelsen och överväga att
    rapportera en misstänkt transaktion när det gäller denna kund till finansunderrättelseenheten
    i enlighet med artikel 69. Avbrytande av en affärsförbindelse enligt första stycket
    i denna punkt ska inte hindra mottagande av medel, enligt definitionen i artikel
    4.25 i direktiv (EU) 2015/2366, som tillkommer den ansvariga enheten. Om en ansvarig
    enhet är skyldig att skydda sina kunders tillgångar ska avbrytandet av affärsförbindelsen
    inte anses kräva att kunden avyttrar sina tillgångar. När det gäller livförsäkringsavtal
    ska ansvariga enheter, vid behov som ett alternativ till att avbryta affärsförbindelsen,
    avstå från att utföra transaktioner på kundens vägnar, inbegripet utbetalningar
    till förmånstagare, till dess att de åtgärder för kundkännedom som fastställs
    i artikel 20.1 efterlevs. 2. Punkt 1 ska inte tillämpas på notarier, advokater,
    andra oberoende jurister, revisorer, externa revisorer och skatterådgivare i den
    utsträckning dessa personer utreder sin klients rättsliga ställning eller då de
    försvarar eller företräder denne i eller rörande rättsliga förfaranden, inbegripet
    tillhandahållande av rådgivning beträffande inledande eller undvikande av sådana
    förfaranden. Det första stycket ska dock inte tillämpas när de ansvariga enheter
    som där avses a) deltar i penningtvätt, förbrott till penningtvätt eller finansiering
    av terrorism, b) tillhandahåller juridisk rådgivning för penningtvätt, förbrott
    till penningtvätt eller finansiering av terrorism, eller c) har vetskap om att
    klienten söker juridisk rådgivning för penningtvätt, förbrott till penningtvätt
    eller finansiering av terrorism; vetskap eller syfte får härledas ur objektiva,
    faktiska omständigheter. 3. Ansvariga enheter ska dokumentera de åtgärder som
    vidtas för att uppfylla kravet på åtgärder för kundkännedom, inbegripet registrering
    av de beslut som fattats och relevanta styrkande handlingar och motiveringar.
    Handlingar, uppgifter eller information som innehas av den ansvariga enheten ska
    uppdateras varje gång åtgärderna för kundkännedom ses över enligt artikel 26.
    Den skyldighet att dokumentera som föreskrivs i första stycket i denna punkt ska
    också tillämpas på situationer där ansvariga enheter vägrar att ingå en affärsförbindelse,
    avbryter en affärsförbindelse eller tillämpar alternativa åtgärder enligt punkt
    1. 4. Senast den 10 juli 2027 ska Amla med Europeiska bankmyndigheten utfärda
    gemensamma riktlinjer om de åtgärder som får vidtas av kreditinstitut och finansiella
    institut för att säkerställa efterlevnad av reglerna för bekämpning av penningtvätt
    och finansiering av terrorism vid genomförandet av kraven i direktiv 2014/92/EU,
    inbegripet när det gäller de affärsförbindelser som påverkas mest av de-risking
    -rutiner. Artikel 22
