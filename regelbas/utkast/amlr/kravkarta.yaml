  text: Rapportering av avvikelser från uppgifter i register över verkligt huvudmannaskap
    1. Ansvariga enheter ska till de centrala registren rapportera alla avvikelser
    som de upptäcker mellan de uppgifter som finns tillgängliga i de centrala registren
    och de uppgifter som de samlar in enligt artiklarna 20.1 b och 22.7. De avvikelser
    som avses i första stycket ska rapporteras utan onödigt dröjsmål och under alla
    omständigheter inom 14 kalenderdagar från deras upptäckt. När sådana avvikelser
    rapporteras, ska ansvariga enheter till sina rapporter bifoga uppgifter som de
    erhållit som visar avvikelsen och vilka de anser vara de verkliga huvudmännen
    och, i tillämpliga fall, de nominella aktieägarna och de nominella styrelseledamöterna
    och varför. 2. Genom undantag från punkt 1 får ansvariga enheter avstå från att
    rapportera avvikelser till det centrala registret och får i stället begära ytterligare
    information från kunderna om de konstaterade avvikelserna a) är begränsade till
    skrivfel, olika sätt att translitterera eller mindre felaktigheter som inte påverkar
    identifieringen av de verkliga huvudmännen eller deras ställning, eller b) är
    ett resultat av föråldrade uppgifter, medan den ansvariga enheten genom en annan
    tillförlitlig källa känner till de verkliga huvudmännen och skäl saknas för att
    misstänka att det finns en avsikt att dölja uppgifter. Om en ansvarig enhet drar
    slutsatsen att uppgifterna om verkligt huvudmannaskap i det centrala registret
    är felaktiga ska den uppmana kunderna att i enlighet med artiklarna 63, 64 och
    67 utan onödigt dröjsmål och under alla omständigheter inom 14 kalenderdagar lämna
    in korrekta uppgifter till det centrala registret. Denna punkt ska inte tillämpas
    på fall av högre risk för vilka åtgärder enligt avsnitt 4 i detta kapitel är tillämpliga.
    3. Om en kund inte har lämnat in korrekta uppgifter inom den tidsfrist som avses
    i punkt 2 andra stycket ska den ansvariga enheten rapportera avvikelsen till det
    centrala registret i enlighet med punkt 1 andra stycket. 4. Denna artikel ska
    inte tillämpas på notarier, advokater, andra oberoende jurister, revisorer, externa
    revisorer och skatterådgivare i fråga om sådan information som de har erhållit
    av en klient eller som avser en klient medan de utreder den klientens rättsliga
    ställning eller då de försvarar eller företräder denne i eller rörande ett rättsligt
    förfarande, inbegripet tillhandahållande av rådgivning beträffande inledande eller
    undvikande av ett sådant förfarande, oberoende av om denna information har erhållits
    före, under eller efter ett sådant förfarande. Kraven i denna artikel ska dock
    tillämpas när de ansvariga enheter som avses i första stycket i denna punkt tillhandahåller
    juridisk rådgivning i någon av de situationer som omfattas av artikel 21.2 andra
    stycket. Artikel 25
