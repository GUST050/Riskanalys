  text: Tillhandahållande av dokumentation till behöriga myndigheter De ansvariga
    enheterna ska införa system för att till fullo och snabbt kunna besvara förfrågningar
    från sin finansunderrättelseenhet eller andra behöriga myndigheter, i enlighet
    med nationell rätt, om huruvida de har eller under en femårsperiod som föregår
    den förfrågan har haft en affärsförbindelse med specificerade personer och om
    denna förbindelses natur, genom säkra kanaler och på ett sätt som säkerställer
    att förfrågningarna behandlas konfidentiellt. KAPITEL VIII ÅTGÄRDER FÖR ATT MINSKA
    DE RISKER SOM HÄRRÖR FRÅN ANONYMA INSTRUMENT Artikel 79
