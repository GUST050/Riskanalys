  text: 'Särskilda bestämmelser för sektorerna för livförsäkringar och andra investeringsrelaterade
    försäkringar För livförsäkringsverksamhet eller annan investeringsrelaterad försäkringsverksamhet
    ska ansvariga enheter, utöver de åtgärder för kundkännedom som krävs med avseende
    på kunden och den verkliga huvudmannen, tillämpa följande åtgärder för kundkännedom
    i fråga om livförsäkringars och andra investeringsrelaterade försäkringars förmånstagare,
    så snart som dessa har identifierats eller utpekats: a) När det gäller förmånstagare
    som identifieras som specifikt namngivna personer eller juridiska konstruktioner:
    dokumentation av personens eller konstruktionens namn. b) När det gäller förmånstagare
    som utpekas genom egenskaper eller klass eller på annat sätt: inhämtande av tillräcklig
    information om dessa förmånstagare så att förmånstagarens identitet kan avgöras
    vid utbetalningstillfället. Vid tillämpningen av första stycket ska kontrollen
    av förmånstagarnas identitet och, i förekommande fall, de verkliga huvudmännens
    identitet ske vid utbetalningstillfället. Vid hel eller delvis överlåtelse av
    livförsäkring eller annan investeringsrelaterad försäkring till tredje part ska
    ansvariga enheter med kännedom om överlåtelsen fastställa den verkliga huvudmannens
    identitet när försäkringens värde övergår till den fysiska eller juridiska personen
    eller konstruktionen. AVSNITT 6 Utnyttjande av andra ansvariga enheters åtgärder
    för kundkännedom Artikel 48'
