  motsvarigheter: []
  text: 'Åtgärder för kundkännedom 1. För att säkerställa kundkännedom ska ansvariga
    enheter vidta samtliga följande åtgärder: a) Identifiera kunden och kontrollera
    kundens identitet. b) Identifiera de verkliga huvudmännen och vidta rimliga åtgärder
    för att kontrollera deras identitet så att den ansvariga enheten anser sig ha
    full vetskap om vem den verkliga huvudmannen är och en förståelse av kundens ägar-
    och kontrollstruktur. c) Bedöma och i tillämpliga fall inhämta information om
    och en förståelse av affärsförbindelsens eller de enstaka transaktionernas syfte
    och avsedda natur. d) Kontrollera om kunden eller de verkliga huvudmännen är föremål
    för riktade ekonomiska sanktioner och, när det gäller en kund eller part i en
    juridisk konstruktion som är en juridisk enhet, huruvida fysiska eller juridiska
    personer som är föremål för riktade ekonomiska sanktioner kontrollerar den juridiska
    enheten eller har mer än 50 % av den juridiska enhetens äganderätt eller majoritetsandelar
    i den, enskilt eller kollektivt. e) Bedöma och i förekommande fall inhämta information
    om arten av kundernas verksamhet inbegripet, när det gäller företag, huruvida
    de bedriver verksamhet, eller om deras anställning eller yrke. f) Fortlöpande
    övervaka affärsförbindelsen, inbegripet granskning av transaktioner under affärsförbindelsens
    hela existens, för att säkerställa att de transaktioner som utförs motsvarar den
    ansvariga enhetens kännedom om kunden, verksamheten och riskprofilen, inbegripet
    vid behov medlens ursprung. g) Fastställa om kunden, kundens verkliga huvudman
    och, i förekommande fall, den person på vars vägnar eller till vars förmån en
    transaktion eller verksamhet utförs är en person i politiskt utsatt ställning,
    en familjemedlem eller en känd nära medarbetare. h) Om en transaktion eller verksamhet
    utförs på vägnar av eller till förmån för andra fysiska personer än kunden, identifiera
    dessa fysiska personer och kontrollera deras identitet. i) Kontrollera att en
    person som påstår sig handla på kundens vägnar verkligen är bemyndigad att göra
    det samt fastställa och kontrollera dennes identitet. 2. Ansvariga enheter ska
    fastställa omfattningen av de åtgärder som avses i punkt 1 på grundval av en enskild
    analys av riskerna för penningtvätt och finansiering av terrorism med beaktande
    av klientens och affärsförbindelsens eller den enstaka transaktionens särdrag,
    den ansvariga enhetens verksamhetsomfattande riskbedömning enligt artikel 10 samt
    de variabler avseende penningtvätt och finansiering av terrorism som anges i bilaga
    I och de riskfaktorer som anges i bilagorna II och III. Om ansvariga enheter konstaterar
    en förhöjd risk för penningtvätt eller finansiering av terrorism ska de tillämpa
    skärpta åtgärder för kundkännedom enligt avsnitt 4 i detta kapitel. I situationer
    där risken konstateras vara lägre får ansvariga enheter vidta förenklade åtgärder
    för kundkännedom enligt avsnitt 3 i detta kapitel. 3. Senast den 10 juli 2026
    ska Amla utfärda riktlinjer om de riskvariabler och riskfaktorer som ska beaktas
    av de ansvariga enheterna när dessa ingår affärsförbindelser eller utför enstaka
    transaktioner. 4. Ansvariga enheter ska alltid kunna visa för tillsynsorganen
    att de vidtagna åtgärderna är lämpliga med hänsyn till de identifierade riskerna
    för penningtvätt och finansiering av terrorism. Artikel 21'
