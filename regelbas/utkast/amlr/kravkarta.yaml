  text: Kommittéförfarande 1. Kommissionen ska biträdas av den kommitté för förebyggande
    av penningtvätt och finansiering av terrorism som inrättats genom artikel 34 i
    förordning (EU) 2023/1113. Denna kommitté ska vara en kommitté i den mening som
    avses i förordning (EU) nr 182/2011. 2. När det hänvisas till denna punkt ska
    artikel 5 i förordning (EU) nr 182/2011 tillämpas. Artikel 87
  delkrav: []
- id: Artikel 87
  status: aterstaende
  motivering: Inventerad artikel. Juridisk relevans och delkrav återstår; svenska
    motsvarigheter får inte antas identiska.
  motsvarigheter: []
  text: Översyn Senast den 10 juli 2032 och därefter vart tredje år ska kommissionen
    se över tillämpningen av denna förordning och överlämna en rapport till Europaparlamentet
    och rådet. Den första översynen ska innehålla en bedömning av a) de nationella
    systemen för rapportering av misstankar enligt artikel 69 och hinder och möjligheter
    att inrätta ett enda rapporteringssystem på unionsnivå, b) om transparensramen
    för verkligt huvudmannaskap är tillräcklig för att minska de risker som är förknippade
    med rättsliga enheter och juridiska konstruktioner. Artikel 88
  delkrav: []
- id: Artikel 88
  status: aterstaende
  motivering: Inventerad artikel. Juridisk relevans och delkrav återstår; svenska
    motsvarigheter får inte antas identiska.
  motsvarigheter: []
  text: Rapporter Senast den 10 juli 2030 ska kommissionen till Europaparlamentet
    och rådet överlämna rapporter med en bedömning av behovet och proportionaliteten
    av att a) sänka tröskelvärdet på 25 % för identifiering av verkligt huvudmannaskap
    för juridiska personer genom ägarintresse, b) utvidga tillämpningsområdet för
    varor av högt värde till att omfatta kläder och tillbehör av högt värde, c) utvidga
    tillämpningsområdet för de tröskelvärdesbaserade upplysningarna enligt artikel
    74 till att omfatta försäljning av andra varor, införa harmoniserade format för
    rapportering av dessa transaktioner på grundval av dessa rapporters användbarhet
    för finansunderrättelseenheter och utvidga omfattningen av den information som
    samlas in från personer som handlar i frihandelszoner. d) anpassa gränsen för
    stora kontantbetalningar. Artikel 89
