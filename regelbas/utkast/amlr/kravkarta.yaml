  text: Nominella företrädares skyldigheter De nominella aktieägarna och de nominella
    styrelseledamöterna i en juridisk enhet ska spara lämpliga, korrekta och aktuella
    uppgifter om identiteten på den person som nominerar och dennes verkliga huvudmän
    samt offentliggöra dessa och deras status för den juridiska enheten. Juridiska
    enheter ska rapportera dessa uppgifter till de centrala registren. Juridiska enheter
    ska också rapportera dessa uppgifter som avses i första stycket till ansvariga
    enheter när de ansvariga enheterna tillämpas åtgärder för kundkännedom i enlighet
    med kapitel III. Artikel 67
