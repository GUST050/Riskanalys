  text: Identifiering av tredjeländer med betydande strategiska brister i sina nationella
    system för bekämpning av penningtvätt och finansiering av terrorism 1. Tredjeländer
    med betydande strategiska brister i sina nationella system för bekämpning av penningtvätt
    och finansiering av terrorism ska identifieras av kommissionen och betecknas som
    högrisktredjeländer . 2. För att identifiera de tredjeländer som avses i punkt
    1 i denna artikel ges kommissionen befogenhet att anta delegerade akter i enlighet
    med artikel 85 för att komplettera denna förordning, i fall då a) betydande strategiska
    brister har konstaterats i tredjelandets rättsliga och institutionella ramverk
    för bekämpning av penningtvätt och finansiering av terrorism, b) betydande strategiska
    brister har konstaterats i effektiviteten hos tredjelandets system för bekämpning
    av penningtvätt och finansiering av terrorism när det gäller hantering av riskerna
    för penningtvätt eller finansiering av terrorism eller när det gäller dess system
    för bedömning och minskning av riskerna för att FN:s ekonomiska sanktioner relaterade
    till finansiering av spridning av massförstörelsevapen kringgås eller inte genomförs,
    c) de betydande strategiska brister som har konstaterats enligt leden a och b
    är av varaktig karaktär och inga åtgärder för att minska dem har vidtagits eller
    håller på att vidtas. Dessa delegerade akter ska antas inom tjugo kalenderdagar
    efter det att kommissionen förvissar sig om att kriterierna i första stycket a,
    b eller c är uppfyllda. 3. Vid tillämpningen av punkt 2 ska kommissionen beakta
    uppmaningar om tillämpning av skärpta åtgärder för kundkännedom och av ytterligare
    riskreducerande åtgärder ( motåtgärder ) från internationella organisationer och
    normgivare med befogenheter på området för förhindrande av penningtvätt och bekämpning
    av finansiering av terrorism, samt relevanta utvärderingar, bedömningar, rapporter
    eller offentliga uttalanden från dessa. 4. Om ett tredjeland identifieras i enlighet
    med de kriterier som avses i punkt 2 ska ansvariga enheter tillämpa de skärpta
    åtgärder för kundkännedom som anges i artikel 34.4 med avseende på affärsförbindelser
    eller enstaka transaktioner som involverar fysiska eller juridiska personer från
    det tredjelandet. 5. Den delegerade akt som avses i punkt 2 ska bland de motåtgärder
    som förtecknas i artikel 35 ange de särskilda motåtgärder som minskar de specifika
    risker som härrör från varje högrisktredjeland. 6. Om en medlemsstat identifierar
    en specifik risk för penningtvätt eller finansiering av terrorism som utgörs av
    ett tredjeland som kommissionen har identifierat i enlighet med de kriterier som
    avses i punkt 2 och som inte hanteras genom de motåtgärder som avses i punkt 5,
    får den kräva att ansvariga enheter som är etablerade på dess territorium tillämpar
    särskilda ytterligare motåtgärder för att minska de specifika risker som härrör
    från det tredjelandet. Den identifierade risken och motsvarande motåtgärder ska
    anmälas till kommissionen inom fem dagar från det att motåtgärderna tillämpats.
    7. Kommissionen ska regelbundet se över de delegerade akter som avses i punkt
    2 för att säkerställa att de särskilda motåtgärder som fastställts enligt punkt
    5 tar hänsyn till förändringar i tredjelandets ramverk för bekämpning av penningtvätt
    och finansiering av terrorism, och att de är proportionella och lämpliga i förhållande
    till riskerna. Efter att ha tagit emot en anmälan enligt punkt 6 ska kommissionen
    bedöma den mottagna informationen för att avgöra om landsspecifika risker påverkar
    integriteten hos unionens inre marknad. Vid behov ska kommissionen se över de
    delegerade akter som avses i punkt 2 genom att lägga till nödvändiga motåtgärder
    för att minska dessa ytterligare risker. Om kommissionen anser att de särskilda
    ytterligare åtgärder som tillämpas av en medlemsstat enligt punkt 6 inte är nödvändiga
    för att minska specifika risker som härrör från det tredjelandet, får den genom
    en genomförandeakt besluta att medlemsstaten ska avsluta den särskilda ytterligare
    motåtgärden. Artikel 30
