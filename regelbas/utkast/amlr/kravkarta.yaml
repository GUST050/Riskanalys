  motsvarigheter: []
  text: 'Förenklade åtgärder för kundkännedom 1. Om affärsförbindelsen eller transaktionen
    utgör en låg risk, med beaktande av de riskfaktorer som anges i bilagorna II och
    III, får ansvariga enheter tillämpa följande förenklade åtgärder för kundkännedom:
    a) Kontrollera kundens och den verkliga huvudmannens identitet efter det att affärsförbindelsen
    ingåtts, under förutsättning att den särskilda lägre risk som identifierats motiverade
    ett sådant uppskjutande, men under alla omständigheter senast 60 dagar efter det
    att affärsförbindelsen ingåtts. b) Minska frekvensen av uppdateringar av kundidentifieringsuppgifter.
    c) Minska mängden information som samlas in för att identifiera affärsförbindelsens
    eller den enstaka transaktionens syfte och avsedda natur, och härleda detta från
    den typ av transaktion eller den typ av affärsförbindelse som ingåtts. d) Minska
    frekvensen eller graden av granskning av transaktioner som utförs av kunden. e)
    Tillämpa andra relevanta förenklade åtgärder för kundkännedom som har fastställts
    av Amla enligt artikel 28. De åtgärder som avses i första stycket ska stå i proportion
    till verksamhetens art och storlek och till de särskilda inslag av lägre risk
    som identifierats. De ansvariga enheterna ska dock övervaka transaktionerna och
    affärsförbindelserna så noga att de kan upptäcka ovanliga eller misstänkta transaktioner.
    2. Ansvariga enheter ska säkerställa att de interna förfaranden som inrättats
    enligt artikel 9 omfattar de särskilda åtgärder för förenklad kontroll som ska
    vidtas för de olika typer av kunder som utgör en lägre risk. Ansvariga enheter
    ska dokumentera beslut om att beakta ytterligare faktorer som tyder på en lägre
    risk. 3. Vid tillämpningen av de förenklade åtgärder för kundkännedom som avses
    i punkt 1 a ska ansvariga enheter anta riskhanteringsförfaranden med avseende
    på de villkor enligt vilka de kan tillhandahålla tjänster eller utföra transaktioner
    åt en kund innan en kontroll äger rum, inbegripet genom att begränsa beloppet
    för, antalet eller typen av transaktioner som kan utföras, eller genom att övervaka
    transaktioner för att säkerställa att de överensstämmer med de förväntade normerna
    för affärsförbindelsen i fråga. 4. Ansvariga enheter ska regelbundet kontrollera
    att villkoren för att tillämpa förenklade åtgärder för kundkännedom fortfarande
    föreligger. Kontrollernas frekvens ska stå i proportion till verksamhetens art
    och storlek samt de risker som den specifika affärsförbindelsen medför. 5. Ansvariga
    enheter ska avstå från att tillämpa förenklade åtgärder för kundkännedom i följande
    situationer: a) Om ansvariga enheter hyser tvivel om huruvida den information
    som kunden eller den verkliga huvudmannen har lämnat i identifieringsskedet är
    sanningsenlig, eller om de upptäcker brister i denna information. b) Om de faktorer
    som tyder på en lägre risk inte längre föreligger. c) Om övervakningen av kundens
    transaktioner och den information som samlas in i samband med affärsförbindelsen
    utesluter ett scenario med lägre risk. d) Vid misstanke om penningtvätt eller
    finansiering av terrorism. e) Vid misstanke om att kunden, eller den person som
    agerar på kundens vägnar, försöker kringgå eller undandra sig riktade ekonomiska
    sanktioner. AVSNITT 4 Skärpta krav på kundkännedom Artikel 34'
