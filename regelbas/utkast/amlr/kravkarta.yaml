  motsvarigheter: []
  text: 'Omfattningen av interna riktlinjer, förfaranden och kontroller 1. Ansvariga
    enheter ska ha interna riktlinjer, förfaranden och kontroller på plats för att
    säkerställa efterlevnaden av denna förordning, förordning (EU) 2023/1113, och
    alla förvaltningsakter som utfärdats av något tillsynsorgan och särskilt för att
    a) minska och effektivt hantera de risker för penningtvätt och finansiering av
    terrorism som identifierats på unionsnivå, på medlemsstatsnivå och vid ansvariga
    enheter, b) utöver skyldigheten att tillämpa riktade ekonomiska sanktioner, minska
    och hantera riskerna för att riktade ekonomiska sanktioner kringgås eller inte
    genomförs. De riktlinjer, förfaranden och kontroller som avses i första stycket
    ska stå i proportion till arten av den ansvariga enhetens verksamhet, inbegripet
    dess risk och komplexitet, och storlek och ska täcka alla den ansvariga enhetens
    verksamheter som omfattas av tillämpningsområdet för denna förordning. 2. De riktlinjer,
    förfaranden och kontroller som avses i punkt 1 ska omfatta följande: a) interna
    riktlinjer och förfaranden som omfattar särskilt i) utförande och uppdatering
    av den verksamhetsomfattande riskbedömningen, ii) den ansvariga enhetens ramverk
    för riskhantering, iii) åtgärder för kundkännedom för att genomföra kapitel III
    i denna förordning, inbegripet förfaranden för att avgöra om kunden, den verkliga
    huvudmannen eller den person för vars räkning eller till förmån för vilken en
    transaktion eller verksamhet utförs är en person i politiskt utsatt ställning
    eller en familjemedlem eller en känd nära medarbetare, iv) rapportering av misstänkta
    transaktioner, v) utkontraktering och utnyttjande av andra ansvariga enheters
    åtgärder för kundkännedom, vi) lagring av uppgifter och riktlinjer avseende behandling
    av personuppgifter enligt artiklarna 76 och 77, vii) övervakning och hantering
    av efterlevnaden av sådana interna riktlinjer och förfaranden i enlighet med led
    b i denna punkt, identifiering och hantering av brister och genomförande av korrigerande
    åtgärder, viii) verifiering, i proportion till de risker som är förknippade med
    de uppgifter och funktioner som ska utföras, vid rekrytering av personal och vid
    anvisning av vissa uppgifter och funktioner samt vid val av ombud och distributörer,
    av att dessa personer har ett gott anseende, ix) intern spridning av den ansvariga
    enhetens interna riktlinjer, förfaranden och kontroller, inbegripet till enhetens
    ombud, distributörer och tjänsteleverantörer som deltar i genomförandet av dess
    riktlinjer för bekämpning av penningtvätt och finansiering av terrorism, x) riktlinjer
    om utbildning av anställda och, i tillämpliga fall, ombud och distributörer om
    de åtgärder som vidtas inom den ansvariga enheten för att efterleva kraven i denna
    förordning, förordning (EU) 2023/1113, och alla förvaltningsakter som utfärdats
    av något tillsynsorgan, b) interna kontroller och en oberoende revisionsfunktion
    för att granska de interna riktlinjer och förfaranden som avses i led a i denna
    punkt och de kontroller som införts inom den ansvariga enheten; i avsaknad av
    en oberoende revisionsfunktion kan ansvariga enheter låta utföra denna granskning
    av en extern expert. De interna riktlinjer, förfaranden och kontroller som anges
    i första stycket ska dokumenteras skriftligt. Interna riktlinjer ska godkännas
    av ledningsorganet i dess ledningsfunktion. Interna förfaranden och kontroller
    ska godkännas åtminstone på nivån för regelefterlevnadschefen. 3. De ansvariga
    enheterna ska hålla de interna riktlinjerna, förfarandena och kontrollerna uppdaterade
    och förbättra dem när brister upptäcks. 4. Senast den 10 juli 2026 ska Amla utfärda
    riktlinjer om vilka aspekter ansvariga enheter, baserat på vilken typ av affärsverksamhet
    de bedriver, inbegripet dess risk och komplexitet, och deras storlek, bör ta i
    beaktande när de fastställer omfattningen av sina interna riktlinjer, förfaranden
    och kontroller, särskilt när det gäller personal som tilldelats regelefterlevnadsfunktioner.
    Dessa riktlinjer ska även ange situationer i vilka, på grund av den ansvariga
    enhetens typ och storlek, i) interna kontroller ska organiseras inom ramen för
    den kommersiella funktionen, regelefterlevnadsfunktionen och revisionsfunktionen.
    ii) den oberoende revisionsfunktionen kan utföras av en extern expert. Artikel
    10'
