  motsvarigheter: []
  text: 'Juridiska enheters skyldigheter 1. Alla juridiska enheter som är skapade
    i unionen ska erhålla och inneha adekvata, korrekta och aktuella uppgifter om
    verkligt huvudmannaskap. Juridiska enheter ska, utöver uppgifter om deras lagliga
    ägare, tillhandahålla ansvariga enheter uppgifter om verkliga huvudmän, när de
    ansvariga enheterna tillämpar åtgärder för kundkännedom i enlighet med kapitel
    III. 2. En juridisk enhet ska, utan onödigt dröjsmål efter skapandet, rapportera
    in uppgifter om verkligt huvudmannaskap till det centrala registret. Varje ändring
    av de uppgifterna ska rapporteras till det centrala registret utan onödigt dröjsmål
    och i vart fall, inom 28 kalenderdagar därefter. Den juridiska enheten ska regelbundet
    kontrollera att den innehar uppdaterade uppgifter om sitt verkliga huvudmannaskap.
    Som ett minimum ska en sådan kontroll utföras årligen, antingen som en fristående
    process eller som en del av andra periodiska processer, såsom inlämning av årsbokslut.
    De verkliga huvudmännen för en juridisk enhet samt de juridiska enheterna och,
    när det gäller juridiska konstruktioner, deras förvaltare eller personer som innehar
    en likvärdig ställning och som ingår i den juridiska enhetens ägar- eller kontrollstruktur
    ska tillhandahålla den juridiska enheten alla uppgifter som är nödvändiga för
    att den juridiska enheten ska kunna uppfylla kraven i detta kapitel eller besvara
    varje begäran om ytterligare uppgifter som mottagits enligt artikel 10.4 i direktiv
    (EU) 2024/1640. 3. Om, efter det att alla tänkbara metoder för identifiering enligt
    artiklarna 51–57 har utnyttjats, ingen person har identifierats som verklig huvudman
    eller om det från den juridiska enhetens sida råder betydande och välgrundat tvivel
    om huruvida den eller de personer som har identifierats är den eller de verkliga
    huvudmännen, ska de juridiska enheterna dokumentera de åtgärder som vidtas för
    att identifiera den eller de verkliga huvudmännen. 4. I de fall som avses i punkt
    3 i denna artikel ska juridiska enheter, när de tillhandahåller uppgifter om verkligt
    huvudmannaskap i enlighet med artikel 20 i denna förordning och artikel 10 i direktiv
    (EU) 2024/1640 tillhandahålla följande: a) En förklaring om att det inte finns
    någon verklig huvudman eller att den eller de verkliga huvudmännen inte kunde
    fastställas, åtföljd av en motivering till varför det inte var möjligt att fastställa
    den verkliga huvudmannen i enlighet med artiklarna 51–57 i denna förordning och
    vad som utgör tvivel om de konstaterade uppgifterna. b) Uppgifter om alla fysiska
    personer som är en ledande befattningshavare i den juridiska enheten, motsvarande
    de uppgifter som krävs enligt artikel 62.1 andra stycket a i denna förordning.
    I denna punkt avses med ledande befattningshavare de fysiska personer som är verkställande
    ledamöter i ledningsorganet och de fysiska personer som utövar verkställande funktioner
    inom en juridisk enhet och som är ansvariga inför ledningsorganet för den dagliga
    ledningen av enheten. 5. Juridiska enheter ska på begäran och utan dröjsmål göra
    den information som samlas in enligt denna artikel tillgänglig för behöriga myndigheter.
    6. De uppgifter som avses i punkt 4 ska sparas i fem år efter den dag då de juridiska
    enheterna upplöses eller på annat sätt upphör att existera, antingen av personer
    som av enheten utsetts att spara handlingarna eller av administratörer eller konkursförvaltare
    eller andra personer som medverkar till att upplösa enheten. Identiteten på och
    kontaktuppgifterna till den person som ansvarar för att spara uppgifterna ska
    rapporteras till de centrala registren. Artikel 64'
  delkrav: []
