  motsvarigheter: []
  text: Rapportering av misstankar 1. Ansvariga enheter, och i tillämpliga fall deras
    styrelseledamöter och anställda, ska samarbeta fullt ut med finansunderrättelseenheten
    genom att utan dröjsmål a) på eget initiativ underrätta finansunderrättelseenheten
    i de fall den ansvariga enheten känner till, misstänker eller har rimliga skäl
    att misstänka att medel eller verksamheter, oberoende av vilket belopp det gäller,
    utgör vinning av brottslig verksamhet eller har koppling till finansiering av
    terrorism eller brottslig verksamhet, och genom att svara på finansunderrättelseenhetens
    begäran om ytterligare uppgifter i sådana fall, b) på finansunderrättelseenhetens
    begäran lämna all nödvändig information, inbegripet information om transaktionsuppgifter,
    inom de fastställda tidsfristerna. Alla misstänkta transaktioner, inbegripet försök
    till transaktioner och misstankar till följd av oförmåga att utföra åtgärder för
    kundkännedom, ska rapporteras i enlighet med första stycket. Vid tillämpning av
    första stycket ska ansvariga enheter svara på en begäran om information från finansunderrättelseenheten
    inom fem arbetsdagar. I motiverade och brådskande fall får finansunderrättelseenheten
    förkorta den tidsfristen, inbegripet till mindre än 24 timmar. Genom undantag
    från tredje stycket får finansunderrättelseenheten förlänga tidsfristen för svar
    utöver de fem arbetsdagarna om den anser att det är motiverat och förutsatt att
    förlängningen inte undergräver finansunderrättelseenhetens analys. 2. Vid tillämpning
    av punkt 1 ska de ansvariga enheterna bedöma transaktioner eller verksamheter
    som utförs av deras kunder på grundval av och mot bakgrund av alla relevanta fakta
    och uppgifter som de känner till eller förfogar över. Vid behov ska de ansvariga
    enheterna prioritera sin bedömning med beaktande av hur brådskande transaktionen
    eller verksamheten är och de risker som påverkar den medlemsstat där de är etablerade.
    En misstanke enligt punkt 1 a ska grundas på kundens och dess motparters egenskaper,
    transaktionens eller verksamhetens storlek och art eller metoder och mönster,
    kopplingen mellan flera transaktioner eller verksamheter, medlens ursprung, destination
    eller användning och andra omständigheter som den ansvariga enheten känner till,
    inklusive transaktionens eller verksamhetens överensstämmelse med de uppgifter
    som erhållits enligt kapitel III, inbegripet kundens riskprofil. 3. Senast den
    10 juli 2026 ska Amla utarbeta förslag till tekniska standarder för genomförande
    och överlämna dem till kommissionen för antagande. Det format som ska användas
    för rapportering av misstankar enligt punkt 1 a och tillhandahållande av transaktionsuppgifter
    enligt punkt 1 b ska anges i dessa förslag till tekniska genomförandestandarder.
    4. Kommissionen ges befogenhet att anta de tekniska standarder för genomförande
    som avses i punkt 3 i denna artikel i enlighet med artikel 53 i förordning (EU)
    2024/1620. 5. Senast den 10 juli 2027 ska Amla utfärda riktlinjer för indikatorer
    för misstänkt aktivitet eller beteende. Dessa riktlinjer ska regelbundet uppdateras.
    6. Den regelefterlevnadsansvariga som utsetts i enlighet med artikel 11.2 ska
    vidarebefordra de uppgifter som avses i punkt 1 i denna artikel till finansunderrättelseenheten
    i den medlemsstat där den ansvariga enhet som vidarebefordrar informationen är
    etablerad. 7. Ansvariga enheter ska säkerställa att den regelefterlevnadsansvariga
    som utsetts i enlighet med artikel 11.2 samt alla anställda eller personer i motsvarande
    ställning, inbegripet ombud och distributörer, som deltar i utförandet av de uppgifter
    som omfattas av den här artikeln skyddas mot repressalier, diskriminering och
    annan orättvis behandling för utförandet av dessa uppgifter. Denna punkt ska inte
    påverka det skydd som dessa personer som avses i första stycket kan ha rätt till
    enligt direktiv (EU) 2019/1937. 8. Om verksamheten i ett partnerskap för informationsutbyte
    leder till kunskap om, misstanke om eller rimliga skäl att misstänka att medel,
    oavsett vilket belopp det rör sig om, utgör vinning av brottslig verksamhet eller
    har anknytning till finansiering av terrorism, får ansvariga enheter som har identifierat
    misstankar i samband med sina kunders verksamhet utse en av dem att ha uppdraget
    att överlämna en rapport till finansunderrättelseenheten enligt punkt 1 a. Överlämnandet
    ska åtminstone omfatta namn och kontaktuppgifter för alla ansvariga enheter som
    deltagit i den verksamhet som ligger till grund för rapporten. Om de ansvariga
    enheter som avses i första stycket är etablerade i flera medlemsstater ska informationen
    rapporteras till varje berörd finansunderrättelseenhet. I detta syfte ska ansvariga
    enheter säkerställa att rapporten lämnas in av en ansvarig enhet inom territoriet
    i de medlemsstater där finansunderrättelseenheten är belägen. Om de ansvariga
    enheterna beslutar att inte utnyttja möjligheten att lämna in en enda rapport
    till finansunderrättelseenheten enligt första stycket ska de i sin rapport ange
    att misstanken föranleds av verksamheten i ett partnerskap för informationsutbyte.
    9. De ansvariga enheter som avses i punkt 8 i den här artikeln ska bevara en kopia
    av rapporter som lämnats in enligt den punkten i enlighet med artikel 77. Artikel
    70
  delkrav: []
