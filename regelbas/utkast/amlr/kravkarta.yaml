  text: Åtgärder gentemot personer som upphör att vara personer i politiskt utsatt
    ställning 1. Om en person i politiskt utsatt ställning inte längre har en viktig
    offentlig funktion i unionen, en medlemsstat, ett tredjeland eller en internationell
    organisation, ska ansvariga enheter, i sin bedömning av risker för penningtvätt
    och finansiering av terrorism i enlighet med artikel 20, beakta om den personen,
    till följd av sin tidigare funktion, fortfarande utgör en risk. 2. Ansvariga enheter
    ska tillämpa en eller flera av de åtgärder som anges i artikel 34.4 för att minska
    de risker som personen i politiskt utsatt ställning utgör till dess att de risker
    som avses i punkt 1 i den här artikeln inte längre existerar, men under alla omständigheter
    under åtminstone tolv månader efter det att personen upphör att ha en viktig offentlig
    funktion. 3. Den skyldighet som avses i punkt 2 ska på samma sätt gälla om en
    ansvarig enhet utför en enstaka transaktion eller ingår en affärsförbindelse med
    en person som tidigare har haft en viktig offentlig funktion i unionen, en medlemsstat,
    ett tredjeland eller en internationell organisation. Artikel 46
