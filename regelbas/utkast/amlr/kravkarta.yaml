  text: Särskilda bestämmelser för vissa kategorier av ansvariga enheters rapportering
    av misstankar 1. Genom undantag från artikel 69.1 får medlemsstaterna tillåta
    de ansvariga enheter som avses i artikel 3.3 a och b att överföra de uppgifter
    som avses i artikel 69.1 till ett självreglerande organ som utsetts av medlemsstaten.
    Det utsedda självreglerande organet ska skyndsamt och i obearbetat skick vidarebefordra
    de uppgifter som avses i första stycket till finansunderrättelseenheten. 2. Notarier,
    advokater, andra oberoende jurister, revisorer, externa revisorer och skatterådgivare
    ska undantas från kraven i artikel 69.1 i den utsträckning som ett sådant undantag
    gäller information som dessa får från eller mottar om en klient i samband med
    att de utreder dennes rättsliga ställning, försvarar eller företräder denne i
    eller rörande rättsliga förfaranden, inbegripet tillhandahåller rådgivning om
    att inleda eller undvika sådana förfaranden, oavsett om sådana uppgifter fås eller
    inhämtas före, under eller efter sådana förfaranden. Det undantag som anges i
    första stycket ska dock inte tillämpas när de ansvariga enheter som där avses
    a) deltar i penningtvätt, förbrott till penningtvätt eller finansiering av terrorism,
    b) tillhandahåller juridisk rådgivning för penningtvätt, förbrott till penningtvätt
    eller finansiering av terrorism, eller c) har vetskap om att klienten söker juridisk
    rådgivning för penningtvätt, förbrott till penningtvätt eller finansiering av
    terrorism; vetskap eller syfte får härledas ur objektiva, faktiska omständigheter.
    3. Utöver de situationer som avses i punkt 2 andra stycket får medlemsstaterna,
    om det är motiverat på grund av de högre riskerna för penningtvätt, förbrott till
    penningtvätt eller finansiering av terrorism i samband med vissa typer av transaktioner,
    besluta att det undantag som avses i punkt 2 första stycket inte är tillämpligt
    på dessa typer av transaktioner och vid behov införa ytterligare rapporteringsskyldigheter
    för de ansvariga enheter som avses i den punkten. Medlemsstaterna ska anmäla åtgärder
    som vidtagits enligt denna punkt till kommissionen. Kommissionen ska informera
    de övriga medlemsstaterna om sådana beslut. Artikel 71
  delkrav: []
