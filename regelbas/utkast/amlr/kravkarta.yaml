  text: Särskilda bestämmelser för personer som ansöker om uppehållstillstånd genom
    investeringssystem Utöver de åtgärder för kundkännedom som föreskrivs i artikel
    20 ska ansvariga enheter, när det gäller kunder som är tredjelandsmedborgare och
    som ansöker om uppehållstillstånd i en medlemsstat i utbyte mot någon form av
    investering, inbegripet överföringar, köp eller hyra av egendom, investeringar
    i statsobligationer, investeringar i företagsenheter, donation eller tilldelning
    av en verksamhet som bidrar till det allmänna bästa och bidrag till statsbudgeten,
    som ett minimum tillämpa skärpta åtgärder för kundkännedom som anges i artikel
    34.4 a, c, e och f. Artikel 42
