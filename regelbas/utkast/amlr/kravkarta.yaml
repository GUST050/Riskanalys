  text: Identifiering av föremål för en befogenhet och förmånstagare vid uteblivet
    utövande av befogenheter i diskretionära truster När det gäller diskretionära
    truster, där förmånstagarna ännu inte har valts ut, ska föremålen för en befogenhet
    och förmånstagarna vid uteblivet utövande av befogenheter identifieras. Förmånstagare
    bland föremålen för en befogenhet ska vara verkliga huvudmän så snart de har valts
    ut. Förmånstagarna vid uteblivet utövande av befogenheter ska vara verkliga huvudmän
    om förvaltarna inte utövar sina diskretionära befogenheter. Om diskretionära truster
    uppfyller villkoren som fastställs i artikel 59.2 ska endast kategorin av föremål
    för en befogenhet och förmånstagarna vid uteblivet utövande av befogenheter identifieras.
    Dessa kategorier av diskretionära truster ska anmälas till kommissionen i enlighet
    med punkt 3 i den artikeln. Artikel 61
  delkrav: []
