  text: 'Tillämpningsområde för skärpta åtgärder för kundkännedom 1. I de fall som
    avses i artiklarna 29, 30, 31 och 36–46 samt i andra fall av högre risk som ansvariga
    enheter konstaterat enligt artikel 20.2 andra stycket, ska de ansvariga enheterna
    tillämpa skärpta åtgärder för kundkännedom för att hantera och minska sådana risker
    på lämpligt sätt. 2. Ansvariga enheter ska undersöka ursprunget till och destinationen
    för de medel som berörs av, samt syftet med, alla transaktioner som uppfyller
    åtminstone ett av följande villkor: a) Transaktionen är komplex. b) Transaktionen
    är ovanligt stor. c) Transaktionen genomförs enligt ett ovanligt transaktionsmönster.
    d) Transaktionen har inte något tydligt ekonomiskt eller lagligt syfte. 3. Med
    undantag av de fall som omfattas av avsnitt 2 i detta kapitel ska ansvariga enheter,
    när de bedömer de risker för penningtvätt och finansiering av terrorism som en
    affärsförbindelse eller en enstaka transaktion medför, beakta åtminstone de faktorer
    för potentiellt högre risk som anges i bilaga III och de riktlinjer som antagits
    av Amla enligt artikel 32 samt alla andra indikatorer för högre risk, såsom underrättelser
    utfärdade av finansunderrättelseenheten och resultat från den verksamhetsomfattande
    riskbedömningen enligt artikel 10. 4. Med undantag av de fall som omfattas av
    avsnitt 2 i detta kapitel ska, i fall av högre risk som avses i punkt 1 i denna
    artikel, ansvariga enheter tillämpa skärpta åtgärder för kundkännedom, i proportion
    till de högre risker som identifierats, vilket kan omfatta följande åtgärder:
    a) Inhämta ytterligare information om kunden och de verkliga huvudmännen. b) Inhämta
    ytterligare information om affärsförbindelsens avsedda natur. c) Inhämta ytterligare
    information om varifrån kundens och de verkliga huvudmännens medel och förmögenhet
    kommer. d) Inhämta information om skälen till planerade eller genomförda transaktioner
    och deras överensstämmelse med affärsförbindelsen. e) Inhämta godkännande från
    företagsledningen att inleda eller fortsätta en affärsförbindelse. f) Förstärka
    övervakningen av affärsförbindelsen genom att öka antalet kontroller och förbättra
    tidpunkterna för deras genomförande samt välja ut de transaktionsmönster som bör
    analyseras ytterligare. g) Kräva att den första betalningen genomförs genom ett
    konto i kundens namn hos ett kreditinstitut som omfattas av standarder för åtgärder
    för kundkännedom som inte är mindre robusta än dem som fastställs i denna förordning.
    5. Kreditinstitut, finansiella institut och tjänsteleverantörer till truster eller
    företag ska, när en affärsförbindelse som konstaterats ha en högre risk inbegriper
    hantering av tillgångar med ett värde på minst 5 000 000 EUR, eller motsvarande
    belopp i nationell eller utländsk valuta, genom individanpassade tjänster för
    en kund som innehar totala tillgångar med ett värde på minst 50 000 000 EUR, eller
    motsvarande belopp i nationell eller utländsk valuta, oavsett om det rör sig om
    finansiella tillgångar, investeringsbara tillgångar eller fastighetstillgångar,
    eller en kombination av dessa, med undantag för kundens privata bostad, tillämpa
    följande skärpta åtgärder för kundkännedom, utöver de skärpta åtgärder för kundkännedom
    som tillämpas enligt punkt 4: a) Särskilda åtgärder inklusive förfaranden för
    att minska riskerna i samband med individanpassade tjänster och produkter som
    erbjuds denna kund. b) Inhämtande av ytterligare information om källan till denna
    kunds medel. c) Förebygga och hantera intressekonflikter mellan kunder och företagsledningen
    eller anställda vid den ansvariga enhet som utför uppgifter som rör den ansvariga
    enhetens regelefterlevnad i förhållande till den kunden. Senast den 10 juli 2027
    ska Amla utfärda riktlinjer om de åtgärder som kreditinstitut, finansiella institut
    och tjänsteleverantörer till truster eller företag ska vidta för att fastställa
    om en kund innehar totala tillgångar med ett värde på minst 50 000 000 EUR, eller
    motsvarande belopp i nationell eller utländsk valuta, i finansiella tillgångar,
    investeringsbara tillgångar eller fastighetstillgångar och hur det värdet ska
    fastställas. 6. Med undantag av de fall som omfattas av avsnitt 2 i detta kapitel
    får medlemsstaterna, när de identifierar fall av högre risk enligt artikel 8 i
    direktiv (EU) 2024/1640, inbegripet som en följd av sektoriella riskbedömningar
    som medlemsstaterna har utfört, kräva att ansvariga enheter tillämpar skärpta
    åtgärder för kundkännedom och vid behov specificera dessa åtgärder. Medlemsstaterna
    ska underrätta kommissionen och Amla om deras beslut att ålägga de krav på skärpta
    åtgärder för kundkännedom på ansvariga enheter som är etablerade på deras territorium
    inom en månad efter det att de antagits, tillsammans med en motivering av de risker
    för penningtvätt och finansiering av terrorism som ligger till grund för ett sådant
    beslut. Om de risker som medlemsstater har identifierat enligt första stycket
    sannolikt har sitt ursprung utanför unionen och kan påverka unionens finansiella
    system, ska Amla, på begäran av kommissionen eller på eget initiativ, överväga
    att uppdatera de riktlinjer som antagits enligt artikel 32. 7. Kommissionen ges
    befogenhet att anta delegerade akter i enlighet med artikel 85 för att komplettera
    denna förordning om den identifierar ytterligare fall av högre risk som avses
    i punkt 1 i denna artikel som påverkar unionen som helhet och skärpta åtgärder
    för kundkännedom som ansvariga enheter ska tillämpa i dessa fall, med beaktande
    av medlemsstaternas underrättelser enligt punkt 6 första stycket i den här artikeln.
    8. Skärpta åtgärder för kundkännedom ska inte med automatik åberopas för filialer
    eller dotterföretag till ansvariga enheter som är etablerade i unionen och som
    är belägna i de tredjeländer som avses i artiklarna 29, 30 och 31, om dessa filialer
    eller dotterföretag helt och hållet följer de koncernomfattande riktlinjerna,
    förfarandena och kontrollerna i enlighet med artikel 17. Artikel 35'
  delkrav: []
