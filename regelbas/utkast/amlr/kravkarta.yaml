  text: 'Förhandsanmälan av undantag 1. Medlemsstaterna ska utan dröjsmål anmäla till
    kommissionen varje eventuellt undantag de avser att bevilja i enlighet med artiklarna
    4, 5 och 6. Anmälan ska innehålla en motivering till undantaget, baserad på den
    relevanta riskbedömning som medlemsstaten utfört för att upprätthålla undantaget.
    2. Kommissionen ska inom två månader från en sådan anmälan som avses i punkt 1
    vidta en av följande åtgärder: a) Bekräfta att undantaget får beviljas på grundval
    av medlemsstatens motivering. b) Genom ett motiverat beslut förklara att undantaget
    inte får beviljas. Vid tillämpning av första stycket får kommissionen begära ytterligare
    information från den anmälande medlemsstaten. 3. När medlemsstaterna har mottagit
    en bekräftelse från kommissionen enligt punkt 2 a i denna artikel får medlemsstaterna
    anta ett beslut om beviljande av undantaget. I beslutet ska de skäl som beslutet
    grundar sig på anges. Medlemsstaterna ska ompröva sådana beslut regelbundet, och
    under alla förhållanden när de uppdaterar sin nationella riskbedömning enligt
    artikel 8 i direktiv (EU) 2024/1640. 4. Senast den 10 oktober 2027 ska medlemsstaterna
    anmäla till kommissionen de undantag som beviljats enligt artikel 2.2 och 2.3
    i direktiv (EU) 2015/849 och som är i kraft den 10 juli 2027. 5. Varje år ska
    kommissionen i Europeiska unionens officiella tidning offentliggöra en förteckning
    över de undantag som beviljats enligt denna artikel och göra den förteckningen
    allmänt tillgänglig på sin webbplats. AVSNITT 3 gränsöverskridande verksamheter
    Artikel 8'
