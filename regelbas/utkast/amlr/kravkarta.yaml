  text: Begränsningar av stora kontantbetalningar i utbyte mot varor eller tjänster
    1. Personer som handlar med varor eller tillhandahåller tjänster får endast godta
    eller göra en kontantbetalning upp till ett belopp på 10 000 EUR eller motsvarande
    i nationell eller utländsk valuta, oavsett om transaktionen utförs vid ett tillfälle
    eller flera tillfällen som förefaller ha samband. 2. Medlemsstaterna får anta
    lägre gränser efter samråd med Europeiska centralbanken i enlighet med artikel
    2.1 i rådets beslut 98/415/EG ( 47 ) . Dessa lägre gränser ska anmälas till kommissionen
    inom tre månader efter det att åtgärden införts på nationell nivå. 3. Om det redan
    finns gränser på nationell nivå som ligger under den gräns som anges i punkt 1
    ska de fortsätta att gälla. Medlemsstaterna ska anmäla dessa gränser till kommissionen
    senast den 10 oktober 2024. 4. Gränsen enligt punkt 1 ska inte tillämpas på a)
    betalningar mellan fysiska personer som inte agerar i sin yrkesutövning, b) betalningar
    eller insättningar som görs i lokaler tillhörande kreditinstitut, utgivare av
    elektroniska pengar enligt definitionen i artikel 2.3 i direktiv 2009/110/EG och
    betaltjänstleverantörer enligt definitionen i artikel 4.11 i direktiv (EU) 2015/2366
    Betalningar eller insättningar som avses i första stycket b som ligger ovanför
    gränsen ska rapporteras till finansunderrättelseenheten inom de tidsfrister som
    finansunderrättelseenheten ålagt. 5. Medlemsstaterna ska säkerställa att lämpliga
    åtgärder, inbegripet åläggande av sanktioner, vidtas mot fysiska eller juridiska
    personer som agerar i sin yrkesutövning och som misstänks bryta mot den gräns
    som anges i punkt 1 eller mot en lägre gräns som antagits av medlemsstaterna.
    6. Den totala sanktionsnivån ska beräknas i enlighet med relevanta bestämmelser
    i nationell rätt på ett sådant sätt att den ger resultat som står i proportion
    till överträdelsens allvar och på så sätt effektivt avskräcker från ytterligare
    brott av samma slag. 7. Om betalningsmedel genom andra medel enligt definitionen
    i artikel 4.25 i direktiv (EU) 2015/2366 än sedlar och mynt på grund av force
    majeure inte finns att tillgå på nationell nivå, får medlemsstaterna tillfälligt
    avbryta tillämpningen av punkt 1 eller, i tillämpliga fall, punkt 2 i den här
    artikeln och de ska utan dröjsmål underrätta kommissionen om detta. Medlemsstaterna
    ska också informera kommissionen om den förväntade varaktigheten av att betalningsmedel
    genom andra medel enligt definitionen i artikel 4.25 i direktiv (EU) 2015/2366
    än sedlar och mynt inte finns att tillgå och om de åtgärder som medlemsstaterna
    vidtagit för att återställa deras tillgänglighet. Om kommissionen, på grundval
    av de uppgifter som lämnats av medlemsstaten, anser att det tillfälliga avbrytandet
    av tillämpningen av punkt 1 eller, i tillämpliga fall, punkt 2 inte är motiverat
    på grund av force majeure, ska den anta ett beslut riktat till den medlemsstaten
    med en begäran om ett omedelbart upphävande av ett sådant tillfälligt avbrytande.
    KAPITEL IX SLUTBESTÄMMELSER AVSNITT 1 Samarbete mellan finansunderrättelseenheter
