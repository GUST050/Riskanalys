  text: 'Särskilda åtgärder för enskilda motpartsinstitut i tredjeländer 1. Kreditinstitut
    och finansiella institut ska, när det gäller motpartsinstitut i tredjeländer med
    vilka de har en korrespondentförbindelse enligt artikel 36 eller 37 och med avseende
    på vilka Amla utfärdar en rekommendation enligt punkt 2 i den här artikeln, tillämpa
    de åtgärder som fastställs i punkt 6 i den här artikeln. 2. Amla ska utfärda en
    rekommendation riktad till kreditinstitut och finansiella institut om det finns
    farhågor om att motpartsinstitut i tredjeländer befinner sig i någon av följande
    situationer: a) De har allvarligt, upprepat eller systematiskt brutit mot krav
    på bekämpning av penningtvätt och finansiering av terrorism. b) De har brister
    i sina interna riktlinjer, förfaranden och kontroller som sannolikt kommer att
    leda till allvarliga, upprepade eller systematiska överträdelser av krav på bekämpning
    av penningtvätt och finansiering av terrorism. c) De har infört interna riktlinjer,
    förfaranden och kontroller som inte står i proportion till de risker för penningtvätt,
    förbrott till penningtvätt och finansiering av terrorism som motpartsinstitutet
    i ett tredjeland är exponerat för. 3. Den rekommendation som avses i punkt 1 ska
    utfärdas om samtliga följande villkor är uppfyllda: a) Ett finansiellt tillsynsorgan,
    inbegripet Amla när den utövar sin tillsynsverksamhet, bedömer på grundval av
    tillgängliga uppgifter i samband med sin tillsynsverksamhet att ett motpartsinstitut
    i ett tredjeland befinner sig i någon av de situationer som anges i punkt 2 och
    kan påverka riskexponeringen för korrespondentförbindelsen. b) Efter en bedömning
    av de uppgifter som är tillgängliga för det finansiella tillsynsorgan som avses
    i led a i denna punkt råder det samförstånd mellan de finansiella tillsynsorganen
    i unionen om att motpartsinstitutet från ett tredjeland befinner sig i någon av
    de situationer som förtecknas i punkt 2 och kan påverka korrespondentförbindelsens
    riskexponering. 4. Innan Amla utfärdar den rekommendation som avses i punkt 2
    ska den samråda med det tillsynsorgan i tredjeland som ansvarar för motpartsinstitutet
    och begära att det lämnar både sina egna och motpartsinstitutets synpunkter när
    det gäller frågan huruvida de riktlinjer, förfaranden och kontroller för bekämpning
    av penningtvätt och finansiering av terrorism samt de åtgärder för kundkännedom
    som motpartsinstitutet har infört för att minska riskerna för penningtvätt, förbrott
    till penningtvätt och finansiering av terrorism är tillräckliga, och vilka korrigeringsåtgärder
    som ska vidtas. Om inget svar lämnas inom två månader eller om svaret inte visar
    att motpartsinstitutet i tredjeland kan genomföra tillfredsställande strategier,
    förfaranden och kontroller för bekämpning av penningtvätt och finansiering av
    terrorism samt tillämpa lämpliga åtgärder för kundkännedom för att minska de risker
    som det är exponerat för och som kan påverka korrespondentförbindelsen, ska Amla
    gå vidare med rekommendationen. 5. Amla ska dra tillbaka den rekommendation som
    avses i punkt 2 så snart den anser att ett motpartsinstitut i tredjeland för vilket
    den antog den rekommendationen inte längre uppfyller de villkor som fastställs
    i punkt 3. 6. När det gäller motpartsinstitut i tredjeländer som avses i punkt
    1 ska kreditinstitut och finansiella institut a) avstå från att ingå nya affärsförbindelser
    med motpartsinstitutet i ett tredjeland, såvida de inte, på grundval av den information
    som samlats in enligt artikel 36 eller 37, drar slutsatsen att de riskreducerande
    åtgärder som tillämpas på affärsförbindelsen med motpartsinstitutet i ett tredjeland
    och de åtgärder som motpartsinstitutet i ett tredjeland har vidtagit på ett adekvat
    sätt kan minska de risker för penningtvätt och finansiering av terrorism som är
    förknippade med den affärsförbindelsen, b) för pågående affärsförbindelser med
    motpartsinstitutet i ett tredjeland i) se över och uppdatera uppgifterna om motpartsinstitutet
    enligt artikel 36 eller 37, ii) avsluta affärsförbindelsen såvida de inte, på
    grundval av den information som samlats in i enlighet med led i, drar slutsatsen
    att de riskreducerande åtgärder som tillämpas på affärsförbindelsen med motpartsinstitutet
    i ett tredjeland och de åtgärder som vidtagits vid motpartsinstitutet i ett tredjeland
    på ett adekvat sätt kan minska de risker för penningtvätt och finansiering av
    terrorism som är förknippade med den affärsförbindelsen, c) informera motpartsinstitutet
    om de slutsatser de har dragit med avseende på riskerna med korrespondentförbindelsen
    till följd av Amlas rekommendation och de åtgärder som har vidtagits enligt led
    a eller b. Om Amla har dragit tillbaka en rekommendation enligt punkt 5 ska kreditinstitut
    och finansiella institut se över sin bedömning av huruvida motpartsinstituten
    i ett tredjeland uppfyller något av villkoren i punkt 3. 7. Kreditinstitut och
    finansiella institut ska dokumentera alla beslut som fattas enligt denna artikel.
    Artikel 39'
