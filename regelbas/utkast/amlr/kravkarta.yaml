  text: 'Tekniska standarder för tillsyn avseende information som krävs för utförandet
    av åtgärder för kundkännedom 1. Senast den 10 juli 2026 ska Amla utarbeta förslag
    till tekniska standarder för tillsyn och överlämna dem till kommissionen för antagande.
    I förslagen till tekniska standarder för tillsyn ska följande anges: a) De krav
    som gäller för ansvariga enheter enligt artikel 20 och den information som ska
    samlas in för utförandet av vanliga, förenklade och skärpta åtgärder för kundkännedom
    enligt artiklarna 22, 25, 33.1 och 34.4, inbegripet minimikrav i situationer med
    lägre risk. b) Den typ av förenklade åtgärder för kundkännedom som ansvariga enheter
    kan vidta i situationer med lägre risk enligt artikel 33.1 i denna förordning,
    inbegripet åtgärder som är tillämpbara för specifika kategorier av ansvariga enheter
    och produkter eller tjänster, med hänsyn till resultaten av den riskbedömning
    på unionsnivå som kommissionen gjort enligt artikel 7 i direktiv (EU) 2024/1640.
    c) De riskfaktorer som är förknippade med egenskaper hos instrument för elektroniska
    pengar som tillsynsorganen bör beakta när de fastställer omfattningen av undantaget
    enligt artikel 19.7. d) De tillförlitliga och oberoende informationskällor som
    får användas för att kontrollera fysiska eller juridiska personers identifieringsuppgifter
    för de syften som anges i artikel 22.6 och 22.7. e) En förteckning över de egenskaper
    som de medel för elektronisk identifiering och relevanta kvalificerade betrodda
    tjänster som avses i artikel 22.6 b måste ha för att uppfylla kraven i artikel
    20.1 a och b vid vanliga, förenklade och skärpta åtgärder för kundkännedom. 2.
    De krav och åtgärder som avses i punkt 1 a och b ska baseras på följande kriterier:
    a) Den inneboende risk som är förenad med den tillhandahållna tjänsten. b) De
    risker som är förknippade med kundkategorier. c) Transaktionens art, belopp och
    upprepning. d) De kanaler som används för affärsförbindelsen eller den enstaka
    transaktionen. 3. Amla ska regelbundet se över de tekniska standarderna för tillsyn
    och vid behov utarbeta och förelägga kommissionen ett förslag om uppdatering av
    dessa standarder, bland annat i syfte att ta innovation och teknisk utveckling
    i beaktande. 4. Kommissionen ges befogenhet att komplettera denna förordning genom
    att anta de tekniska standarder för tillsyn som avses i punkterna 1 och 3 i denna
    artikel i enlighet med artiklarna 49–52 i förordning (EU) 2024/1620. AVSNITT 2
    Policy gentemot tredjeland och penningtvätts- och terrorismfinansieringshot från
    länder utanför unionen Artikel 29'
