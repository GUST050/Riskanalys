  text: Utövande av delegeringen 1. Befogenheten att anta delegerade akter ges till
    kommissionen med förbehåll för de villkor som anges i denna artikel. 2. Den befogenhet
    att anta delegerade akter som avses i artiklarna 29, 30, 31, 34, 43, 52 och 68
    ges till kommissionen tills vidare från och med den 9 juli 2024. 3. Den delegering
    av befogenhet som avses i artiklarna 29, 30, 31, 34, 43, 52 och 68 får när som
    helst återkallas av Europaparlamentet eller rådet. Ett beslut om återkallelse
    innebär att delegeringen av den befogenhet som anges i beslutet upphör att gälla.
    Beslutet får verkan dagen efter det att det offentliggörs i Europeiska unionens
    officiella tidning , eller vid ett senare i beslutet angivet datum. Det påverkar
    inte giltigheten av delegerade akter som redan har trätt i kraft. 4. Innan kommissionen
    antar en delegerad akt ska den samråda med experter som utsetts av varje medlemsstat
    i enlighet med principerna i det interinstitutionella avtalet av den 13 april
    2016 om bättre lagstiftning. 5. Så snart kommissionen antar en delegerad akt ska
    den samtidigt delge Europaparlamentet och rådet denna. 6. En delegerad akt som
    antas enligt artikel 29, 30, 31 eller 34 ska träda i kraft endast om varken Europaparlamentet
    eller rådet har gjort invändningar mot den delegerade akten inom en period på
    en månad från den dag då akten delgavs Europaparlamentet och rådet, eller om både
    Europaparlamentet och rådet, före utgången av den perioden, har underrättat kommissionen
    om att de inte kommer att invända. Denna period ska förlängas med en månad på
    Europaparlamentets eller rådets initiativ. 7. En delegerad akt som antas enligt
    artikel 43, 52 eller 68 ska träda i kraft endast om varken Europaparlamentet eller
    rådet har gjort invändningar mot den delegerade akten inom en period på tre månader
    från den dag då akten delgavs Europaparlamentet och rådet, eller om både Europaparlamentet
    och rådet, före utgången av den perioden, har underrättat kommissionen om att
    de inte kommer att invända. Denna period ska förlängas med tre månader på Europaparlamentets
    eller rådets initiativ. Artikel 86
  delkrav: []
