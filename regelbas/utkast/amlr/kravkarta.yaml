  text: Undantag från juridiska enheters och juridiska konstruktioners skyldigheter
    Artiklarna 63 och 64 ska inte tillämpas på a) företag vars värdepapper är upptagna
    till handel på en reglerad marknad, förutsatt att i) kontrollen över företaget
