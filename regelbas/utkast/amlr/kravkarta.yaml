  motsvarigheter: []
  text: Fortlöpande övervakning av affärsförbindelsen och övervakning av transaktioner
    som utförs av kunder 1. Ansvariga enheter ska fortlöpande övervaka affärsförbindelserna,
    inbegripet transaktioner som utförs av kunden, under en förbindelses hela existens
    för att säkerställa att transaktionerna motsvarar den ansvariga enhetens kundkännedom,
    kundens verksamhet och riskprofil, och vid behov även uppgifterna om medlens ursprung
    och destination samt för att identifiera de transaktioner som ska bedömas grundligare
    enligt artikel 69.2. Om affärsförbindelser omfattar fler än en produkt eller tjänst
    ska ansvariga enheter säkerställa att åtgärderna för kundkännedom omfattar alla
    dessa produkter och tjänster. Om ansvariga enheter som tillhör en koncern har
    affärsförbindelser med kunder som också är kunder till andra enheter inom den
    koncernen, oavsett om dessa är ansvariga enheter eller företag som inte omfattas
    av kraven på bekämpning av penningtvätt och finansiering av terrorism, ska de
    beakta information om dessa andra affärsförbindelser i syfte att övervaka affärsförbindelserna
    med sina kunder. 2. I samband med den fortlöpande övervakning som avses i punkt
    1 ska ansvariga enheter säkerställa att relevanta handlingar, relevanta uppgifter
    eller relevant information om kunden hålls uppdaterade. Tiden mellan uppdateringarna
    av kundinformationen enligt första stycket ska vara beroende av den risk som affärsförbindelsen
    medför och får under inga omständigheter överstiga a) ett år för kunder med högre
    risk som omfattas av åtgärder enligt avsnitt 4 i detta kapitel, b) fem år för
    alla övriga kunder. 3. Utöver de krav som fastställs i punkt 2 ska de ansvariga
    enheterna se över och i relevanta fall uppdatera kundinformationen när a) kundens
    relevanta omständigheter förändras, b) den ansvariga enheten har en rättslig skyldighet
    att under det aktuella kalenderåret kontakta kunden i syfte att se över relevant
    information om verkliga huvudmän eller för att följa rådets direktiv 2011/16/EU
    ( 42 ) , c) en relevant uppgift om kunden kommer till deras kännedom. 4. Utöver
    den fortlöpande övervakning som avses i punkt 1 i denna artikel ska ansvariga
    enheter regelbundet kontrollera om villkoren som fastställs i artikel 20.1 d är
    uppfyllda. Frekvensen för denna kontroll ska stå i proportion till den ansvariga
    enhetens och affärsförbindelsens exponering för risker för att riktade ekonomiska
    sanktioner kringgås eller inte genomförs. När det gäller kreditinstitut och finansiella
    institut ska den kontroll som avses i första stycket också utföras vid varje nytt
    uppförande på förteckning avseende med riktade ekonomiska sanktioner. Kraven i
    denna punkt ska inte ersätta skyldigheten att tillämpa riktade ekonomiska sanktioner
    eller strängare krav enligt andra unionsrättsakter eller enligt nationell rätt
    om avstämning av klientbasen mot förteckningar om riktade ekonomiska sanktioner.
    5. Senast den 10 juli 2026 ska Amla utfärda riktlinjer för fortlöpande övervakning
    av affärsförbindelser och för övervakning av de transaktioner som utförs i samband
    med en sådan förbindelse. Artikel 27
  delkrav: []
