  text: Avstående från att utföra transaktioner 1. Ansvariga enheter ska avstå från
    att utföra sådana transaktioner som de vet eller misstänker har samband med vinning
    av brottslig verksamhet eller med finansiering av terrorism, tills de har överlämnat
    en rapport i enlighet med artikel 69.1 första stycket a och följt alla ytterligare
    specifika instruktioner från finansunderrättelseenheten eller annan behörig myndighet
    i enlighet med tillämplig lagstiftning. Ansvariga enheter får utföra transaktionen
    i fråga efter att ha bedömt riskerna med att gå vidare med transaktionen om de
    inte har fått instruktioner om motsatsen från finansunderrättelseenheten inom
    tre arbetsdagar från det att rapporten har överlämnats. 2. När det inte är möjligt
    för en ansvarig enhet att avstå från att utföra en transaktion som avses i punkt
    1 eller om ett avstående sannolikt skulle motverka försök att efterforska dem
    som gynnas av en misstänkt transaktion, ska de ansvariga enheterna omedelbart
    efter att ha utfört transaktionen informera finansunderrättelseenheten. Artikel
    72
  delkrav: []
