- id: Artikel 67
  status: aterstaende
  motivering: Inventerad artikel. Juridisk relevans och delkrav återstår; svenska
    motsvarigheter får inte antas identiska.
  motsvarigheter: []
  text: Utländska juridiska enheter och utländska juridiska konstruktioner 1. Juridiska
    enheter som är skapade utanför unionen och förvaltare av uttryckliga truster eller
    personer som innehar en likvärdig ställning i en liknande juridisk konstruktion
    som förvaltas utanför unionen eller som är bosatta eller etablerade utanför unionen
    ska lämna in uppgifter om verkligt huvudmannaskap enligt artikel 62 till det centrala
    registret i den medlemsstat där de a) ingår en affärsförbindelse med en ansvarig
    enhet, b) förvärvar fast egendom i unionen, antingen direkt eller genom mellanhänder,
    c) direkt eller genom mellanhänder förvärvar någon av nedanstående varor från
    en person som handlar enligt artikel 3.3 f och j i samband med en enstaka transaktion
    i) motorfordon för icke-kommersiella ändamål till ett pris på minst 250 000 EUR
    eller motsvarande belopp i nationell valuta, ii) vattenfarkost för icke-kommersiella
    ändamål till ett pris på minst 7 500 000 EUR eller motsvarande belopp i nationell
    valuta, eller iii) luftfartyg för icke-kommersiella ändamål till ett pris på minst
    7 500 000 EUR eller motsvarande belopp i nationell valuta, d) tilldelas ett offentligt
    kontrakt för varor eller tjänster eller koncessioner av en upphandlande myndighet
    i unionen. 2. Genom undantag från punkt 1 a, om juridiska enheter som är skapade
    utanför unionen ingår en affärsförbindelse med en ansvarig enhet, ska de endast
    lämna in sina uppgifter om verkligt huvudmannaskap till det centrala registret
    när a) de ingår en affärsförbindelse med en ansvarig enhet som är förknippad med
    en medelhög eller hög risk för penningtvätt och finansiering av terrorism enligt
    riskbedömningen på unionsnivå eller den nationella riskbedömningen av den berörda
    medlemsstaten enligt artiklarna 7 och 8 i direktiv (EU) 2024/1640. b) det i riskbedömningen
    på unionsnivå eller nationella riskbedömningen av den berörda medlemsstaten fastställs
    att den juridiska enhetens kategori eller den sektor inom vilken den juridiska
    enhet som är skapad utanför unionen är verksam, i förekommande fall, är förknippad
    med en medelhög eller hög risk för penningtvätt eller finansiering av terrorism.
    3. Uppgifterna om verkligt huvudmannaskap ska åtföljas av en förklaring om vilka
    av dessa verksamheter som uppgifterna handlar om och alla relevanta dokument,
    och ska lämnas in a) för de fall som avses i punkt 1 a, innan affärsförbindelsen
    inleds, b) för de fall som avses i punkt 1 b och c, innan köpet slutförs, c) för
    de fall som avses i punkt 1 d, innan avtalet undertecknas. 4. Vid tillämpning
    av punkt 1 a ska de ansvariga enheterna informera de juridiska enheterna om huruvida
    villkoren som fastställs i punkt 2 är uppfyllda och kräva ett intyg om bevis på
    registrering eller ett utdrag ur de uppgifter om verkligt huvudmannaskap som finns
    i det centrala registret för att fortsätta med affärsförbindelsen eller den enstaka
    transaktionen. 5. I de fall som omfattas av punkt 1 ska juridiska enheter som
    är skapade utanför unionen och förvaltare av uttryckliga truster eller personer
    som innehar en likvärdig ställning i en liknande juridisk konstruktion som förvaltas
    utanför unionen eller som är bosatta eller etablerade utanför unionen rapportera
    alla ändringar av de uppgifter om verkligt huvudmannaskap som lämnats till det
    centrala registret enligt punkt 1 utan onödigt dröjsmål och under alla omständigheter
    inom 28 kalenderdagar därefter. Kraven i första stycket ska tillämpas a) för de
    fall som avses i punkt 1 a, så länge affärsförbindelsen med den ansvariga enheten
    varar, b) för de fall som avses i punkt 1 b, så länge den juridiska enheten eller
    den juridiska konstruktionen äger fastigheten, c) för de fall som avses i punkt
    1 c, för perioden mellan det första inlämnandet av informationen till det centrala
    registret och slutförandet av köpet, d) för de fall som avses i punkt 1 d, under
    hela avtalstiden. 6. Om den juridiska enheten, förvaltaren av den uttryckliga
    trusten eller den person som innehar en likvärdig ställning i en liknande juridisk
    konstruktion uppfyller de villkor som anges i punkt 1 i olika medlemsstater ska
    ett bevis på registrering av uppgifter om verkligt huvudmannaskap i ett centralt
    register som innehas av en medlemsstat anses vara tillräckligt bevis för registrering.
    7. Om, senast den 10 juli 2027, juridiska enheter som är skapade utanför unionen
    eller juridiska konstruktioner som förvaltas utanför unionen eller vars förvaltare
    eller person som innehar en likvärdig ställning i en liknande juridisk konstruktion
    är bosatt eller etablerad utanför unionen äger fast egendom, antingen direkt eller
    genom mellanhänder, ska uppgifterna om verkligt huvudmannaskap för dessa juridiska
    enheter och juridiska konstruktioner lämnas in till det centrala registret och
    åtföljas av en motivering till inlämningen senast den 10 januari 2028. Första
    stycket ska dock inte tillämpas på juridiska enheter eller juridiska konstruktioner
    som har förvärvat fast egendom i unionen före den 1 januari 2014. Medlemsstaterna
    får besluta, på grundval av risken, att ett tidigare datum ska tillämpas och underrätta
    kommissionen om detta. Kommissionen ska informera de övriga medlemsstaterna om
    sådana beslut. 8. Medlemsstaterna får, på grundval av risken, utvidga den skyldighet
    som anges i punkt 1 a till affärsförbindelser med utländska juridiska enheter
    som pågår den 10 juli 2027 och underrätta kommissionen om detta. Kommissionen
    ska informera de övriga medlemsstaterna om sådana beslut. Artikel 68
