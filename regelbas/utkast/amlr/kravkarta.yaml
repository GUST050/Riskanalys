  text: 'Identifiering av affärsförbindelsens eller den enstaka transaktionens syfte
    och avsedda natur Innan en ansvarig enhet ingår en affärsförbindelse eller utför
    en enstaka transaktion ska den ansvariga enheten försäkra sig om att den förstår
    dess syfte och avsedda form. För detta ändamål ska den ansvariga enheten vid behov
    inhämta information om följande: a) Syftet med och det ekonomiska motivet för
    den enstaka transaktionen eller affärsförbindelsen. b) Uppskattat belopp för de
    planerade aktiviteterna. c) Medlens ursprung. d) Medlens destination. e) Kundens
    näringsverksamhet eller yrke. Vid tillämpning av första stycket a i denna artikel
    ska ansvariga enheter som omfattas av artikel 74 samla in information för att
    avgöra om den avsedda användningen av varor med högt värde som avses i den artikeln
    har kommersiellt eller icke-kommersiellt syfte. Artikel 26'
  delkrav: []
