  text: 'Undantag för vissa professionella fotbollsklubbar 1. Medlemsstaterna får
    besluta att helt eller delvis undanta professionella fotbollsklubbar som deltar
    i den nationella fotbollsligans högsta division och som under vart och ett av
    de två föregående kalenderåren har haft en total årsomsättning på mindre än 5
    000 000 EUR, eller motsvarande belopp i nationell valuta, från kraven i denna
    förordning baserat på den bevisat låga risk som dessa professionella fotbollsklubbar
    utgör på grund av verksamhetens karaktär och omfattning. Medlemsstaterna får besluta
    att helt eller delvis undanta professionella fotbollsklubbar som deltar i en division
    som är lägre än den nationella fotbollsligans högsta division från kraven i denna
    förordning baserat på den bevisat låga risk som dessa professionella fotbollsklubbar
    utgör på grund av verksamhetens karaktär och omfattning. 2. Med avseende på tillämpningen
    av punkt 1 ska medlemsstaterna göra en riskbedömning av de professionella fotbollsklubbarna
    där följande ska bedömas: a) Hot om penningtvätt och finansiering av terrorism
    samt sårbarheter och begränsande faktorer hos de professionella fotbollsklubbarna.
    b) De risker som är kopplade till transaktionernas storlek och gränsöverskridande
    karaktär. När medlemsstaterna gör de riskbedömningar som avses i första stycket
    i denna punkt ska de ta hänsyn till resultaten av de riskbedömningar på unionsnivå
    som kommissionen gjort i enlighet med artikel 7 i direktiv (EU) 2024/1640. 3.
    Medlemsstaterna ska inrätta en riskbaserad övervakningsverksamhet eller vidta
    andra lämpliga åtgärder för att säkerställa att undantag som beviljas genom beslut
    enligt denna artikel inte missbrukas. Artikel 6'
  delkrav: []
