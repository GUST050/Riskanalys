  text: Anonyma konton, innehavaraktier och teckningsoptioner för innehavaraktier
    1. Kreditinstitut, finansiella institut och leverantörer av kryptotillgångstjänster
    ska vara förbjudna att föra anonyma bank- och betalkonton, utfärda anonyma motböcker,
    tillhandahålla anonyma bankfack eller anonyma konton för kryptotillgångar samt
    andra konton som på annat sätt möjliggör avidentifiering av innehavare av kundkonto
    eller anonymisering eller ökat döljande av transaktioner, inbegripet genom anonymitetsstärkande
    mynt. Ägare och förmånstagare till befintliga anonyma bank- eller betalningskonton,
    anonyma motböcker, anonyma bankfack som innehas av kreditinstitut eller finansiella
    institut, eller konton för kryptotillgångar ska omfattas av åtgärder för kundkännedom
    innan dessa konton, motböcker eller bankfack används på något sätt. 2. Kreditinstitut
    och finansiella institut som agerar som inlösare i den mening som avses i artikel
    2.1 i Europaparlamentets och rådets förordning (EU) 2015/751 ( 46 ) får inte godta
    betalningar som görs med anonyma förbetalda kort som utfärdats i tredjeländer,
    om inte annat föreskrivs i de tekniska standarder för tillsyn som kommissionen
    antagit i enlighet med artikel 28 i den här förordningen på grundval av en bevisat
    låg risk. 3. Bolag ska vara förbjudna att emittera innehavaraktier och ska omvandla
    alla befintliga innehavaraktier till registrerade aktier, immobilisera dem i den
    mening som avses i artikel 2.1.3 i förordning (EU) nr 909/2014 eller deponera
    dem hos ett finansiellt institut senast den 10 juli 2029. Bolag med värdepapper
    som är noterade på en reglerad marknad eller vars aktier är emitterade som förmedlade
    värdepapper, antingen genom immobilisering i den mening som avses i artikel 2.1.3
    i den förordningen eller genom direkt emission i dematerialiserad form i den mening
    som avses i artikel 2.1.4 i den förordningen, ska dock ha rätt att emittera nya
    aktier och behålla befintliga innehavaraktier. När det gäller befintliga innehavaraktier
    som inte konverterats, immobiliserats eller deponerats senast den 10 juli 2029
    ska alla rösträtter och utdelningsrätter som är knutna till dessa aktier automatiskt
    upphävas tills de konverteras, immobiliseras eller deponeras. Alla sådana aktier
    som inte konverterats, immobiliserats eller deponerats senast den 10 juli 2030
    ska annulleras, vilket leder till en minskning av aktiekapitalet med motsvarande
    belopp. Bolag ska vara förbjudna att utfärda teckningsoptioner för innehavaraktier
    som inte är i förmedlad form. Artikel 80
