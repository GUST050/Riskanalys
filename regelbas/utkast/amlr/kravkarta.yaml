  text: 'Undantag för vissa tillhandahållare av speltjänster 1. Medlemsstaterna får
    besluta att helt eller delvis undanta tillhandahållare av speltjänster från kraven
    i denna förordning, på grundval av belägg för att sådana tjänster på grund av
    att verksamhetens karaktär och, i förekommande fall, omfattning utgör en låg risk.
    Detta undantag ska inte vara tillämpligt på a) kasinon, b) tillhandahållare av
    speltjänster vars huvudsakliga verksamhet är att tillhandahålla onlinespeltjänster
    eller tjänster för vadhållning inom sport, med undantag för i) onlinespeltjänster
    som drivs av staten, antingen genom en offentlig myndighet eller ett företag eller
    organ som kontrolleras av staten, ii) onlinespeltjänster vars organisation, drift
    och förvaltning regleras av staten. 2. Med avseende på tillämpningen av punkt
    1 ska medlemsstaterna göra en riskbedömning för speltjänster där följande ska
    bedömas: a) Hot om penningtvätt och finansiering av terrorism samt sårbarheter
    och begränsande faktorer hos speltjänsterna. b) De risker som transaktionernas
    storlek och de betalningsmetoder som används medför. c) Det geografiska område
    där speltjänsterna tillhandahålls, inbegripet deras gränsöverskridande dimension
    och tillgänglighet från andra medlemsstater eller tredjeländer. När medlemsstaterna
    gör de riskbedömningar som avses i första stycket i denna punkt ska de ta hänsyn
    till resultaten av den riskbedömning på unionsnivå som kommissionen gjort enligt
    artikel 7 i direktiv (EU) 2024/1640. 3. Medlemsstaterna ska inrätta en riskbaserad
    övervakningsverksamhet eller vidta andra lämpliga åtgärder för att säkerställa
    att undantag som beviljas enligt denna artikel inte missbrukas. Artikel 5'
  delkrav: []
