  text: Anmälan av gränsöverskridande verksamheter och tillämpning av nationell rätt
    1. Ansvariga enheter som för första gången vill bedriva verksamhet på en annan
    medlemsstats territorium ska göra en anmälan till sina hemmedlemsstaters tillsynsorgan
    om den verksamhet de avser att bedriva i den andra medlemsstaten. Denna anmälan
    ska göras så snart som den ansvariga enheten vidtar åtgärder för att bedriva denna
    verksamhet och, när det gäller etableringar, åtminstone tre månader innan den
    verksamheten r inleds. Ansvariga enheter ska omedelbart anmäla till sina hemmedlemsstaters
    tillsynsorgan när denna verksamhet inleds i den andra medlemsstaten. Första stycket
    ska inte tillämpas på ansvariga enheter som omfattas av särskilda anmälningsförfaranden
    för utövande av etableringsfriheten och friheten att tillhandahålla tjänster enligt
    andra unionsrättsakter eller om den ansvariga enheten omfattas av särskilda tillståndskrav
    för att bedriva verksamhet på den andra medlemsstatens territorium. 2. Varje planerad
    ändring av den information som meddelats enligt punkt 1 ska den ansvariga enheten
    meddela till tillsynsorganet i hemmedlemsstaten minst en månad innan ändringen
    görs. 3. Om denna förordning gör det möjligt för medlemsstaterna att anta ytterligare
    regler som är tillämpliga på ansvariga enheter ska ansvariga enheter uppfylla
    de nationella reglerna i den medlemsstat där de är etablerade. 4. Om ansvariga
    enheter driver etableringar i flera medlemsstater ska de säkerställa att varje
    etablering tillämpar reglerna i de medlemsstater där den är belägen. 5. Om de
    ansvariga enheter som avses i artikel 38.1 i direktiv (EU) 2024/1640 bedriver
    verksamhet i andra medlemsstater än den där de är etablerade genom ombud, distributörer
    eller genom andra typer av infrastruktur som är belägen i dessa andra medlemsstater
    enligt friheten att tillhandahålla tjänster, ska de tillämpa bestämmelserna i
    de medlemsstater där de tillhandahåller tjänster i samband med denna verksamhet,
    såvida inte artikel 38.2 i det direktivet är tillämplig, i vilket fall de ska
    tillämpa reglerna i den medlemsstat där deras huvudkontor är beläget. 6. Om ansvariga
    enheter är skyldiga att utse en central kontaktpunkt enligt artikel 41 i direktiv
    (EU) 2024/1640 ska de säkerställa att den centrala kontaktpunkten kan säkerställa
    efterlevnad av tillämplig rätt på den ansvariga enhetens vägnar. KAPITEL II ANSVARIGA
    ENHETERS INTERNA RIKTLINJER, FÖRFARANDEN OCH KONTROLLER AVSNITT 1 Interna riktlinjer,
    förfaranden och kontroller, riskbedömning och personal Artikel 9
