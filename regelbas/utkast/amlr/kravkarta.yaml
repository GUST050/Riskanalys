  motsvarigheter: []
  text: Verkligt huvudmannaskap genom ägarintresse 1. Vid tillämpning av artikel 51
    första stycket a avses med ägarintresse i företaget direkt eller indirekt ägande
    av minst 25 % av aktierna eller rösträtterna eller annat ägarintresse i företaget,
    inbegripet rätt till en andel av vinsten, andra interna resurser eller likvidationsbalans.
    Det indirekta ägandet ska beräknas genom att de aktier eller rösträtter eller
    andra ägarintressen som innehas av de förmedlande enheterna i kedjan av enheter
    i vilka den verkliga huvudmannen innehar aktier eller rösträtter multipliceras
    och genom att resultaten från dessa olika kedjor adderas, såvida inte artikel
    54 är tillämplig. Vid bedömningen av om det finns ett ägarintresse i företaget
    ska alla aktieinnehav på varje ägarnivå beaktas. 2. Om medlemsstaterna enligt
    artikel 8.4 c i direktiv (EU) 2024/1640 identifierar kategorier av företag som
    är utsatta för högre risk för penningtvätt och finansiering av terrorism, inbegripet
    på grundval av de sektorer där de är verksamma, ska de informera kommissionen
    om detta. Senast den 10 juli 2029 ska kommissionen bedöma huruvida de risker som
    är förknippade med dessa kategorier av juridiska enheter är relevanta för den
    inre marknaden och, om den drar slutsatsen att ett lägre tröskelvärde är lämpligt
    för att minska dessa risker, anta delegerade akter i enlighet med artikel 85 för
    att ändra denna förordning genom att identifiera a) de kategorier av företag som
    är förknippade med högre risker för penningtvätt och finansiering av terrorism
    och för vilka ett lägre tröskelvärde ska gälla och b) de dithörande tröskelvärdena.
    Det lägre tröskelvärde som avses i första stycket ska fastställas till högst 15
    % av ägarintresset i företaget, såvida inte kommissionen, på grundval av risken,
    drar slutsatsen att ett högre tröskelvärde skulle vara mer proportionerligt, vilket
    under alla omständigheter ska vara lägre än 25 %. 3. Kommissionen ska regelbundet
    se över den delegerade akt som avses i punkt 2 för att säkerställa att den identifierar
    de relevanta kategorier av företag som är förknippade med högre risk och att de
    dithörande tröskelvärdena står i proportion till dessa risker. 4. När det gäller
    andra juridiska enheter än företag, för vilka det med hänsyn till deras form och
    struktur inte är lämpligt eller möjligt att beräkna ägande, ska de verkliga huvudmännen
    vara de fysiska personer som, direkt eller indirekt, på annat sätt kontrollerar
    den juridiska enheten enligt artikel 53.3 och 53.4, utom när artikel 57 är tillämplig.
    Artikel 53
  delkrav: []
