  text: Riktlinjer om risker, trender och metoder i samband med penningtvätt och finansiering
    av terrorism 1. Senast den 10 juli 2027 ska Amla utfärda riktlinjer som anger
    de risker, trender och metoder i samband med penningtvätt och finansiering av
    terrorism som involverar geografiska områden utanför unionen och som ansvariga
    enheter är utsatta för. Amla ska särskilt beakta de riskfaktorer som förtecknas
    i bilaga III. Om situationer med högre risk identifieras ska riktlinjerna omfatta
    skärpta åtgärder för kundkännedom som ansvariga enheter ska överväga att tillämpa
    för att minska sådana risker. 2. Amla ska se över de riktlinjer som avses i punkt
    1 åtminstone vartannat år. 3. Vid utfärdandet och översynen av de riktlinjer som
    avses i punkt 1 ska Amla ta hänsyn till utvärderingar, bedömningar och rapporter
    från unionens institutioner, organ och byråer, internationella organisationer
    och normgivare med befogenheter på området för förhindrande av penningtvätt och
    bekämpning av finansiering av terrorism. AVSNITT 3 Förenklade krav på kundkännedom
    Artikel 33
