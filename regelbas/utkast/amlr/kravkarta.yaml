  text: Information till finansunderrättelseenheten Om en ansvarig enhet eller en
    anställd eller en styrelseledamot vid en sådan ansvarig enhet i god tro röjer
    uppgifter till finansunderrättelseenheten i enlighet med artiklarna 69 och 70
    ska detta inte innebära en överträdelse av någon regel om tystnadsplikt som följer
    av avtal, lag eller annan författning och detta ska inte medföra ansvar för den
    ansvariga enheten eller dess styrelseledamöter eller anställda, även under omständigheter
    där de inte var medvetna om den exakta bakomliggande brottsliga verksamheten och
    oavsett om någon olaglig verksamhet faktiskt förekom. Artikel 73
  delkrav: []
- id: Artikel 73
  status: aterstaende
  motivering: Inventerad artikel. Juridisk relevans och delkrav återstår; svenska
    motsvarigheter får inte antas identiska.
  motsvarigheter: []
  text: Förbud mot röjande av uppgifter 1. Ansvariga enheter samt deras styrelseledamöter,
    anställda eller personer i jämförbara ställningar, inbegripet ombud och distributörer,
    får inte för berörd kund eller annan tredje person röja att transaktioner eller
    verksamhet bedöms eller har bedömts i enlighet med artikel 69, att uppgifter vidarebefordras,
    kommer att vidarebefordras eller har vidarebefordrats i enlighet med artiklarna
    69 eller 70, eller att en analys avseende penningtvätt eller finansiering av terrorism
    pågår eller kan komma att utföras. 2. Punkt 1 ska inte tillämpas när det gäller
    röjande av uppgifter till behöriga myndigheter och till självreglerande organ
    om de utför tillsynsuppgifter eller när det gäller röjande av uppgifter i syfte
    att utreda och lagföra penningtvätt, finansiering av terrorism och annan brottslig
    verksamhet. 3. Genom undantag från punkt 1 i denna artikel får uppgifter lämnas
    mellan ansvariga enheter som tillhör samma koncern, eller mellan sådana enheter
    och deras filialer och dotterföretag belägna i tredjeländer, förutsatt att dessa
    filialer och dotterföretag helt och hållet följer koncernens riktlinjer och förfaranden,
    inbegripet förfaranden för informationsutbyte inom koncernen, i enlighet med artikel
    16, och att koncernens riktlinjer och förfaranden uppfyller de krav som fastställs
    i detta direktiv. 4. Genom undantag från punkt 1 i denna artikel får uppgifter
    lämnas mellan de ansvariga enheter som avses i artikel 3.3 a och b, eller enheter
    från tredjeländer som tillämpar krav som är likvärdiga med dem som fastställs
    i denna förordning, och som bedriver sin yrkesverksamhet som anställda eller inte
    inom samma juridiska person eller en större struktur som personen tillhör och
    som har gemensamt ägande, gemensam ledning eller gemensam efterlevnadskontroll,
    inbegripet nätverk eller partnerskap. 5. För sådana ansvariga enheter som avses
    i artikel 3.1, 3.2, 3.3 a och b, i fall som avser samma transaktion som omfattar
    två eller fler ansvariga enheter, och genom undantag från punkt 1 i den här artikeln,
    får uppgifter lämnas mellan berörda ansvariga enheter, förutsatt att de är belägna
    i unionen, eller enheter i ett tredjeland som tillämpar krav som är likvärdiga
    med dem som fastställs i denna förordning och att de omfattas av krav i fråga
    om tystnadsplikt och skydd av personuppgifter. 6. Om de ansvariga enheter som
    avses i artikel 3.3 a och b försöker avråda en kund från att begå olagligheter,
    får detta inte betraktas som röjande av uppgifter i den mening som avses i punkt
    1 i denna artikel. Artikel 74
