  motsvarigheter: []
  text: 'Motåtgärder för att minska penningtvätts- och terrorismfinansieringshot från
    länder utanför unionen Vid tillämpningen av artiklarna 29 och 31 får kommissionen
    välja bland följande motåtgärder: a) Motåtgärder som ansvariga enheter ska tillämpa
    på personer och juridiska enheter som involverar högrisktredjeländer och, i förekommande
    fall, andra länder som utgör ett hot mot unionens finansiella system: i) Tillämpning
    av ytterligare skärpta åtgärder för kundkännedom. ii) Införande av relevanta förbättrade
    rapporteringsmekanismer, eller systematisk rapportering, av finansiella transaktioner.
    iii) Begränsning av affärsförbindelser eller transaktioner med fysiska personer
    eller juridiska enheter från sådana tredjeländer. b) Motåtgärder som medlemsstaterna
    ska tillämpa när det gäller högrisktredjeländer och, i förekommande fall, andra
    länder som utgör ett hot mot unionens finansiella system: i) Vägra upprättandet
    av dotterföretag, filialer eller representationskontor för ansvariga enheter från
    det berörda landet, eller på annat sätt ta hänsyn till att den relevanta ansvariga
    enheten är från ett tredjeland som inte har tillfredsställande system för bekämpning
    av penningtvätt och finansiering av terrorism. ii) Förbjuda ansvariga enheter
    att upprätta filialer eller representationskontor i det berörda tredjelandet,
    eller på annat sätt ta hänsyn till att relevant filial eller representationskontor
    skulle finnas i ett tredjeland som inte har tillfredsställande system för bekämpning
    av penningtvätt och finansiering av terrorism. iii) Kräva förstärkt tillsynsgranskning
    eller skärpta krav på extern revision för filialer och dotterföretag för ansvariga
    enheter belägna i det berörda tredjelandet. iv) Kräva skärpta krav på extern revision
    av finanskoncerner när det gäller samtliga deras filialer och dotterföretag i
    det berörda tredjelandet. v) Kräva att kreditinstitut och finansiella institut
    undersöker, ändrar eller, om nödvändigt, avbryter korrespondentförbindelser med
    motpartsinstitut i det berörda tredjelandet. Artikel 36'
