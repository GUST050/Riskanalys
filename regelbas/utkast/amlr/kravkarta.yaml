  text: Samarbete mellan finansunderrättelseenheter och Eppo 1. Enligt artikel 24
    i förordning (EU) 2017/1939 ska varje finansunderrättelseenhet utan onödigt dröjsmål
    till Eppo rapportera resultaten av sina analyser och all ytterligare relevant
    information om det finns rimliga skäl att misstänka att penningtvätt och annan
    brottslig verksamhet bedrivs eller har bedrivits för vilken Eppo skulle kunna
    utöva sin behörighet i enlighet med artiklarna 22, 25.2 och 25.3 i den förordningen.
    Senast den 10 juli 2026 ska Amla i samråd med Eppo utarbeta förslag till tekniska
    standarder för genomförande och överlämna dem till kommissionen för antagande.
    Dessa förslag till tekniska standarder för genomförande ska ange det format som
    finansunderrättelseenheterna ska använda för rapportering av information till
    Eppo. Kommissionen ges befogenhet att anta de tekniska standarder för genomförande
    som avses i andra stycket i denna punkt i enlighet med artikel 53 i förordning
    (EU) 2024/1620. 2. Finansunderrättelseenheterna ska i god tid besvara Eppos begäranden
    om information om penningtvätt och annan brottslig verksamhet enligt punkt 1.
    3. Finansunderrättelseenheter och Eppo får utbyta resultaten av strategiska analyser,
    inbegripet typologier och riskindikatorer, om sådana analyser rör penningtvätt
    och annan brottslig verksamhet enligt punkt 1. Artikel 82
