  text: 'Åtgärder för att minska riskerna i samband med transaktioner med fristående
    adresser 1. Leverantörer av kryptotillgångstjänster ska identifiera och bedöma
    risken för penningtvätt och finansiering av terrorism i samband med överföringar
    av kryptotillgångar som riktas till eller härrör från en fristående adress. Leverantörer
    av kryptotillgångstjänster ska därför ha infört interna riktlinjer, förfaranden
    och kontroller för detta ändamål. Leverantörer av kryptotillgångstjänster ska
    tillämpa riskreducerande åtgärder som står i proportion till de identifierade
    riskerna. Dessa riskreducerande åtgärder ska inbegripa en eller flera av följande
    åtgärder: a) Vidta riskbaserade åtgärder för att identifiera och kontrollera identiteten
    på avsändaren eller mottagaren av en överföring till eller från en fristående
    adress eller avsändarens eller mottagarens verkliga huvudman, inbegripet genom
    utnyttjande av tredje parter. b) Kräva ytterligare information om kryptotillgångarnas
    ursprung och destination. c) Genomföra en skärpt fortlöpande övervakning av transaktioner
    med en fristående adress. d) Alla andra åtgärder för att minska och hantera riskerna
    för penningtvätt och finansiering av terrorism samt risken för att riktade ekonomiska
    sanktioner kringgås eller inte genomförs. 2. Senast den 10 juli 2027 ska Amla
    utfärda riktlinjer för att specificera vilka åtgärder som avses i punkt 1, inbegripet
    a) kriterier och medel för identifiering och kontroll av identiteten på avsändaren
    eller mottagaren av en överföring från eller till en fristående adress, inbegripet
    genom utnyttjande av tredje parter, med beaktande av den senaste tekniska utvecklingen,
    b) kriterier och medel för kontroll av huruvida den fristående adressen ägs eller
    kontrolleras av en kund. Artikel 41'
  delkrav: []
