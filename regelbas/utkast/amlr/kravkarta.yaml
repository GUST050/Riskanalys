  text: Samtidig förekomst av ägarintresse och kontroll i ägarstrukturen Om företag
    ägs genom en ägarstruktur med flera nivåer och ägarintresset och kontrollen förekommer
    samtidigt i förhållande till olika nivåer i kedjan i en eller flera kedjor i den
    strukturen, ska den eller de verkliga huvudmännen vara a) de fysiska personer
    som, direkt eller indirekt, genom ägarintresse eller på annat sätt kontrollerar
    juridiska enheter som, antingen enskilt eller sammanlagt, har ett direkt ägarintresse
    i företaget, b) de fysiska personer som, antingen enskilt eller sammanlagt, direkt
    eller indirekt, har ett ägarintresse i det företag som genom ägarintresse eller
    på annat sätt, direkt eller indirekt, kontrollerar företaget. Artikel 55
  delkrav: []
