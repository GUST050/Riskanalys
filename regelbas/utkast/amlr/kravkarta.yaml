  motsvarigheter: []
  text: 'Allmänna bestämmelser om utnyttjande av andra ansvariga enheters åtgärder
    för kundkännedom 1. Ansvariga enheter får utnyttja andra ansvariga enheter, oavsett
    om de är belägna i en medlemsstat eller i ett tredjeland, för att uppfylla de
    krav på åtgärder för kundkännedom som föreskrivs i artikel 20.1 a, b och c, förutsatt
    att a) de andra ansvariga enheterna tillämpar de krav på åtgärder för kundkännedom
    och på dokumentation som fastställs i denna förordning, eller som är likvärdiga
    med dessa om de andra ansvariga enheterna är bosatta eller etablerade i ett tredjeland,
    b) de andra ansvariga enheternas iakttagande av kraven på bekämpning av penningtvätt
    och finansiering av terrorism övervakas i överensstämmelse med kapitel IV i direktiv
    (EU) 2024/1640. Det slutliga ansvaret för att uppfylla kraven på åtgärder för
    kundkännedom ska kvarstå hos den ansvariga enhet som med avseende sådana åtgärder
    utnyttjar en annan ansvarig enhet. 2. Vid beslut om att utnyttja andra ansvariga
    enheter belägna i tredjeländer ska ansvariga enheter beakta de geografiska riskfaktorer
    som förtecknas i bilagorna II och III och all relevant information eller vägledning
    som tillhandahålls av kommissionen eller av Amla eller andra behöriga myndigheter.
    3. När det gäller ansvariga enheter som ingår i en koncern får efterlevnaden av
    kraven i denna artikel och i artikel 49 säkerställas genom koncernövergripande
    riktlinjer, förfaranden och kontroller, under förutsättning att samtliga följande
    villkor är uppfyllda: a) Den ansvariga enheten utnyttjar enbart uppgifter som
    lämnats av en ansvarig enhet som ingår i samma koncern. b) Koncernen tillämpar
    riktlinjer och förfaranden för bekämpning av penningtvätt och finansiering av
    terrorism, åtgärder för kundkännedom och regler om dokumentation som är helt i
    överensstämmelse med denna förordning eller med likvärdiga regler i tredjeländer.
    c) Det faktiska genomförandet av de krav som avses i led b i denna punkt övervakas
    på koncernnivå av tillsynsmyndigheten i hemmedlemsstaten i enlighet med kapitel
    IV i direktiv (EU) 2024/1640 eller i tredjelandet i enlighet med reglerna i det
    tredjelandet. 4. Ansvariga enheter får inte utnyttja ansvariga enheter som är
    etablerade i tredjeländer som identifierats enligt avsnitt 2 i detta kapitel.
    Ansvariga enheter som är etablerade i unionen och vars filialer och dotterföretag
    är etablerade i dessa tredjeländer får dock utnyttja dessa filialer och dotterföretag
    om samtliga villkor som fastställs i punkt 3 är uppfyllda. Artikel 49'
  delkrav: []
