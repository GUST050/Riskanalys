  text: 'Tröskelvärdesbaserade rapporter om transaktioner med vissa varor av högt
    värde 1. Personer som handlar med varor av högt värde ska till finansunderrättelseenheten
    rapportera alla transaktioner som inbegriper försäljning av följande varor av
    högt värde när dessa varor förvärvas för icke-kommersiella ändamål: a) Motorfordon
    för icke-kommersiella ändamål till ett pris av minst 250 000 EUR eller motsvarande
    belopp i nationell valuta. b) Vattenfarkoster till ett pris av minst 7 500 000
    EUR eller motsvarande belopp i nationell valuta. c) Luftfartyg till ett pris av
    minst 7 500 000 EUR eller motsvarande belopp i nationell valuta. 2. Kreditinstitut
    och finansiella institut som tillhandahåller tjänster i samband med köp eller
    överföring av äganderätt till de varor som avses i punkt 1 ska också till finansunderrättelseenheten
    rapportera alla transaktioner som de utför för sina kunder med avseende på dessa
    varor. 3. Rapportering enligt punkterna 1 och 2 ska utföras inom de tidsfrister
    som åläggs av finansunderrättelseenheten. KAPITEL VI INFORMATIONSUTBYTE Artikel
    75'
