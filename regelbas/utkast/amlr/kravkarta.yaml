  text: 'Särskilda bestämmelser för personer i politiskt utsatt ställning 1. Utöver
    de åtgärder för kundkännedom som fastställs i artikel 20 ska ansvariga enheter
    tillämpa följande åtgärder med avseende på enstaka transaktioner eller affärsförbindelser
    med personer i politiskt utsatt ställning: a) Inhämta företagsledningens godkännande
    att utföra enstaka transaktioner eller ingå eller fortsätta att upprätthålla affärsförbindelser
    med personer i politiskt utsatt ställning. b) Vidta lämpliga åtgärder för att
    fastställa varifrån den förmögenhet och de medel kommer som förknippas med affärsförbindelser
    eller enstaka transaktioner med personer i politiskt utsatt ställning. c) Bedriva
    löpande skärpt övervakning av de affärsförbindelserna. 2. Senast den 10 juli 2027
    ska Amla utfärda riktlinjer till ansvariga enheter om följande: a) Kriterierna
    för identifiering av personer som är kända nära medarbetare. b) Den risknivå som
    är förknippad med en viss kategori av personer i politiskt utsatt ställning, familjemedlemmar
    eller personer som är känd nära medarbetare, inklusive vägledning om hur sådana
    risker ska bedömas när personen inte längre har någon viktig offentlig funktion
    med avseende på tillämpningen av artikel 45. Artikel 43'
  delkrav: []
