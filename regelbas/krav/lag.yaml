- id: KRV-PTL-1-6
  kalla: SRC-PTL
  lagrum: 1 kap. 6 §
  lydelser:
  - LYD-PTL-1-6-2017-08-01
  grund: ska_krav
  text: Med penningtvätt avses i denna lag åtgärder med avseende på pengar eller annan
    egendom som härrör från brott eller brottslig verksamhet som 1. kan dölja egendomens
    samband med brott eller brottslig verksamhet, 2. kan främja möjligheterna för
    någon att tillgodogöra sig egendomen eller dess värde, 3. kan främja möjligheterna
    för någon att undandra sig rättsliga påföljder, eller 4. innebär att någon förvärvar,
    innehar, hävdar rätt till eller brukar egendomen. Vid tillämpning av denna lag
    ska med penningtvätt jämställas åtgärder med egendom som typiskt sett är ägnade
    att dölja att någon avser att berika sig eller någon annan genom en framtida brottslig
    handling.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.1
  mal:
  - *id001
  - *id002
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-1-7
  kalla: SRC-PTL
  lagrum: 1 kap. 7 §
  lydelser:
  - LYD-PTL-1-7-2022-07-01
  grund: ska_krav
  text: Med finansiering av terrorism avses i denna lag sådan insamling eller sådant
    mottagande eller tillhandahållande av pengar eller annan egendom som avses i 6
    § terroristbrottslagen (2022:666).
