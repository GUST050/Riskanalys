- id: KRV-PTL-5-7
  kalla: SRC-PTL
  lagrum: 5 kap. 7 §
  lydelser:
  - LYD-PTL-5-7-2017-08-01
  grund: ska_krav
  text: Besked om att personuppgifter behandlas enligt 4 kap. 2, 3 eller 6 § och om
    att sådana uppgifter lagras enligt 3 eller 4 § får inte lämnas ut till den registrerade.
  galler_om:
