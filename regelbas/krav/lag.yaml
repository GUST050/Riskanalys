    status: ej_granskad
- id: KRV-PTL-2-13
  kalla: SRC-PTL
  lagrum: 2 kap. 13 §
  lydelser:
  - LYD-PTL-2-13-2017-08-01
  grund: ska_krav
  text: En verksamhetsutövare ska ha rutiner för att säkerställa lämpligheten hos
    anställda, uppdragstagare och andra som på liknande grund deltar i verksamheten,
    om de utför arbetsuppgifter av betydelse för att förhindra att verksamheten utnyttjas
    för penningtvätt eller finansiering av terrorism.
  galler_om:
    alla: []
  belagg:
  - dokument
  - beslut
  uppfylls_i:
  - D-RR.2
  mal:
  - *id004
  - typ: drift
    id: DRIFT-ORGANISATION
    etapp: M4
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-2-14
  kalla: SRC-PTL
  lagrum: 2 kap. 14 §
  lydelser:
  - LYD-PTL-2-14-2017-08-01
  grund: ska_krav
  text: En verksamhetsutövare ska se till att anställda, uppdragstagare och andra
    som på liknande grund deltar i verksamheten och som utför arbetsuppgifter av betydelse
    för att förhindra att verksamheten utnyttjas för penningtvätt eller finansiering
    av terrorism fortlöpande får relevant utbildning och information för att kunna
    fullgöra verksamhetsutövarens skyldigheter enligt denna lag. Utbildningen ska
    åtminstone avse relevanta delar av innehållet i gällande regelverk, verksamhetsutövarens
    allmänna riskbedömning, rutiner och riktlinjer samt information som ska underlätta
    för personer som avses i första stycket att upptäcka misstänkt penningtvätt och
    finansiering av terrorism.
  galler_om:
    alla: []
  belagg:
  - dokument
  - beslut
  uppfylls_i:
  - D-RR.2
  mal:
  - *id004
  - typ: drift
    id: DRIFT-ORGANISATION
    etapp: M4
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-2-15
  kalla: SRC-PTL
  lagrum: 2 kap. 15 §
  lydelser:
  - LYD-PTL-2-15-2020-01-01
  grund: ska_krav
  text: En verksamhetsutövare ska ha rutiner och vidta de åtgärder i övrigt som behövs
    för att skydda anställda, uppdragstagare och andra som på liknande grund deltar
    i verksamheten från hot, hämnd eller andra fientliga åtgärder till följd av att
    de fullgör verksamhetsutövarens skyldigheter enligt denna lag. En verksamhetsutövare
    får inte utsätta en anställd, en uppdragstagare eller någon annan som på liknande
    grund deltar i verksamheten för repressalier på grund av att denne har informerat
    om misstänkt penningtvätt eller finansiering av terrorism, internt eller till
    Polismyndigheten.
  galler_om:
    alla: []
  belagg:
  - dokument
  - beslut
  uppfylls_i:
  - D-RR.2
  mal:
  - *id004
  - typ: drift
    id: DRIFT-ORGANISATION
    etapp: M4
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-2-16
  kalla: SRC-PTL
  lagrum: 2 kap. 16 §
  lydelser:
  - LYD-PTL-2-16-2021-07-01
  grund: ska_krav
  text: Om en verksamhetsutövare som är en fysisk person driver sin verksamhet som
    anställd hos en juridisk person, ska de krav som avses i 1, 2, 8-12, 14 och 15
    §§ samt 6 kap. 1 och 2 §§ gälla den juridiska personen.
  galler_om:
    alla: []
  belagg:
  - dokument
  - beslut
  uppfylls_i:
  - D-RR.2
  mal:
  - *id004
  - typ: drift
    id: DRIFT-ORGANISATION
    etapp: M4
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-1
  kalla: SRC-PTL
  lagrum: 3 kap. 1 §
  lydelser:
  - LYD-PTL-3-1-2019-11-01
  grund: ska_krav
  text: En verksamhetsutövare får inte etablera eller upprätthålla en affärsförbindelse
    eller utföra en enstaka transaktion, om verksamhetsutövaren inte har tillräcklig
    kännedom om kunden för att kunna 1. hantera risken för penningtvätt eller finansiering
    av terrorism som kan förknippas med kundrelationen, och 2. övervaka och bedöma
    kundens aktiviteter och transaktioner enligt 4 kap. 1 och 2 §§. Första stycket
    gäller inte advokater och advokatbolag, andra oberoende jurister, auktoriserade
    och godkända revisorer samt skatterådgivare, om affärsförbindelsen syftar till
    att försvara eller företräda en klient i fråga om ett rättsligt förfarande, inklusive
    rådgivning för att inleda eller undvika ett rättsligt förfarande, eller till att
    bedöma klientens rättsliga situation.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - *id001
  - &id005
    typ: dokument
    id: D-RR.3
    etapp: M6
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-2
  kalla: SRC-PTL
  lagrum: 3 kap. 2 §
  lydelser:
  - LYD-PTL-3-2-2017-08-01
  grund: ska_krav
  text: En affärsförbindelse får inte etableras om det finns misstanke om att verksamhetsutövarens
    produkter eller tjänster kommer att användas för penningtvätt eller finansiering
    av terrorism.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - *id001
  - *id005
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-3
  kalla: SRC-PTL
  lagrum: 3 kap. 3 §
  lydelser:
  - LYD-PTL-3-3-2017-08-01
  grund: ska_krav
  text: En verksamhetsutövare får inte utföra en transaktion om det på skälig grund
    kan misstänkas att den utgör ett led i penningtvätt eller finansiering av terrorism.
    Om en rapport har lämnats till Polismyndigheten enligt 4 kap. 3 § ska verksamhetsutövaren
    även beakta den information som Polismyndigheten kan lämna om hanteringen av ärendet.
    Om det inte är möjligt att låta bli att utföra en misstänkt transaktion, eller
    om ett avstående från att genomföra transaktionen sannolikt skulle försvåra den
    vidare utredningen, får transaktionen genomföras.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - *id001
  - *id005
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-4
  kalla: SRC-PTL
  lagrum: 3 kap. 4 §
  lydelser:
  - LYD-PTL-3-4-2024-12-30
  grund: ska_krav
  text: En verksamhetsutövare ska vidta åtgärder för kundkännedom vid etableringen
    av en affärsförbindelse. Om verksamhetsutövaren inte har en affärsförbindelse
    med kunden, ska åtgärder för kundkännedom vidtas 1. vid enstaka transaktioner
    som uppgår till ett belopp motsvarande 15 000 euro eller mer, 2. vid transaktioner
    som understiger ett belopp motsvarande 15 000 euro och som verksamhetsutövaren
    inser eller borde inse har samband med en eller flera andra transaktioner och
    som tillsammans uppgår till minst detta belopp, och 3. vid utförandet av sådana
    överföringar av medel eller kryptotillgångar som avses i artikel 3.9 i Europaparlamentets
    och rådets förordning (EU) 2023/1113 av den 31 maj 2023 om uppgifter som ska åtfölja
    överföringar av medel och vissa kryptotillgångar och ändring av direktiv (EU)
    2015/849, om överföringen överstiger ett belopp motsvarande 1 000 euro.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - &id006
    typ: kundmall
    id: KM-B
    etapp: M2
  - *id005
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-7
  kalla: SRC-PTL
  lagrum: 3 kap. 7 §
  lydelser:
  - LYD-PTL-3-7-2020-01-01
  grund: ska_krav
  text: En verksamhetsutövare ska identifiera kunden och kontrollera kundens identitet
    genom identitetshandlingar eller registerutdrag eller genom andra uppgifter och
    handlingar från en oberoende och tillförlitlig källa. När första stycket tillämpas
    får man använda medel för elektronisk identifiering och betrodda tjänster enligt
    Europaparlamentets och rådets förordning (EU) nr 910/2014 av den 23 juli 2014
    om elektronisk identifiering och betrodda tjänster för elektroniska transaktioner
    på den inre marknaden och om upphävande av direktiv 1999/93/EG. Andra säkra identifieringsprocesser
    på distans eller på elektronisk väg som är reglerade, erkända, godkända eller
    accepterade av relevanta myndigheter får också användas. Om kunden företräds av
    en person som uppger sig handla på kundens vägnar, ska verksamhetsutövaren kontrollera
    den personens identitet och behörighet att företräda kunden.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - *id006
  - *id005
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-8
  kalla: SRC-PTL
  lagrum: 3 kap. 8 §
  lydelser:
  - LYD-PTL-3-8-2017-08-01
  grund: ska_krav
  text: En verksamhetsutövare ska utreda om kunden har en verklig huvudman. En sådan
    utredning ska åtminstone avse sökning i registret över verkliga huvudmän enligt
    lagen (2017:631) om registrering av verkliga huvudmän. Om kunden är en juridisk
    person, en trust eller en liknande juridisk konstruktion, ska utredningen omfatta
    åtgärder för att förstå kundens ägarförhållanden och kontrollstruktur. Om kunden
    har en verklig huvudman, ska verksamhetsutövaren vidta åtgärder för att kontrollera
    den verkliga huvudmannens identitet. Första stycket gäller inte om kunden är ett
    aktiebolag vars aktier är upptagna till handel på en reglerad marknad i Sverige
    eller inom EES eller på en motsvarande marknad utanför EES eller ett dotterföretag
    till ett sådant bolag. Om kunden är en juridisk person och det efter åtgärder
    enligt första stycket står klart att den juridiska personen inte har en verklig
    huvudman, ska den person som är styrelseordförande, verkställande direktör eller
    motsvarande befattningshavare anses vara verklig huvudman. Detsamma gäller om
    verksamhets- utövaren har anledning att anta att den person som identifierats
    enligt första stycket inte är den verkliga huvudmannen. (2019:1254).
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - *id006
  - *id005
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-8a
  kalla: SRC-PTL
  lagrum: 3 kap. 8 a §
  lydelser:
  - LYD-PTL-3-8a-2020-01-02
  grund: ska_krav
  text: Bestämmelsen i 8 § tredje stycket gäller inte om - kunden är en stat, en region,
    en kommun eller motsvarande, och - den risk som kan förknippas med kunden enligt
    2 kap. 3 § bedöms som låg.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - *id006
  - *id005
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-9
  kalla: SRC-PTL
  lagrum: 3 kap. 9 §
  lydelser:
  - LYD-PTL-3-9-2017-08-01
  grund: ska_krav
  text: Kontroll av kundens och den verkliga huvudmannens identitet ska slutföras
    innan en affärsförbindelse etableras eller en enstaka transaktion utförs. Om det
    är nödvändigt för att inte avbryta verksamhetens normala gång, får identitetskontroll
    med anledning av en ny affärsförbindelse göras senare än enligt första stycket,
    dock senast när affärsförbindelsen etableras. Andra stycket får endast tillämpas
    om risken för penningtvätt eller finansiering av terrorism är låg.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - *id006
  - *id005
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-10
  kalla: SRC-PTL
  lagrum: 3 kap. 10 §
  lydelser:
  - LYD-PTL-3-10-2017-08-01
  grund: ska_krav
  text: En verksamhetsutövare ska bedöma om kunden eller kundens verkliga huvudman
    är en person i politiskt utsatt ställning eller en familjemedlem eller känd medarbetare
    till en sådan person.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - *id006
  - *id005
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-11
  kalla: SRC-PTL
  lagrum: 3 kap. 11 §
  lydelser:
  - LYD-PTL-3-11-2017-08-01
  grund: ska_krav
  text: En verksamhetsutövare ska kontrollera om kunden är etablerad i ett land utanför
    EES som av Europeiska kommissionen har identifierats som ett högrisktredjeland.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - *id006
  - *id005
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-12
  kalla: SRC-PTL
  lagrum: 3 kap. 12 §
  lydelser:
  - LYD-PTL-3-12-2017-08-01
  grund: ska_krav
  text: En verksamhetsutövare ska inhämta information om affärsförbindelsens syfte
    och art. Informationen ska ligga till grund för en bedömning av 1. vilka aktiviteter
    och transaktioner som kunden kan förväntas vidta och genomföra inom ramen för
    affärsförbindelsen, och 2. kundens riskprofil enligt 2 kap. 3 §.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - *id006
  - *id005
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-13
  kalla: SRC-PTL
  lagrum: 3 kap. 13 §
  lydelser:
  - LYD-PTL-3-13-2020-01-01
  grund: ska_krav
  text: En verksamhetsutövare ska löpande och vid behov följa upp pågående affärsförbindelser
    i syfte att säkerställa att kännedomen om kunden enligt 7, 8 och 10-12 §§ är aktuell
    och tillräcklig för att hantera den bedömda risken för penningtvätt eller finansiering
    av terrorism. En verksamhetsutövare som är ett rapporteringsskyldigt finansiellt
    institut ska vidta åtgärder som avses i första stycket även när kontakt måste
    tas med kunden för att fullgöra skyldigheterna att granska finansiella konton
    enligt lagen (2015:911) om identifiering av rapporteringspliktiga konton vid automatiskt
    utbyte av upplysningar om finansiella konton.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - *id006
  - *id005
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-14
  kalla: SRC-PTL
  lagrum: 3 kap. 14 §
  lydelser:
  - LYD-PTL-3-14-2017-08-01
  grund: ska_krav
  text: Åtgärder för kontroll, bedömning och utredning enligt 7, 8 och 10–13 §§ ska
    utföras i den omfattning det behövs med hänsyn till kundens riskprofil och övriga
    omständigheter.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - *id006
  - *id005
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-15
  kalla: SRC-PTL
  lagrum: 3 kap. 15 §
  lydelser:
  - LYD-PTL-3-15-2017-08-01
  grund: ska_krav
  text: Om risken för penningtvätt eller finansiering av terrorism som kan förknippas
    med kundrelationen bedöms som låg, får verksamhetsutövaren tillämpa förenklade
    åtgärder för kundkännedom. Förenklade åtgärder för kundkännedom innebär att kontroller,
    bedömningar och utredningar som följer av 7, 8 och 10–13 §§ kan vara av mer begränsad
    omfattning och vidtas på annat sätt.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - *id006
  - *id005
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-16
  kalla: SRC-PTL
  lagrum: 3 kap. 16 §
  lydelser:
  - LYD-PTL-3-16-2017-08-01
  grund: ska_krav
  text: Om risken för penningtvätt eller finansiering av terrorism som kan förknippas
    med kundrelationen bedöms som hög, ska särskilt omfattande kontroller, bedömningar
    och utredningar enligt 7, 8 och 10–13 §§ göras. Åtgärderna ska i sådant fall kompletteras
    med de ytterligare åtgärder som krävs för att motverka den höga risken för penningtvätt
    eller finansiering av terrorism. Sådana åtgärder kan avse inhämtande av ytterligare
    information om kundens affärsverksamhet eller ekonomiska situation och uppgifter
    om varifrån kundens ekonomiska medel kommer.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - *id006
  - *id005
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-17
  kalla: SRC-PTL
  lagrum: 3 kap. 17 §
  lydelser:
  - LYD-PTL-3-17-2020-01-01
  grund: ska_krav
  text: Skärpta åtgärder enligt 16 § ska vidtas vid affärsförbindelser eller enstaka
    transaktioner när kunden är etablerad i ett land utanför EES som har identifierats
    som ett högrisktredjeland av Europeiska kommissionen. Sådana åtgärder ska åtminstone
    avse skärpning av övervakningen av pågående affärsförbindelser och bedömningen
    av enstaka transaktioner enligt 4 kap. 1 § och omfatta inhämtande av 1. ytterligare
    information om kunden och den verkliga huvudmannen, 2. ytterligare information
    om affärsförbindelsens eller den enstaka transaktionens syfte och art, 3. information
    om kundens och den verkliga huvudmannens ekonomiska situation och varifrån kundens
    och den verkliga huvudmannens ekonomiska medel kommer, och 4. godkännande från
    en behörig beslutsfattare att etablera eller upprätthålla en affärsförbindelse.
    Skärpta åtgärder behöver inte vidtas i förhållande till filialer eller dotterföretag
    till juridiska personer som är etablerade inom EES, om 1. den juridiska personen
    omfattas av denna lag eller motsvarande krav enligt utländsk rätt, 2. risken för
    penningtvätt eller finansiering av terrorism som kan förknippas med kunden inte
    bedöms som hög vid riskbedömning enligt 2 kap. 3 §, och 3. kunden tillämpar rutiner
    som fastställts enligt 2 kap. 8 eller 9 § eller motsvarande krav enligt lagstiftningen
    i det land där kunden finns eller har hemvist.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - *id006
  - *id005
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-19
  kalla: SRC-PTL
  lagrum: 3 kap. 19 §
  lydelser:
  - LYD-PTL-3-19-2017-08-01
  grund: ska_krav
  text: Om kunden eller kundens verkliga huvudman är en person i politiskt utsatt
    ställning, ska en verksamhetsutövare utöver åtgärder enligt 7, 8 och 10–12 §§
    alltid 1. vidta lämpliga åtgärder för att ta reda på varifrån de tillgångar som
    hanteras inom ramen för affärsförbindelsen eller den enstaka transaktionen kommer,
    2. tillämpa skärpt fortlöpande uppföljning av affärsförbindelsen enligt 13 § och
    övervaka aktiviteter och transaktioner enligt 4 kap. 1 § i förhöjd omfattning,
    och 3. inhämta godkännande från behörig beslutsfattare inför beslut om att ingå
    eller avbryta en affärsförbindelse. Första stycket tillämpas också om kunden är
    en familjemedlem eller känd medarbetare till en person i politiskt utsatt ställning.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - *id006
  - *id005
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-20
  kalla: SRC-PTL
  lagrum: 3 kap. 20 §
  lydelser:
  - LYD-PTL-3-20-2017-08-01
  grund: ska_krav
  text: När en person i politiskt utsatt ställning upphör att utöva en offentlig funktion
    enligt 1 kap. 8 § 5, ska 19 § tillämpas i 18 månader. Därefter ska åtgärder enligt
    19 § tillämpas om risken för penningtvätt eller finansiering av terrorism som
    kan förknippas med kundrelationen bedöms som hög. Om åtgärder enligt 19 § inte
    längre ska tillämpas på en person som avses i första stycket, ska sådana åtgärder
    inte heller tillämpas på familjemedlemmar eller kända medarbetare till en person
    i politiskt utsatt ställning.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - *id006
  - *id005
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-21
  kalla: SRC-PTL
  lagrum: 3 kap. 21 §
  lydelser:
  - LYD-PTL-3-21-2017-08-01
  grund: ska_krav
  text: Vid tillämpningen av 7, 8 och 12 §§ får en verksamhetsutövare förlita sig
    på åtgärder som har utförts av en utomstående som anges i 22 §, om verksamhetsutövaren
    utan dröjsmål 1. får del av de uppgifter som den utomstående har inhämtat, och
    2. på begäran kan få del av den dokumentation som ligger till grund för uppgifterna.
    Verksamhetsutövaren svarar för att de åtgärder för kundkännedom som vidtagits
    av utomstående är tillräckliga.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - *id006
  - *id005
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-22
  kalla: SRC-PTL
  lagrum: 3 kap. 22 §
  lydelser:
  - LYD-PTL-3-22-2021-11-10
  grund: ska_krav
  text: Med utomstående enligt 21 § avses 1. fysiska eller juridiska personer med
    verksamhet som anges i 1 kap. 2 § första stycket 1-3, 5-8 och 10-15 eller motsvarande
    verksamhet, auktoriserade eller godkända revisorer och advokater som är etablerade
    inom EES, och 2. fysiska eller juridiska personer med verksamhet som anges i 1
    kap. 2 § första stycket 1-3, 5-8 och 10-15 eller motsvarande verksamhet, auktoriserade
    eller godkända revisorer och advokater som är etablerade utanför EES, om de a)
    tillämpar bestämmelser om kundkännedom och bevarande av handlingar som motsvarar
    kraven i denna lag, och b) står under tillsyn över att dessa bestämmelser följs.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - *id006
  - *id005
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-23
  kalla: SRC-PTL
  lagrum: 3 kap. 23 §
  lydelser:
  - LYD-PTL-3-23-2017-08-01
  grund: ska_krav
  text: En verksamhetsutövare får inte förlita sig på åtgärder för kundkännedom som
    vidtagits av en utomstående med hemvist i ett sådant land utanför EES som av Europeiska
    kommissionen identifierats som ett högrisktredjeland. Första stycket gäller inte
    om den utomstående är filial eller dotterföretag till en juridisk person som anges
    i 22 § 1, om filialen eller dotterföretaget tillämpar gemensamma rutiner som fastställts
    enligt 2 kap. 8 eller 9 § eller motsvarande krav enligt lagstiftningen i det land
    där kunden finns eller har hemvist.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - *id006
  - *id005
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-24
  kalla: SRC-PTL
  lagrum: 3 kap. 24 §
  lydelser:
  - LYD-PTL-3-24-2017-08-01
  grund: ska_krav
  text: Kraven i 21–23 §§ ska inte tillämpas vid utkontraktering, agenturförhållanden
    eller liknande förhållanden där den utomstående tjänsteleverantören, agenten eller
    motsvarande enligt avtal ska anses ingå i verksamhetsutövaren.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - *id006
  - *id005
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-29
  kalla: SRC-PTL
  lagrum: 3 kap. 29 §
  lydelser:
  - LYD-PTL-3-29-2017-08-01
  grund: ska_krav
  text: Om kunden är eller företräder en trust eller liknande juridisk konstruktion
    och trustens eller den juridiska konstruktionens förmånstagare identifieras på
    annat sätt än med namn, ska en verksamhetsutövare säkerställa att förmånstagaren
    kan identifieras senast vid utbetalningstillfället. Förmånstagarens identitet
    ska kontrolleras senast vid utbetalningen av förmånerna eller när förmånstagaren
    gör gällande någon annan förvärvad rättighet.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - *id006
  - *id005
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-3-30
  kalla: SRC-PTL
  lagrum: 3 kap. 30 §
  lydelser:
  - LYD-PTL-3-30-2017-08-01
  grund: ska_krav
  text: Kontroller och åtgärder enligt 29 § ska vidtas i den omfattning det behövs
    med hänsyn till den risk som kan förknippas med kundrelationen enligt 2 kap. 3
    §. När det behövs för att bedöma risken ska omständigheter hänförliga till förmånstagaren
    också beaktas.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.3
  mal:
  - *id006
  - *id005
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-4-1
  kalla: SRC-PTL
  lagrum: 4 kap. 1 §
  lydelser:
  - LYD-PTL-4-1-2017-08-01
  grund: ska_krav
  text: En verksamhetsutövare ska övervaka pågående affärsförbindelser och bedöma
    enstaka transaktioner i syfte att upptäcka aktiviteter och transaktioner som 1.
    avviker från vad verksamhetsutövaren har anledning att räkna med utifrån den kännedom
    om kunden som verksamhetsutövaren har, 2. avviker från vad verksamhetsutövaren
    har anledning att räkna med utifrån den kännedom som verksamhetsutövaren har om
    sina kunder, de produkter och tjänster som tillhandahålls, de uppgifter som kunden
    lämnar och övriga omständigheter, eller 3. utan att vara avvikande enligt 1 eller
    2 kan antas ingå som ett led i penningtvätt eller finansiering av terrorism. Inriktningen
    och omfattningen av övervakningen ska bestämmas med beaktande av de risker som
    identifierats i den allmänna riskbedömningen, den risk för penningtvätt och finansiering
    av terrorism som kan förknippas med kundrelationen och annan information om tillvägagångssätt
    för penningtvätt eller finansiering av terrorism.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.4
  mal:
