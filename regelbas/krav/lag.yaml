- id: KRV-PTL-6-4a
  kalla: SRC-PTL
  lagrum: 6 kap. 4 a §
  lydelser:
  - LYD-PTL-6-4a-2020-01-01
  grund: ska_krav
  text: En verksamhetsutövare ska ha rutiner och vidta de åtgärder i övrigt som behövs
    för att skydda anställda, uppdragstagare och andra som på liknande grund deltar
    i verksamheten från hot, hämnd eller andra fientliga åtgärder till följd av att
    de gjort en anmälan om misstänkta överträdelser av bestämmelserna i denna lag
    eller i föreskrifter som meddelats med stöd av lagen. En verksamhetsutövare får
    inte utsätta en anställd, en uppdragstagare eller någon annan som på liknande
    grund deltar i verksamheten för repressalier på grund av att denne har gjort en
    anmälan.
  galler_om:
    alla: []
  belagg:
  - dokument
  - beslut
  uppfylls_i:
  - D-RR.6
  mal:
