- id: KRV-PTL-5-6
  kalla: SRC-PTL
  lagrum: 5 kap. 6 §
  lydelser:
  - LYD-PTL-5-6-2023-01-01
  grund: ska_krav
  text: Personuppgifter som avses i artikel 10 i EU:s dataskyddsförordning får behandlas
    endast om det är nödvändigt för att 1. bedöma den risk som kan förknippas med
    kundrelationen enligt 2 kap. 3 §, 2. uppfylla övervakningsskyldigheten enligt
    4 kap. 1 §, 3. bedöma misstänkta transaktioner och aktiviteter enligt 4 kap. 2
    §, 4. lämna uppgifter enligt 4 kap. 3 och 6 §§, och 5. lämna uppgifter i samverkan
    enligt 4 a kap. Personuppgifterna får också behandlas vid bevarande av handlingar
    och uppgifter enligt 3 och 4 §§, om det är tillåtet att behandla uppgifterna enligt
    första stycket.
  galler_om:
    alla: []
