- id: KRV-PTL-1-10
  kalla: SRC-PTL
  lagrum: 1 kap. 10 §
  lydelser:
  - LYD-PTL-1-10-2017-08-01
  grund: ska_krav
  text: Med familjemedlem till en person i politiskt utsatt ställning avses make,
    registrerad partner, sambo, barn och deras makar, registrerade partner eller sambor
    samt föräldrar. Med känd medarbetare till en person i politiskt utsatt ställning
    avses 1. fysisk person som, enligt vad som är känt eller finns anledning att förmoda,
    gemensamt med en person i politiskt utsatt ställning är verklig huvudman till
    en juridisk person eller juridisk konstruktion eller som på annat sätt har eller
    har haft nära förbindelser med en person i politiskt utsatt ställning, och 2.
    fysisk person som ensam är verklig huvudman till en juridisk person eller juridisk
    konstruktion som, enligt vad som är känt eller finns anledning att förmoda, egentligen
    har upprättats till förmån för en person i politiskt utsatt ställning. Med nära
    förbindelser i andra stycket 1 avses nära affärsförbindelser och andra förbindelser
    som kan medföra att den kända medarbetaren kan förknippas med förhöjd risk för
    penningtvätt eller finansiering av terrorism.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.1
  mal:
  - *id001
  - *id002
  sakkunnig:
