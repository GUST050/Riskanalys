- id: KRV-PTL-2-9
  kalla: SRC-PTL
  lagrum: 2 kap. 9 §
  lydelser:
  - LYD-PTL-2-9-2017-08-01
  grund: ska_krav
  text: En verksamhetsutövare som är det yttersta moderföretaget i en koncern ska
    fastställa gemensamma rutiner och riktlinjer för koncernen. De gemensamma rutinerna
    och riktlinjerna ska åtminstone omfatta rutiner och riktlinjer för behandling
    av personuppgifter och informationsutbyte inom koncernen för att säkerställa att
    information om misstänkt penningtvätt och finansiering av terrorism och andra
    relevanta uppgifter vid behov sprids till berörda inom koncernen.
  galler_om:
    falt: P-ORG.koncernmoder
    op: ==
    varde: true
