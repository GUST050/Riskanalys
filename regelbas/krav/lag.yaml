- id: KRV-PTL-2-4
  kalla: SRC-PTL
  lagrum: 2 kap. 4 §
  lydelser:
  - LYD-PTL-2-4-2020-01-01
  grund: ska_krav
  text: Som omständigheter som kan tyda på att risken för penningtvätt och finansiering
    av terrorism är låg kan verksamhetsutövaren beakta bland annat att kunden 1. är
    en stat, en region, en kommun eller motsvarande eller en juridisk person över
    vilken en stat, en region, en kommun eller motsvarande, var för sig eller tillsammans,
    har ett direkt eller indirekt rättsligt bestämmande inflytande, 2. har hemvist
    inom EES, 3. har hemvist i en stat som har bestämmelser om åtgärder mot penningtvätt
    och finansiering av terrorism som motsvarar dem i denna lag och som tillämpar
    dessa bestämmelser på ett effektivt sätt, 4. har hemvist i en stat som har en
    låg nivå av korruption och annan relevant brottslighet, och 5. är ett företag
    vars överlåtbara värdepapper är upptagna till handel på en reglerad marknad inom
    EES eller på en motsvarande marknad utanför EES.
  galler_om:
    alla: []
  belagg:
  - dokument
  - beslut
  uppfylls_i:
  - D-RR.1
  mal:
  - *id003
  - *id002
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-2-5
  kalla: SRC-PTL
  lagrum: 2 kap. 5 §
  lydelser:
  - LYD-PTL-2-5-2017-08-01
  grund: ska_krav
  text: Som omständigheter som kan tyda på att risken för penningtvätt eller finansiering
    av terrorism är hög kan verksamhetsutövaren beakta bland annat att 1. kundens
    ägarstruktur framstår som ovanlig eller alltför komplicerad för dess verksamhet,
    2. kunden bedriver kontantintensiv verksamhet, 3. kunden är en juridisk person
    som har nominella aktieägare eller andelar utställda på innehavaren, 4. kunden
    är en juridisk person, en trust eller en liknande juridisk konstruktion som har
    till syfte att förvalta en viss fysisk persons tillgångar, 5. kunden har hemvist
    i en stat som saknar effektiva system för bekämpning av penningtvätt eller finansiering
    av terrorism, 6. kunden har hemvist i en stat med betydande korruption och annan
    relevant brottslighet, 7. kunden har hemvist i en stat som är föremål för sanktioner,
    embargon eller liknande åtgärder, 8. kunden har hemvist i en stat som finansierar
    eller stöder terroristverksamhet eller där terroristorganisationer är verksamma,
    9. affärsrelationer eller transaktioner sker på distans, utan användning av metoder
    som på ett tillförlitligt sätt kan säkerställa kundens identitet, och 10. betalning
    av varor eller tjänster görs av någon som är okänd eller saknar koppling till
    kunden. brevlådebanker
  galler_om:
    alla: []
  belagg:
  - dokument
  - beslut
  uppfylls_i:
