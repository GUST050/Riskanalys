    status: ej_granskad
- id: KRV-PTL-6-2
  kalla: SRC-PTL
  lagrum: 6 kap. 2 §
  lydelser:
  - LYD-PTL-6-2-2017-08-01
  grund: ska_krav
  text: När det är motiverat med hänsyn till verksamhetens storlek och art, ska en
    verksamhetsutövare 1. utse en medlem av ledningsgruppen, verkställande direktören
    eller motsvarande befattningshavare som ska ansvara för att verksamhetsutövaren
    genomför de åtgärder som krävs för att följa denna lag och de föreskrifter som
    meddelats med stöd av lagen, 2. utse en person att löpande kontrollera att verksamhetsutövaren
    fullgör sina skyldigheter enligt denna lag eller föreskrifter som meddelats med
    stöd av lagen (centralt funktionsansvarig), och 3. inrätta en oberoende granskningsfunktion
    med ansvar för att granska de interna riktlinjer, kontroller och förfaranden som
    syftar till att verksamhetsutövaren ska fullgöra sina skyldigheter enligt denna
    lag eller föreskrifter som meddelats med stöd av lagen. Den som är centralt funktionsansvarig
    ska ansvara för rapporter till Polismyndigheten enligt 4 kap. 3 §.
  galler_om:
    alla: []
  belagg:
  - dokument
  - beslut
