- id: KRV-PTL-2-10
  kalla: SRC-PTL
  lagrum: 2 kap. 10 §
  lydelser:
  - LYD-PTL-2-10-2017-08-01
  grund: ska_krav
  text: En verksamhetsutövare som avses i 9 § första stycket ska se till att gemensamma
    rutiner och riktlinjer tillämpas inom koncernen.
  galler_om:
