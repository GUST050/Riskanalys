- id: KRV-PTL-1-2
  kalla: SRC-PTL
  lagrum: 1 kap. 2 §
  lydelser:
  - LYD-PTL-1-2-2025-07-01
  - LYD-PTL-1-2-2026-11-20
  grund: ska_krav
  text: Denna lag gäller för fysiska och juridiska personer som driver 1. bank- eller
    finansieringsrörelse enligt lagen (2004:297) om bank- och finansieringsrörelse,
    2. livförsäkringsrörelse, dock inte a) sådan som drivs av försäkringsföreningar
    som har beviljats undantag enligt 1 kap. 19 d § försäkringsrörelselagen (2010:2043),
    eller b) tjänstepensionsverksamhet enligt lagen (2019:742) om tjänstepensionsföretag,
    3. värdepappersrörelse enligt 2 kap. 1 § lagen (2007:528) om värdepappersmarknaden,
    4. verksamhet enligt lagen (1996:1006) om viss finansiell verksamhet, 5. försäkringsdistribution
    enligt lagen (2018:1219) om försäkringsdistribution, i fråga om sådan verksamhet
    rörande livförsäkring, bedriven av sådana försäkringsförmedlare som har tillstånd
    enligt 2 kap. 1 § den lagen eller bedriver verksamhet enligt 3 kap. 1 § andra
    stycket 2 eller 3 § den lagen, 6. verksamhet enligt lagen (2011:755) om elektroniska
    pengar, 7. fondverksamhet enligt lagen (2004:46) om värdepappersfonder, 8. verksamhet
    som betalningsinstitut enligt lagen (2010:751) om betaltjänster, 9. verksamhet
    som registrerad betaltjänstleverantör enligt lagen om betaltjänster, 10. verksamhet
    som förvaltare av alternativa investeringsfonder enligt lagen (2013:561) om förvaltare
    av alternativa investeringsfonder, 11. verksamhet med bostadskrediter enligt lagen
    (2016:1024) om verksamhet med bostadskrediter och vissa andra konsumentkrediter,
    12. verksamhet som leverantör av gräsrotsfinansieringstjänster enligt Europaparlamentets
    och rådets förordning (EU) 2020/1503 av den 7 oktober 2020 om europeiska leverantörer
    av gräsrotsfinansieringstjänster för företag och om ändring av förordning (EU)
    2017/1129 och direktiv (EU) 2019/1937, om företaget är en juridisk person som
    är etablerad i Sverige, 13. verksamhet som leverantör av kryptotillgångstjänster
    enligt Europaparlamentets och rådets förordning (EU) 2023/1114 av den 31 maj 2023
    om marknader för kryptotillgångar och om ändring av förordningarna (EU) nr 1093/2010
    och (EU) nr 1095/2010 samt direktiven 2013/36/EU och (EU) 2019/1937, 14. verksamhet
    som fastighetsmäklare eller fastighetsmäklarföretag med särskild registrering
    för hyresförmedling eller fullständig registrering enligt fastighetsmäklarlagen
    (2021:516), 15. spelverksamhet som bedrivs med licens eller registrering enligt
    spellagen (2018:1138), 16. yrkesmässig handel med varor, om det kan antas att
    det i verksamheten eller i en del av verksamheten genomförs eller kommer att genomföras
    transaktioner, enstaka eller sådana som kan antas ha samband, som innebär att
    ett utbetalt eller mottaget belopp i kontanter uppgår till motsvarande 5 000 euro
    eller mer, 17. verksamhet enligt pantbankslagen (1995:1000), 18. verksamhet som
    auktoriserad eller godkänd revisor eller registrerat revisionsbolag, 19. yrkesmässig
    verksamhet som avser bokföringstjänster eller revisionstjänster som inte omfattas
    av 18, 20. yrkesmässig rådgivning avseende skatter och avgifter (skatterådgivare),
    21. verksamhet som advokat eller advokatbolag, till den del verksamheten avser
    tjänster som anges i 4 § första stycket, 22. yrkesmässig verksamhet som annan
    oberoende jurist än den som avses i 21, till den del verksamheten avser tjänster
    som anges i 4 § första stycket, 23. yrkesmässig verksamhet till den del verksamheten
    avser tjänster som anges i 4 § andra stycket och verksamhetsutövaren inte är en
    sådan person som avses i 18-22, eller 24. yrkesmässig verksamhet som avser förmedling,
    förvaring eller handel med konstverk, om det kan antas att det i verksamheten
    eller i en del av verksamheten genomförs eller kommer att genomföras transaktioner,
    enstaka eller sådana som kan antas ha samband, som innebär att ett utbetalt eller
    mottaget belopp uppgår till motsvarande 10 000 euro eller mer. Vissa speltjänster
    får undantas från tillämpning av lagen eller bestämmelser i den enligt föreskrifter
    som meddelas med stöd av 8 kap. 1 § 1.
  galler_om:
