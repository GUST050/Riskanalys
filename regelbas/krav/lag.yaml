- id: KRV-PTL-6-4
  kalla: SRC-PTL
  lagrum: 6 kap. 4 §
  lydelser:
  - LYD-PTL-6-4-2024-12-30
  grund: ska_krav
  text: En verksamhetsutövare ska tillhandahålla ändamålsenliga rapporteringssystem
    för anställda, uppdragstagare och andra som på liknande grund deltar i verksamheten
    och som vill göra anmälningar om misstänkta överträdelser av bestämmelserna i
    denna lag eller föreskrifter som meddelats med stöd av lagen. För verksamhetsutövare
    som omfattas av Europaparlamentets och rådets förordning (EU) 2023/1113 ska rapporteringssystemen
    även möjliggöra anmälningar av misstänkta överträdelser av bestämmelserna i den
    förordningen.
  galler_om:
    alla: []
  belagg:
  - dokument
  - beslut
  uppfylls_i:
  - D-RR.6
