- id: KRV-PTL-1-8
  kalla: SRC-PTL
  lagrum: 1 kap. 8 §
  lydelser:
  - LYD-PTL-1-8-2020-04-01
  grund: ska_krav
  text: 'I denna lag avses med 1. affärsförbindelse: en affärsmässig förbindelse som
    när den etableras förväntas ha en viss varaktighet, 2. brevlådebank: ett utländskt
    institut som är registrerat inom en jurisdiktion inom vilken institutet saknar
    verklig etablering och ledning och där institutet inte heller ingår i en finansiell
    grupp som omfattas av tillsyn, 3. EES: Europeiska ekonomiska samarbetsområdet,
    4. kund: den som har trätt eller står i begrepp att träda i avtalsförbindelse
    med sådan verksamhetsutövare som avses i denna lag, 5. person i politiskt utsatt
    ställning: fysisk person som har eller har haft en viktig offentlig funktion i
    en stat eller i en internationell organisation, 6. verklig huvudman: detsamma
    som i 1 kap. 3-7 §§ lagen (2017:631) om registrering av verkliga huvudmän, 7.
    koncern, moderföretag och dotterföretag: detsamma som i 1 kap. 4 § årsredovisningslagen
    (1995:1554) eller motsvarande utländska företeelser, 8. verksamhetsutövare: en
    fysisk eller juridisk person som utför verksamhet som omfattas av denna lag, och
    9. behörig beslutsfattare: styrelseledamot, verkställande direktör eller annan
    befattningshavare som har tillräckliga kunskaper om verksamhetsutövarens riskexponering
    mot penningtvätt och finansiering av terrorism och som har tillräckliga befogenheter
    att fatta beslut som påverkar dess riskexponering.'
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.1
