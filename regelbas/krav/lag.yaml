    typ: kundmall
    id: KM-D
    etapp: M2
  - &id008
    typ: dokument
    id: D-RR.4
    etapp: M6
  - typ: drift
    id: DRIFT-MISSTANKE
    etapp: M4
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-4-2
  kalla: SRC-PTL
  lagrum: 4 kap. 2 §
  lydelser:
  - LYD-PTL-4-2-2017-08-01
  grund: ska_krav
  text: Om avvikelser eller misstänkta aktiviteter eller transaktioner uppmärksammas
    enligt 1 § eller på annat sätt, ska en verksamhetsutövare genom skärpta åtgärder
    för kundkännedom enligt 3 kap. 16 § och andra nödvändiga åtgärder bedöma om det
    finns skälig grund att misstänka att det är fråga om penningtvätt eller finansiering
    av terrorism eller att egendom annars härrör från brottslig handling. När en verksamhetsutövare
    anser att det finns skälig grund att misstänka att det är fråga om penningtvätt
    eller finansiering av terrorism eller att egendom annars härrör från brottslig
    handling, behöver ytterligare åtgärder enligt första stycket inte vidtas.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.4
  mal:
  - *id007
  - *id008
  - typ: drift
    id: DRIFT-MISSTANKE
    etapp: M4
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-4-3
  kalla: SRC-PTL
  lagrum: 4 kap. 3 §
  lydelser:
  - LYD-PTL-4-3-2017-08-01
  grund: ska_krav
  text: Om en verksamhetsutövare efter en bedömning enligt 2 § har skälig grund att
    misstänka penningtvätt eller finansiering av terrorism eller att egendom annars
    härrör från brottslig handling, ska uppgifter om alla omständigheter som kan tyda
    på detta utan dröjsmål rapporteras till Polismyndigheten. En sådan rapport ska
    göras även om transaktioner inte genomförs liksom om det före ingåendet av en
    affärsförbindelse eller utförandet av en transaktion uppkommer misstanke om att
    kunden avser att använda verksamhetsutövarens produkter eller tjänster för penningtvätt
    eller finansiering av terrorism. Om den egendom som avses i rapporten till Polismyndigheten
    finns hos verksamhetsutövaren ska detta anges särskilt, liksom i förekommande
    fall uppgifter om 1. vilka tillgodohavanden kunden har hos verksamhetsutövaren,
    2. huruvida verksamhetsutövaren avstått från att genomföra en misstänkt transaktion,
    och 3. mottagare av en misstänkt transaktion.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.4
  mal:
  - *id007
  - *id008
  - typ: drift
    id: DRIFT-MISSTANKE
    etapp: M4
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-4-6
  kalla: SRC-PTL
  lagrum: 4 kap. 6 §
  lydelser:
  - LYD-PTL-4-6-2024-07-01
  grund: ska_krav
  text: 'Följande fysiska eller juridiska personer ska på begäran av Polismyndigheten
    eller Säkerhetspolisen utan dröjsmål lämna alla uppgifter som behövs för en utredning
    om penningtvätt eller finansiering av terrorism: 1. en verksamhetsutövare, 2.
    ett clearingbolag, 3. den som tillhandahåller finansiell infrastruktur som avser
    omedelbara betalningar, och 4. den som bedriver eller under de senaste fem åren
    har bedrivit penninginsamling för humanitärt, välgörande, kulturellt eller något
    annat allmännyttigt ändamål. När uppgifter har lämnats enligt 3 §, ska även andra
    fysiska eller juridiska personer som avses i 1 kap. 2-5 §§ lämna de uppgifter
    för utredningen som Polismyndigheten eller Säkerhetspolisen begär.'
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.4
  mal:
  - *id007
  - *id008
  - typ: drift
    id: DRIFT-MISSTANKE
    etapp: M4
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-4-7
  kalla: SRC-PTL
  lagrum: 4 kap. 7 §
  lydelser:
  - LYD-PTL-4-7-2017-08-01
  grund: ska_krav
  text: En verksamhetsutövare ska ha ett system för att snabbt och fullständigt kunna
    lämna uppgifter om huruvida verksamhetsutövaren under de senaste fem åren har
    haft en affärsförbindelse med en viss person och, om så skulle vara fallet, om
    förbindelsens art.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.4
  mal:
  - *id007
  - *id008
  - typ: drift
    id: DRIFT-MISSTANKE
    etapp: M4
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-4-8
  kalla: SRC-PTL
  lagrum: 4 kap. 8 §
  lydelser:
  - LYD-PTL-4-8-2019-11-01
  grund: ska_krav
  text: Advokater och andra oberoende jurister, auktoriserade och godkända revisorer
    samt skatterådgivare är inte skyldiga att lämna uppgifter enligt 3 eller 6 § om
    vad som anförtrotts dem när de försvarar eller företräder en klient i fråga om
    ett rättsligt förfarande, inklusive rådgivning för att inleda eller undvika ett
    rättsligt förfarande. Detsamma gäller information som avser en klient och som
    de har fått del av i samband med att de bedömer klientens rättsliga situation.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.4
  mal:
  - *id007
  - *id008
  - typ: drift
    id: DRIFT-MISSTANKE
    etapp: M4
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-4-9
  kalla: SRC-PTL
  lagrum: 4 kap. 9 §
  lydelser:
  - LYD-PTL-4-9-2023-01-01
  grund: ska_krav
  text: En verksamhetsutövare eller den som är verksam hos verksamhetsutövaren får
    inte för en kund eller någon utomstående obehörigen röja att en bedömning enligt
    2 § utförs, har utförts eller kommer att utföras eller att uppgifter har lämnats
    enligt 3 eller 6 §. Som obehörigt röjande avses inte att 1. uppgifter lämnas till
    en tillsynsmyndighet eller en brottsbekämpande myndighet, 2. uppgifter lämnas
    mellan verksamhetsutövare som avses i 1 kap. 2 § första stycket 1-13 med hemvist
    i EES och som ingår i samma koncern eller mellan sådana verksamhetsutövare och
    deras filialer och dotterföretag belägna i ett land utanför EES, förutsatt att
    filialerna och dotterföretagen utanför EES tillämpar gemensamma rutiner som fastställts
    enligt 2 kap. 8 eller 9 § eller motsvarande krav enligt lagstiftningen i det land
    där filialen finns eller dotterföretaget har hemvist, 3. uppgifter lämnas mellan
    advokater, andra oberoende jurister, revisorer, tillhandahållare av bokföringstjänster,
    skatterådgivare och fastighetsmäklare som omfattas av Europaparlamentets och rådets
    direktiv (EU) 2015/849, i den ursprungliga lydelsen, eller likvärdiga bestämmelser
    i ett land utanför EES och som är anställda eller på annat sätt verksamma inom
    samma juridiska person eller olika juridiska personer med gemensamt ägande, gemensam
    ledning eller gemensam efterlevnadskontroll, 4. uppgifter som rör samma kund och
    samma transaktion och som omfattar fler än en verksamhetsutövare lämnas mellan
    sådana juridiska och fysiska personer som anges i 1 kap. 2 § första stycket 1-13
    och 18-22, förutsatt att de tillhör samma verksamhets- eller yrkeskategori och
    omfattas av skyldigheter i fråga om tystnadsplikt och skydd för personuppgifter
    som följer av denna lag, 5. en kund får kännedom om att åtgärder enligt första
    stycket vidtas eller kan komma att vidtas, när ett röjande inte kan undvikas till
    följd av verksamhetsutövarens skyldighet att avstå från en transaktion, att avstå
    från att inleda en affärsförbindelse eller att avsluta en affärsförbindelse enligt
    3 kap. 1-3 §§, och 6. uppgifter lämnas i samverkan enligt 4 a kap. Bestämmelser
    om ansvar för den som bryter mot tystnadsplikten enligt första stycket finns i
    20 kap. 3 § brottsbalken.
  galler_om:
    alla: []
