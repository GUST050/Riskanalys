  - typ: drift
    id: DRIFT-INTERN-KONTROLL
    etapp: M4
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-6-5
  kalla: SRC-PTL
  lagrum: 6 kap. 5 §
  lydelser:
  - LYD-PTL-6-5-2017-08-01
  grund: ska_krav
  text: Uppgift i en anmälan om en misstänkt överträdelse enligt 4 § får inte obehörigen
    röjas, om uppgiften kan avslöja anmälarens identitet. Ansvar enligt 20 kap. 3
    § brottsbalken ska inte följa för den som bryter mot förbudet i första stycket.
    I det allmännas verksamhet tillämpas i stället bestämmelserna i offentlighets-
    och sekretesslagen (2009:400). Om det i lag finns bestämmelser som avviker från
    första eller andra stycket, gäller de bestämmelserna.
  galler_om:
    alla: []
