- id: KRV-PTL-7-3
  kalla: SRC-PTL
  lagrum: 7 kap. 3 §
  lydelser:
  - LYD-PTL-7-3-2017-08-01
  grund: ska_krav
  text: Den som avser att driva verksamhet som anges i 1 § första stycket ska anmäla
    detta till Bolagsverket. Sådan verksamhet får inte drivas om anmälan inte har
    gjorts. Om en fysisk eller juridisk person som är antecknad i Bolagsverkets register
    anmäler att verksamheten har upphört eller om det på annat sätt framgår att så
    är fallet, ska verket ta bort personen ur registret.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i: []
  mal:
  - typ: drift
    id: DRIFT-REGISTRERING
    etapp: M4
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-7-6
  kalla: SRC-PTL
  lagrum: 7 kap. 6 §
  lydelser:
  - LYD-PTL-7-6-2023-01-01
  grund: ska_krav
  text: Den som i väsentlig utsträckning har åsidosatt skyldigheter i näringsverksamhet
    eller som har gjort sig skyldig till allvarlig brottslighet får inte ägna sig
    åt verksamhet som är anmälningspliktig enligt 3 §. Om verksamhetsutövaren är en
    juridisk person, gäller första stycket den som är verklig huvudman i den juridiska
    personen eller ingår i dess ledning. Verksamhetsutövaren ska anmäla förändringar
    i ledningen till tillsynsmyndigheten.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i: []
