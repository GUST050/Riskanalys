- id: KRV-PTL-2-3
  kalla: SRC-PTL
  lagrum: 2 kap. 3 §
  lydelser:
  - LYD-PTL-2-3-2017-08-01
  grund: ska_krav
  text: En verksamhetsutövare ska bedöma den risk för penningtvätt eller finansiering
    av terrorism som kan förknippas med kundrelationen (kundens riskprofil). Kundens
    riskprofil ska bestämmas med utgångspunkt i den allmänna riskbedömningen och verksamhetsutövarens
    kännedom om kunden. När det behövs för att bestämma kundens riskprofil ska verksamhetsutövaren
    beakta omständigheter som avses i 4 och 5 §§ och föreskrifter som meddelats med
    stöd av denna lag samt andra omständigheter som i det enskilda fallet påverkar
    risken som kan förknippas med kundrelationen. Kundens riskprofil ska följas upp
    under pågående affärsförbindelser och ändras när det finns anledning till det.
  galler_om:
    alla: []
  belagg:
  - dokument
  - beslut
  uppfylls_i:
