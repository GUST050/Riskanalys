- id: KRV-PTL-5-8
  kalla: SRC-PTL
  lagrum: 5 kap. 8 §
  lydelser:
  - LYD-PTL-5-8-2017-08-01
  grund: ska_krav
  text: En verksamhetsutövares register med uppgifter om misstänkt penningtvätt eller
    finansiering av terrorism får inte samköras med motsvarande register hos någon
    annan.
  galler_om:
