- id: KRV-PTL-4-10
  kalla: SRC-PTL
  lagrum: 4 kap. 10 §
  lydelser:
  - LYD-PTL-4-10-2023-01-01
  grund: ska_krav
  text: En verksamhetsutövare eller den som är verksam hos verksamhetsutövaren får
    inte göras ansvarig för att ha åsidosatt tystnadsplikt för uppgifter som lämnas
    med stöd av 3 eller 6 §, om personen hade anledning att räkna med att uppgiften
    borde lämnas. I fråga om europabolag och europakooperativ som har ett sådant förvaltningssystem
    som avses i artiklarna 39-42 i rådets förordning (EG) nr 2157/2001 av den 8 oktober
    2001 om stadga för europabolag respektive artiklarna 37-41 i rådets förordning
    (EG) nr 1435/2003 av den 22 juli 2003 om stadga för europeiska kooperativa föreningar
    (SCE-föreningar) ska bestämmelserna i första stycket och i 9 § tillämpas på en
    ledamot i tillsynsorganet. Av 16 § andra stycket och 22 § lagen (2004:575) om
    europabolag samt 21 § andra stycket och 26 § lagen (2006:595) om europakooperativ
    framgår att bestämmelserna i andra stycket ska tillämpas också på ledamöter i
    ett europabolags eller ett europakooperativs lednings- eller förvaltningsorgan.
    Särskilda bestämmelser om ansvar för revisorer i aktiebolag, ekonomiska föreningar,
    stiftelser och vissa andra företag finns i 5 kap. 2 § stiftelselagen (1994:1220),
    37 § revisionslagen (1999:1079), 29 kap. 2 § aktiebolagslagen (2005:551) och 21
    kap. 2 § lagen (2018:672) om ekonomiska föreningar.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.4
  mal:
  - *id007
  - *id008
  - typ: drift
    id: DRIFT-MISSTANKE
    etapp: M4
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-5-1
  kalla: SRC-PTL
  lagrum: 5 kap. 1 §
  lydelser:
  - LYD-PTL-5-1-2023-01-01
  grund: ska_krav
  text: I detta kapitel finns bestämmelser om behandling av personuppgifter enligt
    denna lag för 1. verksamhetsutövare (2-11 §§ ), och 2. andra än verksamhetsutövare
    (12 och 13 §§ ). Kapitlet gäller om behandlingen helt eller delvis är automatiserad
    eller om personuppgifterna ingår i eller är avsedda att ingå i en strukturerad
    samling av personuppgifter som är tillgängliga för sökning eller sammanställning
    enligt särskilda kriterier.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.5
  mal:
  - &id009
    typ: dokument
    id: D-RR.5
    etapp: M6
  - typ: drift
    id: DRIFT-BEVARANDE
    etapp: M4
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-5-2
  kalla: SRC-PTL
  lagrum: 5 kap. 2 §
  lydelser:
  - LYD-PTL-5-2-2017-08-01
  grund: ska_krav
  text: En verksamhetsutövare får behandla personuppgifter i syfte att kunna fullgöra
    sina skyldigheter enligt denna lag.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.5
  mal:
  - *id009
  - typ: drift
    id: DRIFT-BEVARANDE
    etapp: M4
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-5-3
  kalla: SRC-PTL
  lagrum: 5 kap. 3 §
  lydelser:
  - LYD-PTL-5-3-2017-08-01
  grund: ska_krav
  text: En verksamhetsutövare ska i fem år bevara handlingar och uppgifter, om handlingarna
    och uppgifterna avser 1. åtgärder som har vidtagits för kundkännedom enligt 3
    kap. och 4 kap. 2 §, eller 2. transaktioner som genomförts med kunder inom ramen
    för affärsförbindelser eller vid enstaka transaktioner som omfattas av krav på
    åtgärder för kundkännedom enligt 3 kap. 4–6 §§. Tiden ska räknas från det att
    åtgärderna eller transaktionerna utfördes eller, i de fall då en affärsförbindelse
    har etablerats, affärsförbindelsen upphörde. Om en enstaka transaktion inte har
    genomförts till följd av misstanke om penningtvätt eller finansiering av terrorism,
    ska tiden räknas från det att avståendet skedde.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.5
  mal:
  - *id009
  - typ: drift
    id: DRIFT-BEVARANDE
    etapp: M4
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-5-4
  kalla: SRC-PTL
  lagrum: 5 kap. 4 §
  lydelser:
  - LYD-PTL-5-4-2024-12-30
  grund: ska_krav
  text: Om det är nödvändigt för att förebygga, upptäcka eller utreda penningtvätt
    eller finansiering av terrorism får verksamhetsutövare bevara handlingar och uppgifter
    enligt 3 § under en längre tid än fem år. Den sammanlagda tiden får dock inte
    överstiga tio år. Första stycket gäller också i fråga om handlingar och uppgifter
    som ska bevaras enligt artikel 16 i Europaparlamentets och rådets förordning (EU)
    2023/1113.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.5
  mal:
  - *id009
  - typ: drift
    id: DRIFT-BEVARANDE
    etapp: M4
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-5-5
  kalla: SRC-PTL
  lagrum: 5 kap. 5 §
  lydelser:
  - LYD-PTL-5-5-2023-01-01
  grund: ska_krav
  text: Personuppgifter som avses i artikel 9.1 i Europaparlamentets och rådets förordning
    (EU) 2016/679 av den 27 april 2016 om skydd för fysiska personer med avseende
    på behandling av personuppgifter och om det fria flödet av sådana uppgifter och
    om upphävande av direktiv 95/46/EG (allmän dataskyddsförordning), här benämnd
    EU:s dataskyddsförordning, får behandlas endast om det är nödvändigt för att 1.
    bedöma om kunden är en person i politiskt utsatt ställning eller familjemedlem
    eller känd medarbetare till en sådan person enligt 1 kap. 8-10 §§, 2. bedöma den
    risk som kan förknippas med kundrelationen enligt 2 kap. 3 §, 3. uppfylla övervakningsskyldigheten
    enligt 4 kap. 1 §, 4. bedöma misstänkta transaktioner och aktiviteter enligt 4
    kap. 2 §, 5. lämna uppgifter enligt 4 kap. 3 och 6 §§, och 6. lämna uppgifter
    i samverkan enligt 4 a kap. Personuppgifterna får också behandlas vid bevarande
    av handlingar och uppgifter enligt 3 och 4 §§, om det är tillåtet att behandla
    uppgifterna enligt första stycket.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.5
  mal:
  - *id009
  - typ: drift
    id: DRIFT-BEVARANDE
