- id: KRV-PTL-6-1
  kalla: SRC-PTL
  lagrum: 6 kap. 1 §
  lydelser:
  - LYD-PTL-6-1-2017-08-01
  grund: ska_krav
  text: En verksamhetsutövare ska ha rutiner och riktlinjer för intern kontroll. Om
    en verksamhetsutövare använder modeller för riskbedömning, riskklassificering,
    övervakning eller andra förfaranden, ska verksamhetsutövaren ha rutiner för modellriskhantering.
    Rutinerna för modellriskhantering ska syfta till att utvärdera och kvalitetssäkra
    de modeller som verksamhetsutövaren använder. Omfattningen av och innehållet i
    rutinerna och riktlinjerna ska bestämmas med hänsyn till verksamhetsutövarens
    storlek och art samt den risk för penningtvätt och finansiering av terrorism som
    identifierats i den allmänna riskbedömningen.
  galler_om:
    alla: []
  belagg:
  - dokument
  - beslut
  uppfylls_i:
