- id: KRV-PTL-2-1
  kalla: SRC-PTL
  lagrum: 2 kap. 1 §
  lydelser:
  - LYD-PTL-2-1-2017-08-01
  grund: ska_krav
  text: En verksamhetsutövare ska göra en bedömning av hur de produkter och tjänster
    som tillhandahålls i verksamheten kan utnyttjas för penningtvätt eller finansiering
    av terrorism och hur stor risken är för att detta sker (allmän riskbedömning).
    Vid den allmänna riskbedömningen ska det särskilt beaktas vilka slags produkter
    och tjänster som tillhandahålls, vilka kunder och distributionskanaler som finns
    och vilka geografiska riskfaktorer som föreligger. Hänsyn ska också tas till uppgifter
    som kommer fram vid verksamhetsutövarens rapportering av misstänkta aktiviteter
    och transaktioner samt till information om tillvägagångssätt för penningtvätt
    och finansiering av terrorism och andra relevanta uppgifter som myndigheter lämnar.
  galler_om:
    alla: []
  belagg:
  - dokument
  - beslut
  uppfylls_i:
  - D-ARB.1
  mal:
  - typ: dokument
    id: D-ARB.1
    etapp: M1
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-2-2
  kalla: SRC-PTL
  lagrum: 2 kap. 2 §
  lydelser:
  - LYD-PTL-2-2-2017-08-01
  grund: ska_krav
  text: Omfattningen av den allmänna riskbedömningen ska bestämmas med hänsyn till
    verksamhetsutövarens storlek och art och de risker för penningtvätt eller finansiering
    av terrorism som kan antas föreligga. Riskbedömningen ska utformas så att den
    kan ligga till grund för verksamhetsutövarens rutiner, riktlinjer och övriga åtgärder
    mot penningtvätt och finansiering av terrorism. Den allmänna riskbedömningen ska
    dokumenteras och hållas uppdaterad.
  galler_om:
    alla: []
  belagg:
  - dokument
  - beslut
