- id: KRV-PTL-1-4
  kalla: SRC-PTL
  lagrum: 1 kap. 4 §
  lydelser:
  - LYD-PTL-1-4-2021-11-10
  grund: ska_krav
  text: Tjänster som avses i 2 § första stycket 21 och 22 omfattar 1. handlande i
    en klients namn för dennes räkning vid finansiella transaktioner eller transaktioner
    med fastigheter, och 2. hjälp vid planering eller genomförande av transaktioner
    för en klients räkning vid a) köp och försäljning av fastigheter eller företag,
    b) förvaltning av klientens pengar, värdepapper eller andra tillgångar, c) öppnande
    eller förvaltning av bank-, spar- eller värdepapperskonton, d) anskaffande av
    nödvändigt kapital för bildande, drift eller ledning av företag, och e) bildande,
    drift eller ledning av bolag, föreningar, stiftelser eller truster och liknande
    juridiska konstruktioner. Tjänster som avses i 2 § första stycket 23 omfattar
    1. bildande av juridiska personer, försäljning av nybildade aktiebolag och förmedling
    av svenska eller utländska juridiska personer, 2. fullgörande av funktion som
    styrelseledamot eller bolagsrättsligt ansvarig, som bolagsman i handels- eller
    kommanditbolag eller i någon liknande ställning i förhållande till andra juridiska
    personer, 3. tillhandahållande av ett registrerat kontor eller en postadress och
    därmed sammanhängande tjänster till en fysisk person, en juridisk person eller
    en trust eller en liknande juridisk konstruktion, 4. förvaltning av en trust eller
    en liknande juridisk konstruktion, och 5. funktion som nominell aktieägare för
    någon annans räkning eller åtgärder som syftar till att någon annan ska ha en
    sådan funktion, med undantag för uppdrag åt en juridisk person som är noterad
    på en reglerad marknad.
  galler_om:
    alla: []
