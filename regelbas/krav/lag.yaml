  mal:
  - *id003
  - *id002
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-2-8
  kalla: SRC-PTL
  lagrum: 2 kap. 8 §
  lydelser:
  - LYD-PTL-2-8-2017-08-01
  grund: ska_krav
  text: En verksamhetsutövare ska ha dokumenterade rutiner och riktlinjer avseende
    sina åtgärder för kundkännedom, övervakning och rapportering samt för behandling
    av personuppgifter. Rutinerna och riktlinjerna ska fortlöpande anpassas efter
    nya och förändrade risker för penningtvätt och finansiering av terrorism. Rutinernas
    och riktlinjernas omfattning och innehåll ska bestämmas med hänsyn till verksamhetsutövarens
    storlek, art och riskerna för penningtvätt och finansiering av terrorism som identifierats
    i den allmänna riskbedömningen.
  galler_om:
    alla: []
