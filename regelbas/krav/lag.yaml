- id: KRV-PTL-2-11
  kalla: SRC-PTL
  lagrum: 2 kap. 11 §
  lydelser:
  - LYD-PTL-2-11-2017-08-01
  grund: ska_krav
  text: En verksamhetsutövare som avses i 9 § första stycket ska se till att dotterföretag
    med hemvist i ett land utanför EES (hemviststaten) tillämpar bestämmelserna i
    denna lag och föreskrifter som meddelats med stöd av lagen, om bestämmelserna
    för att förhindra penningtvätt och finansiering av terrorism är mindre ingripande
    i det landet. Första stycket gäller även verksamhetsutövare som har filialer i
    ett land utanför EES.
  galler_om:
    falt: P-ORG.koncernmoder
    op: ==
    varde: true
  belagg:
  - dokument
  - beslut
  uppfylls_i:
  - D-RR.2
  mal:
  - *id004
  - typ: drift
    id: DRIFT-ORGANISATION
    etapp: M4
  sakkunnig:
    status: ej_granskad
- id: KRV-PTL-2-12
  kalla: SRC-PTL
  lagrum: 2 kap. 12 §
  lydelser:
  - LYD-PTL-2-12-2017-08-01
  grund: ska_krav
  text: Om kraven i 10 eller 11 § inte kan uppfyllas i fråga om ett dotterföretag
    utanför EES på grund av bestämmelser i hemviststaten, ska en verksamhetsutövare
    som avses i 9 § första stycket vidta åtgärder för att effektivt hantera den ökade
    risken för penningtvätt och finansiering av terrorism som därigenom uppkommer.
    Första stycket gäller även verksamhetsutövare som har filialer i ett land utanför
    EES. Verksamhetsutövaren ska underrätta tillsynsmyndigheten om kraven inte kan
    uppfyllas.
  galler_om:
    falt: P-ORG.koncernmoder
    op: ==
    varde: true
  belagg:
