- id: KRV-PTL-1-9
  kalla: SRC-PTL
  lagrum: 1 kap. 9 §
  lydelser:
  - LYD-PTL-1-9-2020-04-01
  grund: ska_krav
  text: Med viktig offentlig funktion i en stat avses funktioner som 1. stats- eller
    regeringschefer, ministrar samt vice och biträdande ministrar, 2. parlamentsledamöter
    och ledamöter av liknande lagstiftande organ, 3. ledamöter i styrelsen för politiska
    partier, 4. domare i högsta domstol, konstitutionell domstol eller andra rättsliga
    organ på hög nivå vilkas beslut endast undantagsvis kan överklagas, 5. högre tjänstemän
    vid revisionsmyndigheter och ledamöter i centralbankers styrande organ, 6. ambassadörer,
    beskickningschefer samt höga officerare i försvarsmakten, och 7. personer som
    ingår i statsägda företags förvaltnings-, lednings- eller kontrollorgan. Med viktig
    offentlig funktion i en internationell organisation avses funktioner som direktörer,
    biträdande direktörer, styrelseledamöter och innehavare av liknande poster.
  galler_om:
    alla: []
  belagg:
  - dokument
  uppfylls_i:
  - D-RR.1
