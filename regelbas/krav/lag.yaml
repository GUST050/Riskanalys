- id: KRV-PTL-5-11
  kalla: SRC-PTL
  lagrum: 5 kap. 11 §
  lydelser:
  - LYD-PTL-5-11-2017-08-01
  grund: ska_krav
  text: Den som är verksam hos en verksamhetsutövare får inte obehörigen röja att
    personuppgifter behandlas enligt 5 och 6 §§ eller 4 kap. 2, 3 och 6 §§ och att
    sådana uppgifter bevaras enligt 3 och 4 §§. Ansvar enligt 20 kap. 3 § brottsbalken
    ska inte följa för den som bryter mot förbudet i första stycket.
  galler_om:
